# ConfigMap axiz-common: configuration shared by every service of a namespace (each chart mounts it
# in /etc/axiz/config/common, read before the service's own ConfigMap). One per environment
# namespace (kind/up.sh applies it to the demo cluster); apply with
#   kubectl -n payments-<env> apply -f deploy/platform/axiz-common.yaml
# The business calendar is maintained by operations (official holidays are published yearly).
apiVersion: v1
kind: ConfigMap
metadata:
  name: axiz-common-2-0-0
  labels:
    app.kubernetes.io/part-of: axiz-demo
immutable: true
data:
  application.yaml: |
    axiz.foundation.zone: America/Lima
    axiz.foundation.calendar.recurring-holidays:
      - "01-01"   # Año Nuevo
      - "05-01"   # Día del Trabajo
      - "06-07"   # Batalla de Arica y Día de la Bandera
      - "06-29"   # San Pedro y San Pablo
      - "07-23"   # Día de la Fuerza Aérea
      - "07-28"   # Fiestas Patrias
      - "07-29"   # Fiestas Patrias
      - "08-06"   # Batalla de Junín
      - "08-30"   # Santa Rosa de Lima
      - "10-08"   # Combate de Angamos
      - "11-01"   # Todos los Santos
      - "12-08"   # Inmaculada Concepción
      - "12-09"   # Batalla de Ayacucho
      - "12-25"   # Navidad
    axiz.foundation.calendar.holidays:
      - "2026-04-02"   # Jueves Santo
      - "2026-04-03"   # Viernes Santo
      - "2027-03-25"   # Jueves Santo
      - "2027-03-26"   # Viernes Santo
    management.opentelemetry.resource-attributes.deployment.environment: ${axiz.config.environment}
