openapi: 3.1.0
info:
  title: Payment history
  version: 1.0.0
  description: >
    Read model of the payments of each customer (fictitious payment processor of the axiz demo),
    projected from the payment order events. Eventually consistent with payment-orders.
tags:
  - name: payment-history
# Any authenticated caller with payments:channel or payments:read; the service checks which.
security: [{oauth2: []}]
paths:
  /v1/customers/{customerId}/payments:
    parameters:
      - {name: customerId, in: path, required: true, schema: {type: string, maxLength: 20}}
    get:
      operationId: listCustomerPayments
      tags: [payment-history]
      summary: Payments of a customer, latest change first
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/PaymentStatus'}}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200':
          description: Page of payments
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentHistoryPage'}
              example: {items: [{paymentId: 0190a1b2-0000-7000-8000-000000000001, operationNumber: OP20261011-00000001, customerId: C-1001, status: COMPLETED, amount: 150.75, currency: PEN, creditorCci: '****************9053', processingDate: '2026-10-12', lastChangeAt: '2026-10-11T15:00:05Z'}], page: 0, size: 20, totalElements: 1}
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/payments/{paymentId}:
    parameters:
      - {name: paymentId, in: path, required: true, schema: {type: string, maxLength: 64}}
    get:
      operationId: getPayment
      tags: [payment-history]
      summary: Gets the projected state of a payment
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentHistoryItem'}
              example: {paymentId: 0190a1b2-0000-7000-8000-000000000001, operationNumber: OP20261011-00000001, customerId: C-1001, status: REJECTED, reason: Insufficient funds, amount: 150.75, currency: PEN, creditorCci: '****************9053', processingDate: '2026-10-12', lastChangeAt: '2026-10-11T15:00:05Z'}
        '404':
          description: Not found (yet)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Bearer access token issued by the payments identity provider (Keycloak in the demo).
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8180/realms/axiz/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/axiz/protocol/openid-connect/token
          scopes:
            payments:channel: Customer channel operations on the caller's own data
        clientCredentials:
          tokenUrl: http://localhost:8180/realms/axiz/protocol/openid-connect/token
          scopes:
            payments:channel: Channel applications acting for customers
            payments:read: Read-only access to payment data
            payments:process: Payment processing between internal services
  schemas:
    PaymentStatus:
      type: string
      enum: [RECEIVED, PROCESSING, COMPLETED, REJECTED]
    PaymentHistoryItem:
      type: object
      additionalProperties: true
      properties:
        paymentId: {type: string}
        operationNumber: {type: string}
        customerId: {type: string}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        reason: {type: string}
        amount: {type: number, minimum: 0.01, maximum: 9999999999999999.99, multipleOf: 0.01}
        currency: {type: string}
        creditorCci: {type: string, description: masked}
        processingDate: {type: string, format: date}
        lastChangeAt: {type: string, format: date-time}
    PaymentHistoryPage:
      type: object
      additionalProperties: true
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PaymentHistoryItem'}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
    Problem:
      type: object
      additionalProperties: true
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
