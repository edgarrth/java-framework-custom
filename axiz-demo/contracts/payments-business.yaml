openapi: 3.1.0
info:
  title: Payment orders
  version: 1.0.0
  description: Owner of payment orders (fictitious payment processor of the axiz demo).
tags:
  - name: payment-orders
paths:
  /v1/payment-orders:
    post:
      operationId: createPaymentOrder
      tags: [payment-orders]
      summary: Registers a payment order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentOrderRequest'}
            example: {customerId: C-1001, debtorAccount: '1910012345678', creditorCci: '00219100123456789053', amount: 150.75, currency: PEN, description: Rent}
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentOrder'}
              example: {id: 0190a1b2-0000-7000-8000-000000000001, operationNumber: OP20261011-00000001, customerId: C-1001, status: RECEIVED, amount: 150.75, currency: PEN, creditorCci: '****************9053', processingDate: '2026-10-12', createdAt: '2026-10-11T15:00:00Z'}
        '422':
          description: Business rule violated (limit, cut-off, invalid account)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    get:
      operationId: listPaymentOrders
      tags: [payment-orders]
      summary: Payment orders of a customer
      parameters:
        - {name: customerId, in: query, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentOrderPage'}
              example: {items: [], page: 0, size: 20, totalElements: 0}
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/payment-orders/{orderId}:
    parameters:
      - {name: orderId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getPaymentOrder
      tags: [payment-orders]
      summary: Gets a payment order
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentOrder'}
              example: {id: 0190a1b2-0000-7000-8000-000000000001, operationNumber: OP20261011-00000001, customerId: C-1001, status: RECEIVED, amount: 150.75, currency: PEN, creditorCci: '****************9053', processingDate: '2026-10-12', createdAt: '2026-10-11T15:00:00Z'}
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/payment-orders/{orderId}/status:
    parameters:
      - {name: orderId, in: path, required: true, schema: {type: string}}
    post:
      operationId: changePaymentOrderStatus
      tags: [payment-orders]
      summary: Moves the order to its next status (used by the payment process)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StatusChange'}
            example: {status: COMPLETED, reason: Settled by the network}
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentOrder'}
              example: {id: 0190a1b2-0000-7000-8000-000000000001, operationNumber: OP20261011-00000001, customerId: C-1001, status: COMPLETED, amount: 150.75, currency: PEN, creditorCci: '****************9053', processingDate: '2026-10-12', createdAt: '2026-10-11T15:00:00Z'}
        '409':
          description: Transition not allowed
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 64}
  schemas:
    PaymentStatus:
      type: string
      enum: [RECEIVED, PROCESSING, COMPLETED, REJECTED]
    PaymentOrderRequest:
      type: object
      required: [customerId, debtorAccount, creditorCci, amount, currency]
      properties:
        customerId: {type: string, maxLength: 20}
        debtorAccount: {type: string, pattern: '^[0-9]{10,20}$'}
        creditorCci: {type: string, pattern: '^[0-9]{20}$'}
        amount: {type: number, minimum: 0.01}
        currency: {type: string, pattern: '^(PEN|USD)$'}
        description: {type: string, maxLength: 140}
    StatusChange:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/PaymentStatus'}
        reason: {type: string, maxLength: 200}
    PaymentOrder:
      type: object
      properties:
        id: {type: string}
        operationNumber: {type: string}
        customerId: {type: string}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        amount: {type: number}
        currency: {type: string}
        creditorCci: {type: string, description: masked}
        processingDate: {type: string, format: date}
        createdAt: {type: string, format: date-time}
    PaymentOrderPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PaymentOrder'}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
