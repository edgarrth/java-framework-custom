# Promoción manual a un ambiente de un digest ya construido y atestiguado. Las reglas de protección
# del ambiente de GitHub (aprobaciones, ramas permitidas) se aplican antes del despliegue; volver
# atrás es desplegar un digest anterior. Nunca se recompila.
name: deploy
on:
  workflow_dispatch:
    inputs:
      environment: {type: choice, options: [dev, qa, prod], required: true}
      digest: {description: Digest sha256 de la imagen publicada, type: string, required: true}
      version: {description: Versión del chart publicado, type: string, required: true}
permissions: {}
jobs:
  deploy:
    uses: edgarrth/java-framework-custom/.github/workflows/service-deploy.yaml@axiz-workflows-v2.0.0 # x-release-please-version
    permissions:
      contents: write
      packages: read
      attestations: read
    with:
      service: payments-ux
      environment: ${{ inputs.environment }}
      digest: ${{ inputs.digest }}
      version: ${{ inputs.version }}
      gitops-repository: ${{ vars.AXIZ_GITOPS_REPOSITORY }}
    secrets:
      GITOPS_APP_CLIENT_ID: ${{ secrets.GITOPS_APP_CLIENT_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
