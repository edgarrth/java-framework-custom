spring:
  application:
    name: payments-ux
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
server:
  port: 8080
  shutdown: graceful
axiz:
  web:
    api-version:
      enabled: true
      supported:
      - '1'
      default-version: '1'
    pagination:
      default-size: 20
      max-size: 200
  bff:
    timeout: 3s
  foundation:
    zone: America/Lima
  errors:
    type-base-uri: ${AXIZ_ERRORS_TYPE_BASE_URI:}
  logging:
    http:
      enabled: true
  config:
    environment: ${AXIZ_ENVIRONMENT:local}
    parameter-store:
      application: payments-ux
  i18n:
    default-locale: es-PE
  sensitive:
    response: MEDIUM
  security:
    rate-limit:
      enabled: true
      rules:
      - name: payment-submission
        paths: [/v1/payments]
        limit: 100
        window: 1m
        key: client
        fail-open: false
    claims:
      subject-as-client: false
      machine:
      - axiz_token_kind=service
    issuers:
    - issuer: ${AXIZ_OIDC_ISSUER:http://localhost:8180/realms/axiz}
      audiences:
      - payments-ux
  resilience:
    defaults:
      timeouts:
        total: 15s
  http-client:
    clients:
      payment-orders:
        base-url: ${PAYMENT_ORDERS_BASE_URL:http://localhost:8089}
        auth:
          type: TOKEN_RELAY
        read-timeout: 2s
        total-timeout: 3s
      beneficiaries:
        base-url: ${BENEFICIARIES_BASE_URL:http://localhost:8089}
        auth:
          type: TOKEN_RELAY
        read-timeout: 2s
        total-timeout: 3s
  cache:
    default-ttl: 10m
    redis: true
    caches:
      customer-beneficiaries:
        ttl: 30s
  idempotency:
    retention: 24h
    store: redis
  feature-flags:
    flags:
      payments-usd:
        enabled: ${AXIZ_FLAG_PAYMENTS_USD:false}
        percentage: 100
  messaging:
    source: urn:axiz:payments-ux
    consumer:
      name: payments-ux
    kafka:
      group-id: payments-ux
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  tracing:
    sampling:
      probability: ${AXIZ_TRACE_SAMPLING:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
