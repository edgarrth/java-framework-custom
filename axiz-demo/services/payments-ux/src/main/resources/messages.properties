# catálogo usa la clave error.<code>, con parámetros {name}, p. ej.:
# error.PAYMENTS-PAYMENTSUX-0001=El monto supera el límite diario de {limit}.
service.name=Payments UX
error.PAYMENTS-PAYMENTSUX-0001=La moneda {currency} no coincide con la cuenta del beneficiario ({expected}).
error.PAYMENTS-PAYMENTSUX-0002=Los pagos en {currency} no están disponibles.
error.PAYMENTS-PAYMENTSUX-0003=El pago supera tu límite diario.
error.PAYMENTS-PAYMENTSUX-0004=Ya registraste hoy un pago igual a este beneficiario.
error.PAYMENTS-PAYMENTSUX-0005=La cuenta del beneficiario no puede recibir pagos.
