environment: dev
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/payments-ux-dev
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
networkPolicy:
  egress:
    cidrs: []
externalSecret:
  remotePrefix: dev/payments-ux
config:
  axiz:
    config:
      environment: dev
    security:
      issuers:
      - issuer: https://sso.dev.axiz-demo.example/realms/axiz
        audiences:
        - payments-ux
    http-client:
      clients:
        payment-orders:
          base-url: http://payment-orders.payments-dev.svc.cluster.local
        beneficiaries:
          base-url: http://beneficiaries.payments-dev.svc.cluster.local
    feature-flags:
      flags:
        payments-usd:
          enabled: true
          percentage: 100
  management:
    tracing:
      sampling:
        probability: '1.0'
  spring:
    data:
      redis:
        url: rediss://payments-dev.cache.demo.use1.cache.amazonaws.com:6379
errors: []
