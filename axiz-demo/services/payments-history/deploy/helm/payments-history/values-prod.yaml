environment: prod
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/payments-history-prod
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
topologySpread:
  whenUnsatisfiable: DoNotSchedule
networkPolicy:
  egress:
    cidrs: []
externalSecret:
  remotePrefix: prod/payments-history
config:
  axiz.config.environment: prod
  management.tracing.sampling.probability: '0.1'
errors: []
