environment: dev
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/payments-history-dev
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
networkPolicy:
  egress:
    cidrs: []
externalSecret:
  remotePrefix: dev/payments-history
config:
  axiz.messaging.kafka.authentication: msk
  axiz.messaging.kafka.iam: true
  axiz.config.environment: dev
  axiz.audit.integrity.mode: HMAC
  axiz.audit.integrity.hmac-secret: audit-hmac-key
  axiz.audit.integrity.hmac-key-id: v1
  management.tracing.sampling.probability: '1.0'
errors: []
