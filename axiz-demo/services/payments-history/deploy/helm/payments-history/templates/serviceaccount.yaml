{{- if .Values.serviceAccount.create }}
# Identidad del pod: el rol de IAM (anotación IRSA o asociación de EKS Pod Identity) otorga acceso a AWS
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.serviceAccountName" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
