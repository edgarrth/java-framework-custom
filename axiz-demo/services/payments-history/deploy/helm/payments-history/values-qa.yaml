# payments-history in qa
environment: qa

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/payments-history-qa

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

externalSecret:
  remotePrefix: qa/payments-history

config:
  axiz.config.environment: qa
  management.tracing.sampling.probability: "1.0"
  # Keys this service needs in qa (set their values, then remove the comment):
  # axiz.foundation.calendar.holidays:
  # axiz.security.issuers:
  # spring.r2dbc.url:
  # spring.r2dbc.username:
  # axiz.r2dbc.iam.enabled:
  # spring.kafka.bootstrap-servers:
  # axiz.messaging.destinations:
  # axiz.crypto.kms.key-id:
  # axiz.crypto.fields.current-key-id:
  # axiz.crypto.fields.key-ids:

errors: []
