# Perfil local (./mvnw spring-boot:run -Dspring-boot.run.profiles=local) contra `docker compose up`.
# Los servicios de AWS se ejecutan en LocalStack: export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test (LocalStack
# acepta cualquier valor; no son credenciales).
axiz:
  transport:
    allow-insecure-data-stores: true
    allow-plain-http: true
  logging:
    json: false
  config:
    environment: local
  security:
    issuers:
    - issuer: http://localhost:8180/realms/axiz
      audiences:
      - local-services
  aws:
    endpoint: http://localhost:4566
  secrets:
    directory: ./local/secrets
spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/payments_history
    username: app
    properties:
      sslMode: disable


# El contenedor local de Kafka no tiene listener IAM.
axiz.messaging.kafka.authentication: configured
axiz.messaging.kafka.iam: false

# Ajustes de transporte explícitos para contenedores locales sin TLS.
spring.datasource.hikari.data-source-properties.sslmode: disable
spring.flyway.jdbc-properties.sslmode: disable
spring.r2dbc.properties.sslMode: disable
spring.kafka.security.protocol: PLAINTEXT
spring.data.redis.ssl.enabled: false
