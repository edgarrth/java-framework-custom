# Payments History: defaults shared by every environment.
# Environment values come from the ConfigMaps axiz-common, payments-history and payments-history-errors
# (Spring Cloud Kubernetes) and secrets from files mounted by the ExternalSecret. ${VAR:default}
# placeholders only serve local runs and tests: never write environment values or secrets here.
spring:
  application:
    name: payments-history
  lifecycle:
    timeout-per-shutdown-phase: 20s
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:app}
    properties:
      sslMode: ${DB_SSL_MODE:require}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: 8080
  shutdown: graceful
axiz:
  cqrs:
    authorization:
      # every command and query must declare RequiresAuthority, an AccessPolicy or OpenAccess
      unprotected: fail
  aws:
    region: ${AWS_REGION:us-east-1}
  messaging:
    type-prefix: pe.axiz.payments.
    kafka:
      iam: ${AXIZ_KAFKA_IAM:false}
      topics:
      - payments
      group-id: payments-history
  foundation:
    zone: America/Lima
  web:
    pagination:
      default-size: 20
      max-size: 200
  errors:
    type-base-uri: ${AXIZ_ERRORS_TYPE_BASE_URI:}
  logging:
    http:
      enabled: true
  config:
    environment: ${AXIZ_ENVIRONMENT:local}
  i18n:
    default-locale: es-PE
  sensitive:
    response: MEDIUM
  security:
    issuers:
    - issuer: ${AXIZ_OIDC_ISSUER:http://localhost:8180/realms/axiz}
      audiences:
      - ${spring.application.name}
  audit:
    async:
      enabled: true
  r2dbc:
    iam:
      enabled: ${AXIZ_R2DBC_IAM:false}
  inbox:
    retention: 14d
    store: r2dbc
  secrets:
    directory: /var/run/secrets/axiz
  crypto:
    kms:
      key-id: ${AXIZ_KMS_KEY_ID:alias/local}
    fields:
      current-key-id: v1
      key-ids:
      - v1
      blind-index-secret: blind-index-key
management:
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  tracing:
    sampling:
      probability: ${AXIZ_TRACE_SAMPLING:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

