# Local dependencies of payments-history (docker compose up -d, or axiz local up).
# Development only: no value here is a real credential.
name: payments-history

services:
  # Grafana, Tempo, Loki, Prometheus and an OpenTelemetry collector (OTLP 4317/4318)
  otel-lgtm:
    image: axiz-local/otel-lgtm:2026.11-r1
    build: {context: ../../local/images/otel-lgtm}
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]

  postgres:
    image: axiz-local/postgres:17.12-r2
    build: {context: ../../local/images/postgres}
    environment:
      POSTGRES_DB: payments_history
      POSTGRES_USER: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments_history"]
      interval: 5s
      retries: 10

  kafka:
    image: axiz-local/kafka:4.2.2-r1
    build: {context: ../../local/images/kafka}
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  localstack:
    image: axiz-local/localstack:4.14.0-r1
    build: {context: ../../local/images/localstack}
    ports: ["127.0.0.1:4566:4566"]
    environment:
      SERVICES: kms,secretsmanager,ssm
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./local/localstack:/etc/localstack/init/ready.d:ro

  # OIDC provider for local tokens (realm axiz, client local-client)
  keycloak:
    image: axiz-local/keycloak:26.8.2-r1
    build: {context: ../../local/images/keycloak}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./local/keycloak:/opt/keycloak/data/import:ro
