# Build only. deploy.yaml independently consumes a completed successful run and manifest hash.
name: ci
on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*", "candidate/**"]
  workflow_dispatch:
    inputs:
      version: {description: Optional final build coordinate; defaults to the source POM without -SNAPSHOT, type: string, default: ''}
      variant: {type: choice, options: [jvm, native], default: jvm}
      platforms: {description: JSON image platforms, type: string, default: '["linux/amd64"]'}
      base-image: {description: Registry base image pinned by digest; overrides the platform variable, type: string, default: ''}
      candidate-repository: {description: Optional framework candidate producer repository, type: string, default: ''}
      candidate-build-run-id: {type: string, default: ''}
      candidate-build-run-attempt: {type: string, default: ''}
      candidate-manifest-sha256: {description: External signed framework candidate manifest SHA256, type: string, default: ''}
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: axiz-workflows-v2.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/edgarrth/java-framework-custom/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  parameters:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate: ${{ steps.version.outputs.candidate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve final coordinates and candidate identity
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version=$(python3 -c 'import xml.etree.ElementTree as E; p=E.parse("pom.xml").getroot(); print(p.findtext("{*}version") or p.findtext("{*}properties/{*}revision") or "")')
            version=${version%-SNAPSHOT}
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          candidate=
          if [[ "$GITHUB_REF" == refs/tags/candidate/* ]]; then
            candidate=${GITHUB_REF#refs/tags/candidate/}
            [[ "$candidate" =~ ^([0-9]+\.[0-9]+\.[0-9]+)/[1-9][0-9]*$ && "${BASH_REMATCH[1]}" == "$version" ]]
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF#refs/tags/v}" == "$version" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

  pr:
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    needs: axiz-workflows-trust
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.event_name == 'pull_request') }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: edgarrth/java-framework-custom/.github/workflows/pr.yaml@axiz-workflows-v2.0.0
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
      AXIZ_NAMING_GUARD: ${{ secrets.AXIZ_NAMING_GUARD }}

  build:
    permissions:
      contents: read
      actions: read
      id-token: write
    needs: [axiz-workflows-trust, parameters]
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: edgarrth/java-framework-custom/.github/workflows/service-build.yaml@axiz-workflows-v2.0.0
    with:
      service: payment-process
      module: '.'
      chart: deploy/helm/payment-process
      version: ${{ needs.parameters.outputs.version }}
      source-sha: ${{ github.sha }}
      variant: ${{ inputs.variant || 'jvm' }}
      platforms: ${{ inputs.platforms || '["linux/amd64"]' }}
      base-image: ${{ inputs.base-image || (inputs.variant == 'native' && vars.AXIZ_NATIVE_BASE_IMAGE || vars.AXIZ_JVM_BASE_IMAGE) }}
      axiz-version: 2.0.0
      candidate-repository: ${{ inputs.candidate-repository }}
      candidate-build-run-id: ${{ inputs.candidate-build-run-id }}
      candidate-build-run-attempt: ${{ inputs.candidate-build-run-attempt }}
      candidate-manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      CANDIDATE_READ_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_READ_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_READ_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
      BUILD_DESTINATION: ${{ secrets.BUILD_DESTINATION }}
      REGISTRY_BUILD_USERNAME: ${{ secrets.REGISTRY_BUILD_USERNAME }}
      REGISTRY_BUILD_PASSWORD: ${{ secrets.REGISTRY_BUILD_PASSWORD }}
