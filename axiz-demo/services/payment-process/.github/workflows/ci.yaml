# Pipeline of payment-process (shared axiz workflows, pinned to @v1):
#   pull request  pr checks (title, secrets, dependencies, Semgrep, Trivy, actionlint) + build
#   main          build, image signed with cosign, deploy dev, then qa (GitOps, applied by Argo CD)
#   tag v*        build, image, deploy prod after the approval of the `prod` environment
# A deployment only runs after this commit's build and image succeeded. Manual redeploys and
# rollbacks: .github/workflows/cd.yaml.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: axiz/axiz-workflows/.github/workflows/pr.yaml@v1
    secrets: inherit

  ci:
    uses: axiz/axiz-workflows/.github/workflows/service-ci.yaml@v1
    with:
      service: payment-process
      openapi: src/main/openapi/openapi.yaml
      chart: deploy/helm/payment-process
    secrets: inherit

  dev:
    needs: ci
    if: github.ref == 'refs/heads/main'
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1
    with:
      service: payment-process
      environment: dev
      chart: deploy/helm/payment-process
      image-tag: ${{ needs.ci.outputs.image-tag }}
      image-digest: ${{ needs.ci.outputs.image-digest }}
    secrets: inherit

  qa:
    needs: [ci, dev]
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1
    with:
      service: payment-process
      environment: qa
      chart: deploy/helm/payment-process
      image-tag: ${{ needs.ci.outputs.image-tag }}
      image-digest: ${{ needs.ci.outputs.image-digest }}
    secrets: inherit

  prod:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1
    with:
      service: payment-process
      environment: prod
      chart: deploy/helm/payment-process
      image-tag: ${{ needs.ci.outputs.image-tag }}
      image-digest: ${{ needs.ci.outputs.image-digest }}
    secrets: inherit
