environment: qa
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::222222222222:role/payment-process-qa
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
networkPolicy:
  egress:
    cidrs: []
externalSecret:
  remotePrefix: qa/payment-process
config:
  axiz.config.environment: qa
  management.tracing.sampling.probability: '1.0'
  axiz.security.issuers:
  - issuer: https://sso.qa.axiz-demo.example/realms/axiz
    audiences:
    - ${spring.application.name}
  spring.datasource.url: jdbc:aws-wrapper:postgresql://payments-qa.cluster-demo.us-east-1.rds.amazonaws.com:5432/payment_process
  spring.datasource.username: payment-process-app
  axiz.jpa.aws-wrapper.enabled: true
  axiz.jpa.aws-wrapper.iam: true
  axiz.http-client.clients:
    payment-orders:
      base-url: http://payment-orders.payments-qa.svc.cluster.local
    banking-core:
      base-url: http://banking-core.payments-qa.svc.cluster.local
    payment-network-gateway:
      base-url: http://payment-network-gateway.payments-qa.svc.cluster.local
  axiz.messaging.kafka.authentication: msk
  axiz.messaging.kafka.iam: true
  spring.kafka.bootstrap-servers: b-1.payments-qa.kafka.us-east-1.amazonaws.com:9098,b-2.payments-qa.kafka.us-east-1.amazonaws.com:9098
  axiz.messaging.destinations:
    payments: kafka:payments
errors: []
