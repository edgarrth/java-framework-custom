# payment-process in dev
environment: dev

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/payment-process-dev

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

networkPolicy:
  egress:
    # destinations outside the cluster this service reaches in dev (VPC endpoints of
    # the AWS services it uses, databases, brokers, partners), with their ports
    cidrs: []

externalSecret:
  remotePrefix: dev/payment-process

# Environment values (no secrets: those come from the ExternalSecret). Business calendar
# holidays are shared by every service in the axiz-common ConfigMap (deploy/platform).
config:
  axiz.config.environment: dev
  management.tracing.sampling.probability: '1.0'
  axiz.security.issuers:
  - issuer: https://sso.dev.axiz-demo.example/realms/axiz
    audiences:
    - ${spring.application.name}
  spring.datasource.url: jdbc:aws-wrapper:postgresql://payments-dev.cluster-demo.us-east-1.rds.amazonaws.com:5432/payment_process
  spring.datasource.username: payment-process-app
  axiz.jpa.aws-wrapper.enabled: true
  axiz.jpa.aws-wrapper.iam: true
  axiz.http-client.clients:
    payments-business:
      base-url: http://payments-business.payments-dev.svc.cluster.local
    core-integration:
      base-url: http://core-integration.payments-dev.svc.cluster.local
  spring.kafka.bootstrap-servers: b-1.payments-dev.kafka.us-east-1.amazonaws.com:9098,b-2.payments-dev.kafka.us-east-1.amazonaws.com:9098
  axiz.messaging.destinations:
    payments: kafka:payments

errors: []
