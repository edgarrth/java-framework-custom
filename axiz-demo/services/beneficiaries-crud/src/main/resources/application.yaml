# Beneficiaries Crud: defaults shared by every environment.
# Environment values come from the ConfigMaps axiz-common, beneficiaries-crud and beneficiaries-crud-errors
# (mounted as files by the chart) and secrets from files mounted by the ExternalSecret. ${VAR:default}
# placeholders only serve local runs and tests: never write environment values or secrets here.
spring:
  application:
    name: beneficiaries-crud
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: 8080
  shutdown: graceful
axiz:
  aws:
    region: ${AWS_REGION:us-east-1}
  foundation:
    zone: America/Lima
  web:
    pagination:
      default-size: 20
      max-size: 200
  errors:
    type-base-uri: ${AXIZ_ERRORS_TYPE_BASE_URI:}
  logging:
    http:
      enabled: true
  config:
    environment: ${AXIZ_ENVIRONMENT:local}
  i18n:
    default-locale: es-PE
  sensitive:
    response: MEDIUM
  security:
    issuers:
    - issuer: ${AXIZ_OIDC_ISSUER:http://localhost:8180/realms/axiz}
      audiences:
      - ${spring.application.name}
  dynamodb:
    table-prefix: ${AXIZ_DYNAMODB_TABLE_PREFIX:local-}
  cache:
    default-ttl: 10m
    redis: false
    caches:
      beneficiaries:
        ttl: 5m
  idempotency:
    retention: 24h
    store: dynamodb
    table: ${axiz.dynamodb.table-prefix}axiz-idempotency
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  tracing:
    sampling:
      probability: ${AXIZ_TRACE_SAMPLING:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
beneficiaries:
  max-per-customer: 50
