# beneficiaries-crud in qa
environment: qa

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::222222222222:role/beneficiaries-crud-qa

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

networkPolicy:
  egress:
    # destinations outside the cluster this service reaches in qa (VPC endpoints of
    # the AWS services it uses, databases, brokers, partners), with their ports
    cidrs: []

externalSecret:
  remotePrefix: qa/beneficiaries-crud

# Environment values (no secrets: those come from the ExternalSecret). Business calendar
# holidays are shared by every service in the axiz-common ConfigMap (deploy/platform).
config:
  axiz.config.environment: qa
  management.tracing.sampling.probability: '1.0'
  axiz.security.issuers:
  - issuer: https://sso.qa.axiz-demo.example/realms/axiz
    audiences:
    - ${spring.application.name}
  axiz.dynamodb.table-prefix: qa-

errors: []
