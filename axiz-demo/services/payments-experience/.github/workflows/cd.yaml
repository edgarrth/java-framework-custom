# Manual deployment of an image that CI already built and signed: promotion, redeploy or rollback.
# The release is written to the GitOps repository and applied by Argo CD; prod still needs the
# approval of the `prod` environment. Automatic deployments run from ci.yaml.
name: cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, qa, prod]
        required: true
      image-tag:
        description: Image tag (the commit SHA built by CI)
        type: string
        required: true
      image-digest:
        description: Image digest (sha256:..., shown in the CI summary)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: v1.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/axiz/axiz-workflows/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  deploy:
    needs: axiz-workflows-trust
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1.0.0
    with:
      service: payments-experience
      environment: ${{ inputs.environment }}
      chart: deploy/helm/payments-experience
      image-tag: ${{ inputs.image-tag }}
      revision: ${{ inputs.image-tag }}
      image-digest: ${{ inputs.image-digest }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
