# payments-experience in dev
environment: dev

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/payments-experience-dev

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

networkPolicy:
  egress:
    # destinations outside the cluster this service reaches in dev (VPC endpoints of
    # the AWS services it uses, databases, brokers, partners), with their ports
    cidrs: []

externalSecret:
  remotePrefix: dev/payments-experience

# Environment values (no secrets: those come from the ExternalSecret). Business calendar
# holidays are shared by every service in the axiz-common ConfigMap (deploy/platform).
config:
  axiz.config.environment: dev
  management.tracing.sampling.probability: '1.0'
  axiz.security.issuers:
  - issuer: https://sso.dev.axiz-demo.example/realms/axiz
    audiences:
    - ${spring.application.name}
  axiz.http-client.clients:
    payments-business:
      base-url: http://payments-business.payments-dev.svc.cluster.local
    beneficiaries-crud:
      base-url: http://beneficiaries-crud.payments-dev.svc.cluster.local
  spring.data.redis.url: rediss://payments-dev.cache.demo.use1.cache.amazonaws.com:6379
  axiz.feature-flags.flags:
    payments-usd:
      enabled: true
      percentage: 100

errors: []
