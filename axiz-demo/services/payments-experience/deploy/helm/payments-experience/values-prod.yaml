# payments-experience in prod
environment: prod

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::333333333333:role/payments-experience-prod

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

externalSecret:
  remotePrefix: prod/payments-experience

# Environment values (no secrets: those come from the ExternalSecret). Business calendar
# holidays are shared by every service in the axiz-common ConfigMap (deploy/platform).
config:
  axiz.config.environment: prod
  management.tracing.sampling.probability: '0.1'
  axiz.security.issuers:
  - issuer: https://sso.prod.axiz-demo.example/realms/axiz
    audiences:
    - ${spring.application.name}
  axiz.http-client.clients:
    payments-business:
      base-url: http://payments-business.payments-prod.svc.cluster.local
    beneficiaries-crud:
      base-url: http://beneficiaries-crud.payments-prod.svc.cluster.local
  spring.data.redis.url: rediss://payments-prod.cache.demo.use1.cache.amazonaws.com:6379
  axiz.feature-flags.flags:
    payments-usd:
      enabled: false
      percentage: 10

errors: []
