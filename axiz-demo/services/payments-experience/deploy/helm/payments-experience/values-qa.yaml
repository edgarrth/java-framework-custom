# payments-experience in qa
environment: qa

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::222222222222:role/payments-experience-qa

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

externalSecret:
  remotePrefix: qa/payments-experience

# Environment values (no secrets: those come from the ExternalSecret). Business calendar
# holidays are shared by every service in the axiz-common ConfigMap (deploy/platform).
config:
  axiz.config.environment: qa
  management.tracing.sampling.probability: '1.0'
  axiz.security.issuers:
  - issuer: https://sso.qa.axiz-demo.example/realms/axiz
    audiences:
    - ${spring.application.name}
  axiz.http-client.clients:
    payments-business:
      base-url: http://payments-business.payments-qa.svc.cluster.local
    beneficiaries-crud:
      base-url: http://beneficiaries-crud.payments-qa.svc.cluster.local
  spring.data.redis.url: rediss://payments-qa.cache.demo.use1.cache.amazonaws.com:6379
  axiz.feature-flags.flags:
    payments-usd:
      enabled: true
      percentage: 100

errors: []
