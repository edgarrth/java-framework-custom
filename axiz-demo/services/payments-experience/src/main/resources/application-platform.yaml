# Profile "platform": the whole demo on one machine (../../local/compose.yaml), with the profile
# "local". Ports and addresses of the sibling services; nothing here applies to real environments.
server:
  port: 8080
axiz:
  http-client:
    clients:
      # on one laptop the first call to a service that just started can take a few seconds (its
      # JIT is cold): longer timeouts than in the environments, where the defaults apply
      payments-business:
        base-url: http://localhost:8081
        read-timeout: 8s
        total-timeout: 12s
      beneficiaries-crud:
        base-url: http://localhost:8082
        read-timeout: 8s
        total-timeout: 12s
