# Local profile (./mvnw spring-boot:run -Dspring-boot.run.profiles=local) against `docker compose up`.
# AWS services run in LocalStack: export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test (LocalStack
# accepts any value; they are not credentials).
axiz:
  logging:
    json: false
  config:
    environment: local
  aws:
    endpoint: http://localhost:4566
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/settlement_batch
    username: app
  cloud:
    aws:
      endpoint: http://localhost:4566
      region:
        static: us-east-1

