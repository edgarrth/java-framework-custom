# Local dependencies of settlement-batch (docker compose up -d, or axiz local up).
# Development only: no value here is a real credential.
name: settlement-batch

services:
  # Grafana, Tempo, Loki, Prometheus and an OpenTelemetry collector (OTLP 4317/4318)
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]

  postgres:
    image: axiz-local/postgres:17.12-r1
    build: {context: ../../local/images/postgres}
    environment:
      POSTGRES_DB: settlement_batch
      POSTGRES_USER: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d settlement_batch"]
      interval: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.9
    ports: ["127.0.0.1:4566:4566"]
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./local/localstack:/etc/localstack/init/ready.d:ro
