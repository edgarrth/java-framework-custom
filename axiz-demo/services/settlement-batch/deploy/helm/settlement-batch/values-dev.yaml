environment: dev
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/settlement-batch-dev
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
networkPolicy:
  egress:
    cidrs: []
externalSecret:
  remotePrefix: dev/settlement-batch
config:
  axiz.config.environment: dev
  axiz.audit.integrity.mode: HMAC
  axiz.audit.integrity.hmac-secret: audit-hmac-key
  axiz.audit.integrity.hmac-key-id: v1
  management.tracing.sampling.probability: '1.0'
  axiz.storage.bucket: axiz-demo-settlement-dev
  spring.datasource.url: jdbc:aws-wrapper:postgresql://payments-dev.cluster-demo.us-east-1.rds.amazonaws.com:5432/settlement_batch
  spring.datasource.username: settlement-batch-app
  axiz.jpa.aws-wrapper.enabled: true
  axiz.jpa.aws-wrapper.iam: true
errors: []
