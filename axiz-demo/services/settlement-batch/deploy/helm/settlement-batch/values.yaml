nameOverride: ''
environment: ""
image:
  repository: ghcr.io/edgarrth/java-framework-custom/settlement-batch
  tag: ''
  digest: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ''
  annotations: {}
  automountToken: false
sharedConfigMap: axiz-common-2-0-0
javaOpts: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
env: []
# Select imports before application.yaml and mounted ConfigMaps are loaded.
configBootstrap:
  parameterStore:
    enabled: false
    application: ""
    prefix: /axiz
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
cronjob:
  schedule: 0 2 * * *
  timeZone: America/Lima
  suspend: false
  startingDeadlineSeconds: 600
  backoffLimit: 1
  activeDeadlineSeconds: 7200
networkPolicy:
  enabled: true
  ingressNamespaces: []
  egress:
    sameNamespace: true
    namespaces: []
    cidrs: []
config: {}
errors: []
externalSecret:
  enabled: true
  storeName: aws-secrets-manager
  refreshInterval: 1h
  remotePrefix: dev/settlement-batch
  keys: []
