# Releases (workflow compartido de axiz con release-please): cada merge a main actualiza un pull
# request de release con la siguiente versión y el changelog a partir de Conventional Commits; al
# fusionarlo se crea el tag v<x.y.z>, que ejecuta ci.yaml y publica. La promoción entre ambientes es
# una ejecución separada de deploy.yaml.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: edgarrth/java-framework-custom/.github/workflows/release.yaml@axiz-workflows-v2.0.0 # x-release-please-version
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
