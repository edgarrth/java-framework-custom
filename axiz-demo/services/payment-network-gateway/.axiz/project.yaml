# Manifiesto del proyecto axiz: lo lee la CLI axiz (generate, add, contract sync, upgrade, doctor).
# Se versiona en el repositorio; la CLI lo actualiza cuando cambia el proyecto.
schema: 2
kind: service
name: payment-network-gateway
groupId: pe.axiz.payments
basePackage: pe.axiz.payments.networkgateway
archetype: gateway
structure: hexagonal
extensions: []
stack: servlet
persistence: none
axizVersion: 2.0.0
contract:
  openapi: src/main/openapi/openapi.yaml
  asyncapi: null
capabilities:
  - config-aws
  - secrets-file
  - secrets-aws
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - security
  - resilience
  - http-client
  - secrets
  - audit
  - idempotency
  - idempotency-redis
  - audit-sqs
operations:
  - sendTransfer
