openapi: 3.1.0
info:
  title: Payment network gateway
  version: 1.0.0
  description: Outbound gateway to the payment network; preserves transfer idempotency
    and network error mapping.
  x-axiz-archetype: gateway
tags:
- name: transfers
security: [{oauth2: [payments:process]}]
paths:
  /v1/transfers:
    post:
      operationId: sendTransfer
      tags:
      - transfers
      summary: Sends an inter-bank transfer to the payment network
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            example:
              creditorCci: '00219100123456789053'
              amount: 150.75
              currency: PEN
              reference: OP20261011-00000001
      responses:
        '201':
          description: Accepted by the network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                transferId: NET-55
                status: SETTLED
                reference: OP20261011-00000001
        '422':
          description: Rejected by the network
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Bearer access token issued by the payments identity provider (Keycloak in the demo).
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8180/realms/axiz/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/axiz/protocol/openid-connect/token
          scopes:
            payments:channel: Customer channel operations on the caller's own data
        clientCredentials:
          tokenUrl: http://localhost:8180/realms/axiz/protocol/openid-connect/token
          scopes:
            payments:channel: Channel applications acting for customers
            payments:read: Read-only access to payment data
            payments:process: Payment processing between internal services
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
  schemas:
    TransferRequest:
      type: object
      additionalProperties: false
      required:
      - creditorCci
      - amount
      - currency
      - reference
      properties:
        creditorCci:
          type: string
          pattern: ^[0-9]{20}$
        amount:
          type: number
          minimum: 0.01
          maximum: 9999999999999999.99
          multipleOf: 0.01
        currency:
          type: string
          pattern: ^(PEN|USD)$
        reference:
          type: string
          maxLength: 40
    Transfer:
      type: object
      additionalProperties: true
      properties:
        transferId:
          type: string
        status:
          type: string
        reference:
          type: string
    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string

