# core-integration in dev
environment: dev

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/core-integration-dev

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

networkPolicy:
  egress:
    # destinations outside the cluster this service reaches in dev (VPC endpoints of
    # the AWS services it uses, databases, brokers, partners), with their ports
    cidrs: []

externalSecret:
  remotePrefix: dev/core-integration

# Environment values (no secrets: those come from the ExternalSecret). Business calendar
# holidays are shared by every service in the axiz-common ConfigMap (deploy/platform).
config:
  axiz.config.environment: dev
  management.tracing.sampling.probability: '1.0'
  axiz.security.issuers:
  - issuer: https://sso.dev.axiz-demo.example/realms/axiz
    audiences:
    - ${spring.application.name}
  axiz.http-client.clients:
    core-banking:
      base-url: https://core-gw.dev.bank.example
      auth:
        type: CLIENT_CREDENTIALS
        token-uri: https://core-gw.dev.bank.example/oauth/token
        client-id: core-integration
        client-secret-ref: core-banking-client-secret
        scopes:
        - movements
    payment-network:
      base-url: https://api.sandbox.network.example
      auth:
        type: API_KEY
        api-key-header: X-Api-Key
        api-key-ref: payment-network-api-key
  axiz.soap.clients:
    core-credit:
      endpoint: https://core-gw.dev.bank.example/soap/credit
      username: core-integration
      password-ref: core-soap-password
  spring.data.redis.url: rediss://payments-dev.cache.demo.use1.cache.amazonaws.com:6379
  axiz.audit.sqs.queue-url: https://sqs.us-east-1.amazonaws.com/111111111111/axiz-demo-audit-dev

errors: []
