# core-integration in prod
environment: prod

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::333333333333:role/core-integration-prod

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

externalSecret:
  remotePrefix: prod/core-integration

# Environment values (no secrets: those come from the ExternalSecret). Business calendar
# holidays are shared by every service in the axiz-common ConfigMap (deploy/platform).
config:
  axiz.config.environment: prod
  management.tracing.sampling.probability: '0.1'
  axiz.security.issuers:
  - issuer: https://sso.prod.axiz-demo.example/realms/axiz
    audiences:
    - ${spring.application.name}
  axiz.http-client.clients:
    core-banking:
      base-url: https://core-gw.prod.bank.example
      auth:
        type: CLIENT_CREDENTIALS
        token-uri: https://core-gw.prod.bank.example/oauth/token
        client-id: core-integration
        client-secret-ref: core-banking-client-secret
        scopes:
        - movements
    payment-network:
      base-url: https://api.network.example
      auth:
        type: API_KEY
        api-key-header: X-Api-Key
        api-key-ref: payment-network-api-key
  axiz.soap.clients:
    core-credit:
      endpoint: https://core-gw.prod.bank.example/soap/credit
      username: core-integration
      password-ref: core-soap-password
  spring.data.redis.url: rediss://payments-prod.cache.demo.use1.cache.amazonaws.com:6379
  axiz.audit.sqs.queue-url: https://sqs.us-east-1.amazonaws.com/333333333333/axiz-demo-audit-prod

errors: []
