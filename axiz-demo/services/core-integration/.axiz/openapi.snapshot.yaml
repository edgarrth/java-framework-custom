openapi: 3.1.0
info:
  title: Core integration
  version: 1.0.0
  description: Anti-corruption layer in front of the (simulated) core banking system and payment network.
tags:
  - name: movements
  - name: transfers
paths:
  /v1/debits:
    post:
      operationId: debitAccount
      tags: [movements]
      summary: Holds and debits funds of an account in the core
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MovementRequest'}
            example: {accountId: '1910012345678', amount: 150.75, currency: PEN, reference: OP20261011-00000001}
      responses:
        '201':
          description: Debited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Movement'}
              example: {movementId: MV-778899, status: POSTED, reference: OP20261011-00000001}
        '422':
          description: Insufficient funds or blocked account
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '502':
          description: Core not available
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/debits/{movementId}/reversal:
    post:
      operationId: reverseDebit
      tags: [movements]
      summary: Reverses a debit (saga compensation)
      parameters:
        - {name: movementId, in: path, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Reversed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Movement'}
              example: {movementId: MV-778900, status: REVERSED, reference: MV-778899}
        '404':
          description: Unknown movement
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/credits:
    post:
      operationId: creditAccount
      tags: [movements]
      summary: Credits an account of the core (SOAP service of the core)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MovementRequest'}
            example: {accountId: '1910012345678', amount: 150.75, currency: PEN, reference: OP20261011-00000001}
      responses:
        '201':
          description: Credited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Movement'}
              example: {movementId: MV-778901, status: POSTED, reference: OP20261011-00000001}
        '502':
          description: Core not available
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/transfers:
    post:
      operationId: sendTransfer
      tags: [transfers]
      summary: Sends an inter-bank transfer to the payment network
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferRequest'}
            example: {creditorCci: '00219100123456789053', amount: 150.75, currency: PEN, reference: OP20261011-00000001}
      responses:
        '201':
          description: Accepted by the network
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transfer'}
              example: {transferId: NET-55, status: SETTLED, reference: OP20261011-00000001}
        '422':
          description: Rejected by the network
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 64}
  schemas:
    MovementRequest:
      type: object
      required: [accountId, amount, currency, reference]
      properties:
        accountId: {type: string, pattern: '^[0-9]{10,20}$'}
        amount: {type: number, minimum: 0.01}
        currency: {type: string, pattern: '^(PEN|USD)$'}
        reference: {type: string, maxLength: 40}
    Movement:
      type: object
      properties:
        movementId: {type: string}
        status: {type: string}
        reference: {type: string}
    TransferRequest:
      type: object
      required: [creditorCci, amount, currency, reference]
      properties:
        creditorCci: {type: string, pattern: '^[0-9]{20}$'}
        amount: {type: number, minimum: 0.01}
        currency: {type: string, pattern: '^(PEN|USD)$'}
        reference: {type: string, maxLength: 40}
    Transfer:
      type: object
      properties:
        transferId: {type: string}
        status: {type: string}
        reference: {type: string}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}

