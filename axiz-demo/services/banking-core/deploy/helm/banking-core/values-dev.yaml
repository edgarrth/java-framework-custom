environment: dev
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/banking-core-dev
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
networkPolicy:
  egress:
    cidrs: []
externalSecret:
  remotePrefix: dev/banking-core
config:
  axiz:
    config:
      environment: dev
    security:
      issuers:
      - issuer: https://sso.dev.axiz-demo.example/realms/axiz
        audiences:
        - banking-core
    http-client:
      clients:
        core-banking:
          base-url: https://core-gw.dev.bank.example
          auth:
            type: CLIENT_CREDENTIALS
            token-uri: https://core-gw.dev.bank.example/oauth/token
            client-id: banking-core
            client-secret-ref: core-banking-client-secret
            scopes:
            - movements
    soap:
      clients:
        core-credit:
          endpoint: https://core-gw.dev.bank.example/soap/credit
          username: banking-core
          password-ref: core-soap-password
    audit:
      integrity:
        mode: HMAC
        hmac-secret: audit-hmac-key
        hmac-key-id: v1
      sqs:
        queue-url: https://sqs.us-east-1.amazonaws.com/111111111111/axiz-demo-audit-dev
  management:
    tracing:
      sampling:
        probability: '1.0'
  spring:
    data:
      redis:
        url: rediss://payments-dev.cache.demo.use1.cache.amazonaws.com:6379
errors: []
