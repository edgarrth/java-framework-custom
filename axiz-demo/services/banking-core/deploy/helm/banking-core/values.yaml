nameOverride: banking-core
environment: ""
image:
  repository: ghcr.io/edgarrth/java-framework-custom/banking-core
  tag: ''
  digest: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ''
  annotations: {}
  automountToken: false
sharedConfigMap: axiz-common-2-0-0
javaOpts: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
env: []
# Select imports before application.yaml and mounted ConfigMaps are loaded.
configBootstrap:
  parameterStore:
    enabled: false
    application: ""
    prefix: /axiz
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
replicaCount: 2
terminationGracePeriodSeconds: 90
service:
  port: 80
probes:
  startupFailureThreshold: 30
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  maxUnavailable: 1
topologySpread:
  whenUnsatisfiable: ScheduleAnyway
networkPolicy:
  enabled: true
  ingressNamespaces: []
  egress:
    sameNamespace: true
    namespaces: []
    cidrs: []
config: {}
errors: []
externalSecret:
  enabled: true
  storeName: aws-secrets-manager
  refreshInterval: 1h
  remotePrefix: dev/banking-core
  keys:
  - core-banking-client-secret
  - core-soap-password
  - audit-hmac-key
