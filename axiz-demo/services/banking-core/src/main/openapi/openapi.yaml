openapi: 3.1.0
info:
  title: Banking Core
  version: 1.0.0
  description: Anti-corruption layer in front of the (simulated) core banking system
    and payment network.
  x-axiz-archetype: core
tags:
- name: movements
security: [{oauth2: [payments:process]}]
paths:
  /v1/debits:
    post:
      operationId: debitAccount
      tags:
      - movements
      summary: Holds and debits funds of an account in the core
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
            example:
              accountId: '1910012345678'
              amount: 150.75
              currency: PEN
              reference: OP20261011-00000001
      responses:
        '201':
          description: Debited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
              example:
                movementId: MV-778899
                status: POSTED
                reference: OP20261011-00000001
        '422':
          description: Insufficient funds or blocked account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Core not available
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/debits/{movementId}/reversal:
    post:
      operationId: reverseDebit
      tags:
      - movements
      summary: Reverses a debit (saga compensation)
      parameters:
      - name: movementId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
              example:
                movementId: MV-778900
                status: REVERSED
                reference: MV-778899
        '404':
          description: Unknown movement
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/credits:
    post:
      operationId: creditAccount
      tags:
      - movements
      summary: Credits an account of the core (SOAP service of the core)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
            example:
              accountId: '1910012345678'
              amount: 150.75
              currency: PEN
              reference: OP20261011-00000001
      responses:
        '201':
          description: Credited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
              example:
                movementId: MV-778901
                status: POSTED
                reference: OP20261011-00000001
        '502':
          description: Core not available
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Bearer access token issued by the payments identity provider (Keycloak in the demo).
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8180/realms/axiz/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/axiz/protocol/openid-connect/token
          scopes:
            payments:channel: Customer channel operations on the caller's own data
        clientCredentials:
          tokenUrl: http://localhost:8180/realms/axiz/protocol/openid-connect/token
          scopes:
            payments:channel: Channel applications acting for customers
            payments:read: Read-only access to payment data
            payments:process: Payment processing between internal services
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
  schemas:
    MovementRequest:
      type: object
      additionalProperties: false
      required:
      - accountId
      - amount
      - currency
      - reference
      properties:
        accountId:
          type: string
          pattern: ^[0-9]{10,20}$
        amount:
          type: number
          minimum: 0.01
          maximum: 9999999999999999.99
          multipleOf: 0.01
        currency:
          type: string
          pattern: ^(PEN|USD)$
        reference:
          type: string
          maxLength: 40
        holderId:
          type: string
          maxLength: 20
          description: 'Customer who must own the account (debits): the core rejects
            the debit otherwise'
    Movement:
      type: object
      additionalProperties: true
      properties:
        movementId:
          type: string
        status:
          type: string
        reference:
          type: string
    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
