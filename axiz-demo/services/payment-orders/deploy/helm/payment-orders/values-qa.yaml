environment: qa
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::222222222222:role/payment-orders-qa
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
networkPolicy:
  egress:
    cidrs: []
externalSecret:
  remotePrefix: qa/payment-orders
config:
  axiz:
    config:
      environment: qa
    security:
      issuers:
      - issuer: https://sso.qa.axiz-demo.example/realms/axiz
        audiences:
        - payment-orders
    jpa:
      aws-wrapper:
        enabled: true
        iam: true
    crypto:
      kms:
        key-id: alias/payment-orders-qa
      fields:
        current-key-id: v1
        key-ids:
        - v1
    messaging:
      kafka:
        authentication: msk
        iam: true
      destinations:
        payments: kafka:payments
    audit:
      kafka:
        topic: axiz-audit
  management:
    tracing:
      sampling:
        probability: '1.0'
  spring:
    datasource:
      url: jdbc:aws-wrapper:postgresql://payments-qa.cluster-demo.us-east-1.rds.amazonaws.com:5432/payment_orders
      username: payment-orders-app
    kafka:
      bootstrap-servers: b-1.payments-qa.kafka.us-east-1.amazonaws.com:9098,b-2.payments-qa.kafka.us-east-1.amazonaws.com:9098
errors: []
