{{- range .Values.migration.serviceAliases }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ . | quote }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "service.selectorLabels" $ | nindent 4 }}
{{- end }}
