axiz:
  logging:
    json: false
  config:
    environment: local
  security:
    issuers:
    - issuer: http://localhost:8180/realms/axiz
      audiences:
      - local-services
  aws:
    endpoint: http://localhost:4566
  secrets:
    directory: ./local/secrets
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_orders
    username: app

# The local Kafka container has no IAM listener.
axiz.messaging.kafka.iam: false
