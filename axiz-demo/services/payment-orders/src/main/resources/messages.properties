# Mensajes localizados de payment-orders (locale por defecto es-PE). El detalle de un error del
# catálogo usa la clave error.<code>, con parámetros {name}, p. ej.:
# error.PAYMENTS-PAYMENTORDERS-0001=El monto supera el límite diario de {limit}.
service.name=Payment Orders
error.PAYMENTS-PAYMENTORDERS-0001=El monto supera el límite diario de {currency} {limit}; disponible hoy: {available}.
error.PAYMENTS-PAYMENTORDERS-0002=La cuenta del beneficiario no es un CCI válido.
error.PAYMENTS-PAYMENTORDERS-0003=La orden no puede pasar de {from} a {to}.
error.PAYMENTS-PAYMENTORDERS-0004=La moneda {currency} no está habilitada para pagos.
error.PAYMENTS-PAYMENTORDERS-0005=Ya existe una orden por el mismo monto al mismo beneficiario hoy.
error.PAYMENTS-PAYMENTORDERS-0006=La clave de la solicitud ya se usó para otra orden.
error.PAYMENTS-PAYMENTORDERS-0007=La misma solicitud se está registrando en paralelo; reintenta para obtener la orden.
