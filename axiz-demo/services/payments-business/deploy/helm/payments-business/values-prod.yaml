# payments-business in prod
environment: prod

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::333333333333:role/payments-business-prod

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

externalSecret:
  remotePrefix: prod/payments-business

# Environment values (no secrets: those come from the ExternalSecret). Business calendar
# holidays are shared by every service in the axiz-common ConfigMap (deploy/platform).
config:
  axiz.config.environment: prod
  management.tracing.sampling.probability: '0.1'
  axiz.security.issuers:
  - issuer: https://sso.prod.axiz-demo.example/realms/axiz
    audiences:
    - ${spring.application.name}
  spring.datasource.url: jdbc:aws-wrapper:postgresql://payments-prod.cluster-demo.us-east-1.rds.amazonaws.com:5432/payments_business
  spring.datasource.username: payments-business-app
  axiz.jpa.aws-wrapper.enabled: true
  axiz.jpa.aws-wrapper.iam: true
  axiz.crypto.kms.key-id: alias/payments-business-prod
  axiz.crypto.fields.current-key-id: v1
  axiz.crypto.fields.key-ids:
  - v1
  spring.kafka.bootstrap-servers: b-1.payments-prod.kafka.us-east-1.amazonaws.com:9098,b-2.payments-prod.kafka.us-east-1.amazonaws.com:9098
  axiz.messaging.destinations:
    payments: kafka:payments
  axiz.audit.kafka.topic: axiz-audit

errors: []
