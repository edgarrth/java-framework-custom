{{- if .Values.networkPolicy.enabled }}
# Ingress only from the same namespace and the allowed ones (gateway/ingress, callers); egress is
# open to AWS endpoints and downstream services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # pods of the same namespace (sibling services) and the listed namespaces (gateway, callers)
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
