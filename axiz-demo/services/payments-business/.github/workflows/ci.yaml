# Pipeline of payments-business (shared axiz workflows, pinned to an immutable release; Renovate pins its commit):
#   pull request  pr checks (title, secrets, dependencies, Semgrep, Trivy, actionlint) + build
#   main          build, image signed with cosign, deploy dev, then qa (GitOps, applied by Argo CD)
#   tag v*        build, image, deploy prod after the approval of the `prod` environment
# A deployment only runs after this commit's build and image succeeded. Manual redeploys and
# rollbacks: .github/workflows/cd.yaml.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: v1.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/axiz/axiz-workflows/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  pr:
    needs: axiz-workflows-trust
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.event_name == 'pull_request') }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/pr.yaml@v1.0.0
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      AXIZ_NAMING_GUARD: ${{ secrets.AXIZ_NAMING_GUARD }}

  ci:
    needs: axiz-workflows-trust
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/service-ci.yaml@v1.0.0
    with:
      service: payments-business
      openapi: src/main/openapi/openapi.yaml
      chart: deploy/helm/payments-business
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_DOCKER_REGISTRY: ${{ secrets.NEXUS_DOCKER_REGISTRY }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dev:
    needs: [axiz-workflows-trust, ci]
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.ref == 'refs/heads/main') }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1.0.0
    with:
      service: payments-business
      environment: dev
      chart: deploy/helm/payments-business
      image-tag: ${{ needs.ci.outputs.image-tag }}
      image-digest: ${{ needs.ci.outputs.image-digest }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  qa:
    needs: [axiz-workflows-trust, ci, dev]
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1.0.0
    with:
      service: payments-business
      environment: qa
      chart: deploy/helm/payments-business
      image-tag: ${{ needs.ci.outputs.image-tag }}
      image-digest: ${{ needs.ci.outputs.image-digest }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  prod:
    needs: [axiz-workflows-trust, ci]
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (startsWith(github.ref, 'refs/tags/v')) }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1.0.0
    with:
      service: payments-business
      environment: prod
      chart: deploy/helm/payments-business
      image-tag: ${{ needs.ci.outputs.image-tag }}
      image-digest: ${{ needs.ci.outputs.image-digest }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
