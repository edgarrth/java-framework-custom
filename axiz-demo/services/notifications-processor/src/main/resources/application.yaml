spring:
  application:
    name: notifications-processor
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: 8080
  shutdown: graceful
axiz:
  aws:
    region: ${AWS_REGION:us-east-1}
  messaging:
    type-prefix: pe.axiz.payments.
    consumer:
      max-attempts: 5
      ignore-unknown-types: true
      subscriptions:
      - pe.axiz.payments.payment-order.status-changed.v1
      - pe.axiz.audit.event.v1
    kafka:
      topics:
      - payments
      authentication: ${AXIZ_KAFKA_AUTHENTICATION:msk}
      iam: ${AXIZ_KAFKA_IAM:true}
      group-id: notifications-processor
    sqs:
      wait-time: 20s
      queues:
      - ${AXIZ_AUDIT_QUEUE_URL:http://localhost:4566/000000000000/axiz-demo-audit}
    destinations:
      customer-notifications: ${AXIZ_NOTIFICATIONS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:local-customer-notifications}
  foundation:
    zone: America/Lima
  web:
    pagination:
      default-size: 20
      max-size: 200
  errors:
    type-base-uri: ${AXIZ_ERRORS_TYPE_BASE_URI:}
  logging:
    http:
      enabled: true
  config:
  sensitive:
    response: MEDIUM
  dynamodb:
    table-prefix: ${AXIZ_DYNAMODB_TABLE_PREFIX:local-}
  inbox:
    retention: 14d
    store: dynamodb
    table: ${axiz.dynamodb.table-prefix}axiz-inbox
  storage:
    bucket: ${AXIZ_STORAGE_BUCKET:local-bucket}
  lock:
    store: dynamodb
    table: ${axiz.dynamodb.table-prefix}axiz-locks
  metrics:
    tags:
      medium:
        allowed:
        - email
        - sms
        - push
  notification:
    destination: customer-notifications
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  tracing:
    sampling:
      probability: ${AXIZ_TRACE_SAMPLING:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
