# Local profile (./mvnw spring-boot:run -Dspring-boot.run.profiles=local) against `docker compose up`.
# AWS services run in LocalStack: export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test (LocalStack
# accepts any value; they are not credentials).
axiz:
  transport:
    allow-insecure-data-stores: true
    allow-plain-http: true
  logging:
    json: false
  config:
    environment: local
  aws:
    endpoint: http://localhost:4566
spring:
  cloud:
    aws:
      endpoint: http://localhost:4566
      region:
        static: us-east-1


# The local Kafka container has no IAM listener.
axiz.messaging.kafka.iam: false

# Explicit transport settings for local containers without TLS.
spring.datasource.hikari.data-source-properties.sslmode: disable
spring.flyway.jdbc-properties.sslmode: disable
spring.r2dbc.properties.sslMode: disable
spring.kafka.security.protocol: PLAINTEXT
spring.data.redis.ssl.enabled: false
