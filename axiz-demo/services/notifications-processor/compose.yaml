# Local dependencies of notifications-processor (docker compose up -d, or axiz local up).
# Development only: no value here is a real credential.
name: notifications-processor

services:
  # Grafana, Tempo, Loki, Prometheus and an OpenTelemetry collector (OTLP 4317/4318)
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]

  kafka:
    image: axiz-local/kafka:4.2.2-r1
    build: {context: ../../local/images/kafka}
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  localstack:
    image: localstack/localstack:4.9
    ports: ["127.0.0.1:4566:4566"]
    environment:
      SERVICES: dynamodb,s3,sqs,sns
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./local/localstack:/etc/localstack/init/ready.d:ro
