# Pipeline del servicio con los workflows reutilizables de Axiz: verificación en cada cambio,
# imagen y chart publicados en GHCR con atestaciones de procedencia y SBOM en main y en los tags, y
# despliegue automático en dev cuando el repositorio define AXIZ_GITOPS_REPOSITORY.
name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    uses: edgarrth/java-framework-custom/.github/workflows/service-build.yaml@axiz-workflows-v2.0.0 # x-release-please-version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      service: notifications-processor
      module: '.'
      chart: deploy/helm/notifications-processor
      native: ${{ vars.AXIZ_NATIVE == 'true' }}
      base-image: ${{ vars.AXIZ_BASE_IMAGE }}
      publish: ${{ github.event_name == 'push' }}

  deploy-dev:
    if: github.ref == 'refs/heads/main' && vars.AXIZ_GITOPS_REPOSITORY != ''
    needs: build
    uses: edgarrth/java-framework-custom/.github/workflows/service-deploy.yaml@axiz-workflows-v2.0.0 # x-release-please-version
    permissions:
      contents: write
      packages: read
      attestations: read
    with:
      service: notifications-processor
      environment: dev
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      chart: ${{ needs.build.outputs.chart }}
      version: ${{ needs.build.outputs.version }}
      gitops-repository: ${{ vars.AXIZ_GITOPS_REPOSITORY }}
    secrets:
      GITOPS_APP_CLIENT_ID: ${{ secrets.GITOPS_APP_CLIENT_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
