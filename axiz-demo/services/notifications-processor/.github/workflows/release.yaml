# Releases (shared axiz workflow with release-please): every merge to main updates a release pull
# request with the next version and the changelog from Conventional Commits; merging it creates the
# tag v<x.y.z>, which runs ci.yaml again to publish (and, for services, deploy to prod).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: axiz/axiz-workflows/.github/workflows/release.yaml@v1.0.0
    secrets: inherit
