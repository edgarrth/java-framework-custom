environment: dev
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/notifications-processor-dev
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
networkPolicy:
  egress:
    cidrs: []
externalSecret:
  remotePrefix: dev/notifications-processor
config:
  axiz.config.environment: dev
  management.tracing.sampling.probability: '1.0'
  axiz.messaging.kafka.authentication: msk
  axiz.messaging.kafka.iam: true
  spring.kafka.bootstrap-servers: b-1.payments-dev.kafka.us-east-1.amazonaws.com:9098,b-2.payments-dev.kafka.us-east-1.amazonaws.com:9098
  axiz.messaging.destinations:
    customer-notifications: arn:aws:sns:us-east-1:111111111111:customer-notifications-dev
  axiz.dynamodb.table-prefix: dev-
  axiz.messaging.sqs.queues:
  - https://sqs.us-east-1.amazonaws.com/111111111111/axiz-demo-audit-dev
  axiz.messaging.sqs.dead-letter-queues:
    https://sqs.us-east-1.amazonaws.com/111111111111/axiz-demo-audit-dev: https://sqs.us-east-1.amazonaws.com/111111111111/axiz-demo-audit-dev-dlq
  axiz.storage.bucket: axiz-demo-archive-dev
errors: []
