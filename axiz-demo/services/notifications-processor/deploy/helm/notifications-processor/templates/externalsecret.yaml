{{- if and .Values.externalSecret.enabled .Values.externalSecret.keys }}
# Secretos de AWS Secrets Manager (External Secrets Operator). Cada clave se convierte en un archivo en
# /var/run/secrets/axiz; los valores nunca pasan por el repositorio, el chart ni los ConfigMaps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "service.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.externalSecret.remotePrefix . }}
    {{- end }}
{{- end }}
