# Local dependencies of beneficiaries (docker compose up -d, or axiz local up).
# Development only: no value here is a real credential.
name: beneficiaries

services:
  # Grafana, Tempo, Loki, Prometheus and an OpenTelemetry collector (OTLP 4317/4318)
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    ports: ["3000:3000", "4317:4317", "4318:4318"]

  localstack:
    image: localstack/localstack:4.9
    ports: ["4566:4566"]
    environment:
      SERVICES: dynamodb
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./local/localstack:/etc/localstack/init/ready.d:ro

  # OIDC provider for local tokens (realm axiz, client local-client)
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only
    ports: ["8180:8080"]
    volumes:
      - ./local/keycloak:/opt/keycloak/data/import:ro
