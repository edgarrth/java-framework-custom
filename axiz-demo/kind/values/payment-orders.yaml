# payment-orders in the kind cluster of the demo (kind/up.sh). Local stand-ins only.
environment: local
image:
  repository: axiz/payment-orders
  tag: local
  pullPolicy: Never
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
env:
- name: AWS_ACCESS_KEY_ID
  value: test
- name: AWS_SECRET_ACCESS_KEY
  value: test
- name: AWS_REGION
  value: us-east-1
externalSecret:
  enabled: false
config:
  axiz.config.environment: local
  management.opentelemetry.tracing.export.otlp.endpoint: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/traces
  management.otlp.metrics.export.url: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/metrics
  axiz.security.issuers:
  - issuer: http://localhost:9180/realms/axiz
    jwk-set-uri: http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/certs
    audiences:
    - local-services
  spring.datasource.url: jdbc:postgresql://postgres.axiz-demo.svc.cluster.local:5432/payment_orders
  spring.datasource.username: app
  spring.kafka.bootstrap-servers: kafka.axiz-demo.svc.cluster.local:9092
  axiz.messaging.kafka.iam: false
  axiz.aws.endpoint: http://localstack.axiz-demo.svc.cluster.local:4566
  axiz.aws.region: us-east-1
  axiz.crypto.kms.key-id: alias/local
