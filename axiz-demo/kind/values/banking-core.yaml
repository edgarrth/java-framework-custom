environment: local
image:
  repository: axiz/banking-core
  tag: local
  pullPolicy: Never
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
env:
# Local environments skip automatic cluster imports; load the chart mounts explicitly.
- name: SPRING_CONFIG_IMPORT
  value: optional:file:/etc/axiz/config/common/application.yaml,file:/etc/axiz/config/service/application.yaml,file:/etc/axiz/config/errors/application.yaml
- name: AWS_ACCESS_KEY_ID
  value: test
- name: AWS_SECRET_ACCESS_KEY
  value: test
- name: AWS_REGION
  value: us-east-1
externalSecret:
  enabled: false
config:
  axiz.config.environment: local
  axiz.transport.allow-plain-http: true
  axiz.transport.allow-insecure-data-stores: true
  spring.data.redis.ssl.enabled: false
  management.opentelemetry.tracing.export.otlp.endpoint: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/traces
  management.otlp.metrics.export.url: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/metrics
  axiz.security.issuers:
  - issuer: http://localhost:9180/realms/axiz
    jwk-set-uri: http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/certs
    audiences:
    - local-services
  axiz.aws.endpoint: http://localstack.axiz-demo.svc.cluster.local:4566
  axiz.aws.region: us-east-1
  spring.data.redis.url: redis://valkey.axiz-demo.svc.cluster.local:6379
  axiz.audit.sqs.queue-url: http://localstack.axiz-demo.svc.cluster.local:4566/000000000000/axiz-demo-audit
  axiz.http-client.clients:
    core-banking:
      base-url: http://wiremock.axiz-demo.svc.cluster.local:8080
      auth:
        type: CLIENT_CREDENTIALS
        token-uri: http://wiremock.axiz-demo.svc.cluster.local:8080/oauth/token
        client-id: banking-core
        client-secret-ref: core-banking-client-secret
        scopes:
        - movements
    payment-network:
      base-url: http://wiremock.axiz-demo.svc.cluster.local:8080
      auth:
        type: API_KEY
        api-key-header: X-Api-Key
        api-key-ref: payment-network-api-key
  axiz.soap.clients:
    core-credit:
      endpoint: http://wiremock.axiz-demo.svc.cluster.local:8080/soap/credit
      username: banking-core
      password-ref: core-soap-password
