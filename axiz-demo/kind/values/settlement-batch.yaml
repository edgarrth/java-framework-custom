# settlement-batch en el clúster kind de la demo (kind/up.sh). Solo sustitutos locales.
environment: local
image:
  repository: axiz/settlement-batch
  tag: local
  pullPolicy: Never
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
env:
# Los entornos locales omiten las importaciones automáticas del clúster; los montajes del chart se cargan de forma explícita.
- name: SPRING_CONFIG_IMPORT
  value: optional:file:/etc/axiz/config/common/application.yaml,file:/etc/axiz/config/service/application.yaml,file:/etc/axiz/config/errors/application.yaml
- name: AWS_ACCESS_KEY_ID
  value: test
- name: AWS_SECRET_ACCESS_KEY
  value: test
- name: AWS_REGION
  value: us-east-1
externalSecret:
  enabled: false
config:
  axiz.config.environment: local
  axiz.transport.allow-plain-http: true
  axiz.transport.allow-insecure-data-stores: true
  spring.datasource.hikari.data-source-properties.sslmode: disable
  spring.flyway.jdbc-properties.sslmode: disable
  management.opentelemetry.tracing.export.otlp.endpoint: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/traces
  management.otlp.metrics.export.url: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/metrics
  spring.datasource.url: jdbc:postgresql://postgres.axiz-demo.svc.cluster.local:5432/settlement_batch
  spring.datasource.username: app
  axiz.aws.endpoint: http://localstack.axiz-demo.svc.cluster.local:4566
  axiz.aws.region: us-east-1
  axiz.storage.bucket: local-bucket
  settlement.input-key: in/settlement/NET-SETTLE-SAMPLE.txt
