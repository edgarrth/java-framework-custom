# settlement-batch in the kind cluster of the demo (kind/up.sh). Local stand-ins only.
environment: local
image:
  repository: axiz/settlement-batch
  tag: local
  pullPolicy: Never
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
env:
- name: AWS_ACCESS_KEY_ID
  value: test
- name: AWS_SECRET_ACCESS_KEY
  value: test
- name: AWS_REGION
  value: us-east-1
externalSecret:
  enabled: false
config:
  axiz.config.environment: local
  management.otlp.tracing.endpoint: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/traces
  management.otlp.metrics.export.url: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/metrics
  spring.datasource.url: jdbc:postgresql://postgres.axiz-demo.svc.cluster.local:5432/settlement_batch
  spring.datasource.username: app
  axiz.aws.endpoint: http://localstack.axiz-demo.svc.cluster.local:4566
  axiz.aws.region: us-east-1
  axiz.storage.bucket: local-bucket
  settlement.input-key: in/settlement/NET-SETTLE-SAMPLE.txt
