# payments-history in the kind cluster of the demo (kind/up.sh). Local stand-ins only.
environment: local
image:
  repository: axiz/payments-history
  tag: local
  pullPolicy: Never
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
env:
- name: AWS_ACCESS_KEY_ID
  value: test
- name: AWS_SECRET_ACCESS_KEY
  value: test
- name: AWS_REGION
  value: us-east-1
externalSecret:
  enabled: false
config:
  axiz.config.environment: local
  management.otlp.tracing.endpoint: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/traces
  management.otlp.metrics.export.url: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/metrics
  axiz.security.issuers:
  - issuer: http://localhost:9180/realms/axiz
    jwk-set-uri: http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/certs
    audiences:
    - local-services
  # R2DBC to the PostgreSQL stand-in (no TLS, no IAM); Flyway derives its JDBC URL from it
  spring.r2dbc.url: r2dbc:postgresql://postgres.axiz-demo.svc.cluster.local:5432/payments_history
  spring.r2dbc.username: app
  spring.r2dbc.properties.sslMode: disable
  axiz.r2dbc.iam.enabled: false
  spring.kafka.bootstrap-servers: kafka.axiz-demo.svc.cluster.local:9092
  axiz.messaging.kafka.iam: false
  axiz.aws.endpoint: http://localstack.axiz-demo.svc.cluster.local:4566
