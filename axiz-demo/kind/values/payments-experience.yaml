# payments-experience in the kind cluster of the demo (kind/up.sh). Local stand-ins only.
environment: local
image:
  repository: axiz/payments-experience
  tag: local
  pullPolicy: Never
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
env:
- name: AWS_ACCESS_KEY_ID
  value: test
- name: AWS_SECRET_ACCESS_KEY
  value: test
- name: AWS_REGION
  value: us-east-1
externalSecret:
  enabled: false
config:
  axiz.config.environment: local
  management.otlp.tracing.endpoint: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/traces
  management.otlp.metrics.export.url: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/metrics
  axiz.security.issuers:
  - issuer: http://localhost:9180/realms/axiz
    jwk-set-uri: http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/certs
    audiences:
    - local-services
  spring.data.redis.url: redis://valkey.axiz-demo.svc.cluster.local:6379
  axiz.http-client.clients:
    payments-business:
      base-url: http://payments-business.axiz-demo.svc.cluster.local
      auth:
        type: TOKEN_RELAY
    beneficiaries-crud:
      base-url: http://beneficiaries-crud.axiz-demo.svc.cluster.local
      auth:
        type: TOKEN_RELAY
  axiz.feature-flags.flags:
    payments-usd:
      enabled: true
service:
  type: NodePort
  nodePort: 30080
