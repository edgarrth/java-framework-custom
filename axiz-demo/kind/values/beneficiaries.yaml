# beneficiaries in the kind cluster of the demo (kind/up.sh). Local stand-ins only.
environment: local
image:
  repository: axiz/beneficiaries
  tag: local
  pullPolicy: Never
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
env:
# Local environments skip automatic cluster imports; load the chart mounts explicitly.
- name: SPRING_CONFIG_IMPORT
  value: optional:file:/etc/axiz/config/common/application.yaml,file:/etc/axiz/config/service/application.yaml,file:/etc/axiz/config/errors/application.yaml
- name: AWS_ACCESS_KEY_ID
  value: test
- name: AWS_SECRET_ACCESS_KEY
  value: test
- name: AWS_REGION
  value: us-east-1
externalSecret:
  enabled: false
config:
  axiz.config.environment: local
  axiz.transport.allow-plain-http: true
  management.opentelemetry.tracing.export.otlp.endpoint: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/traces
  management.otlp.metrics.export.url: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/metrics
  axiz.security.issuers:
  - issuer: http://localhost:9180/realms/axiz
    jwk-set-uri: http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/certs
    audiences:
    - local-services
  axiz.aws.endpoint: http://localstack.axiz-demo.svc.cluster.local:4566
  axiz.aws.region: us-east-1
  axiz.dynamodb.table-prefix: local-
