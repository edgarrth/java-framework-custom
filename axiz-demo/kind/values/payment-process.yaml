environment: local
image:
  repository: axiz/payment-process
  tag: local
  pullPolicy: Never
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
env:
# Local environments skip automatic cluster imports; load the chart mounts explicitly.
- name: SPRING_CONFIG_IMPORT
  value: optional:file:/etc/axiz/config/common/application.yaml,file:/etc/axiz/config/service/application.yaml,file:/etc/axiz/config/errors/application.yaml
- name: AWS_ACCESS_KEY_ID
  value: test
- name: AWS_SECRET_ACCESS_KEY
  value: test
- name: AWS_REGION
  value: us-east-1
externalSecret:
  enabled: false
config:
  axiz.config.environment: local
  axiz.transport.allow-plain-http: true
  axiz.transport.allow-insecure-data-stores: true
  spring.datasource.hikari.data-source-properties.sslmode: disable
  spring.flyway.jdbc-properties.sslmode: disable
  spring.kafka.security.protocol: PLAINTEXT
  management.opentelemetry.tracing.export.otlp.endpoint: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/traces
  management.otlp.metrics.export.url: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/metrics
  axiz.security.issuers:
  - issuer: http://localhost:9180/realms/axiz
    jwk-set-uri: http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/certs
    audiences:
    - local-services
  spring.datasource.url: jdbc:postgresql://postgres.axiz-demo.svc.cluster.local:5432/payment_process
  spring.datasource.username: app
  spring.kafka.bootstrap-servers: kafka.axiz-demo.svc.cluster.local:9092
  axiz.messaging.kafka.iam: false
  axiz.http-client.clients:
    payment-orders:
      base-url: http://payment-orders.axiz-demo.svc.cluster.local
      auth:
        type: CLIENT_CREDENTIALS
        token-uri: http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/token
        client-id: payment-process
        client-secret-ref: payment-process-client-secret
    banking-core:
      base-url: http://banking-core.axiz-demo.svc.cluster.local
      auth:
        type: CLIENT_CREDENTIALS
        token-uri: http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/token
        client-id: payment-process
        client-secret-ref: payment-process-client-secret
    payment-network-gateway:
      base-url: http://payment-network-gateway.axiz-demo.svc.cluster.local
      auth:
        type: CLIENT_CREDENTIALS
        token-uri: http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/token
        client-id: payment-process
        client-secret-ref: payment-process-client-secret
