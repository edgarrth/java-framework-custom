# notifications-processor in the kind cluster of the demo (kind/up.sh). Local stand-ins only.
environment: local
image:
  repository: axiz/notifications-processor
  tag: local
  pullPolicy: Never
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
env:
- name: AWS_ACCESS_KEY_ID
  value: test
- name: AWS_SECRET_ACCESS_KEY
  value: test
- name: AWS_REGION
  value: us-east-1
externalSecret:
  enabled: false
config:
  axiz.config.environment: local
  management.otlp.tracing.endpoint: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/traces
  management.otlp.metrics.export.url: http://otel-lgtm.axiz-demo.svc.cluster.local:4318/v1/metrics
  spring.kafka.bootstrap-servers: kafka.axiz-demo.svc.cluster.local:9092
  axiz.messaging.kafka.iam: false
  axiz.aws.endpoint: http://localstack.axiz-demo.svc.cluster.local:4566
  axiz.aws.region: us-east-1
  axiz.dynamodb.table-prefix: local-
  axiz.storage.bucket: local-bucket
  axiz.messaging.sqs.queues:
  - http://localstack.axiz-demo.svc.cluster.local:4566/000000000000/axiz-demo-audit
  axiz.messaging.destinations:
    customer-notifications: arn:aws:sns:us-east-1:000000000000:local-customer-notifications
