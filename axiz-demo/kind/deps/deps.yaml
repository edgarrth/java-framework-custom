        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app: valkey
  ports:
  - name: p6379
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: apache/kafka:4.1.0
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka:9092
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@localhost:9093
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
  - name: p9092
    port: 9092
    targetPort: 9092
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: topics
        image: apache/kafka:4.1.0
        securityContext:
          allowPrivilegeEscalation: false
        command:
        - /bin/bash
        - /scripts/topics.sh
        volumeMounts:
        - name: kafka-topics
          mountPath: /scripts
      volumes:
      - name: kafka-topics
        configMap:
          name: kafka-topics
          defaultMode: 493
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: localstack/localstack:4.9
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 4566
        env:
        - name: SERVICES
          value: dynamodb,s3,sqs,sns,kms,secretsmanager
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        volumeMounts:
        - name: localstack-init
          mountPath: /etc/localstack/init/ready.d
      volumes:
      - name: localstack-init
        configMap:
          name: localstack-init
          defaultMode: 493
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  selector:
    app: localstack
  ports:
  - name: p4566
    port: 4566
    targetPort: 4566
---
apiVersion: apps/v1
