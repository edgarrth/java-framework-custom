          mountPath: /opt/keycloak/data/import
      volumes:
      - name: keycloak-realm
        configMap:
          name: keycloak-realm
          defaultMode: 493
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
    nodePort: 30180
  type: NodePort
