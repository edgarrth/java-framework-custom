apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: axiz-local/kafka:4.2.2-r1
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka:9092
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@localhost:9093
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
        volumeMounts:
        - name: writable-0
          mountPath: /opt/kafka/config
        - name: writable-1
          mountPath: /opt/kafka/logs
        - name: writable-2
          mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: writable-0
        emptyDir: {}
      - name: writable-1
        emptyDir: {}
      - name: writable-2
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
  - name: p9092
    port: 9092
    targetPort: 9092
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: topics
        image: axiz-local/kafka:4.2.2-r1
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        command:
        - /bin/bash
        - /scripts/topics.sh
        volumeMounts:
        - name: kafka-topics
          mountPath: /scripts
          readOnly: true
        - name: writable-0
          mountPath: /opt/kafka/logs
        - name: writable-1
          mountPath: /tmp
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
      volumes:
      - name: kafka-topics
        configMap:
          name: kafka-topics
          defaultMode: 493
      - name: writable-0
        emptyDir: {}
      - name: writable-1
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: axiz-local/localstack:4.14.0-r1
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 4566
        env:
        - name: SERVICES
          value: dynamodb,s3,sqs,sns,kms,secretsmanager
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        volumeMounts:
        - name: localstack-init
          mountPath: /etc/localstack/init/ready.d
          readOnly: true
        - name: writable-0
          mountPath: /var/lib/localstack
        - name: writable-1
          mountPath: /home/localstack/.cache
        - name: writable-2
          mountPath: /tmp
      volumes:
      - name: localstack-init
        configMap:
          name: localstack-init
          defaultMode: 493
      - name: writable-0
        emptyDir: {}
      - name: writable-1
        emptyDir: {}
      - name: writable-2
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
spec:
  selector:
    app: localstack
  ports:
  - name: p4566
    port: 4566
    targetPort: 4566
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock
  labels:
    app: wiremock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiremock
  template:
    metadata:
      labels:
        app: wiremock
    spec:
      containers:
      - name: wiremock
        image: axiz-local/wiremock:3.13.2-r1
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8080
        args:
        - --global-response-templating
        volumeMounts:
        - name: writable-0
          mountPath: /tmp
        - name: wiremock-mappings
          mountPath: /home/wiremock/mappings/core-credit-soap.json
          subPath: core-credit-soap.json
          readOnly: true
        - name: wiremock-mappings
          mountPath: /home/wiremock/mappings/core-debit.json
          subPath: core-debit.json
          readOnly: true
        - name: wiremock-mappings
          mountPath: /home/wiremock/mappings/core-reversal.json
          subPath: core-reversal.json
          readOnly: true
        - name: wiremock-mappings
          mountPath: /home/wiremock/mappings/core-token.json
          subPath: core-token.json
          readOnly: true
        - name: wiremock-mappings
          mountPath: /home/wiremock/mappings/network-transfer.json
          subPath: network-transfer.json
          readOnly: true
      volumes:
      - name: wiremock-mappings
        configMap:
          name: wiremock-mappings
          defaultMode: 493
      - name: writable-0
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: wiremock
spec:
  selector:
    app: wiremock
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  labels:
    app: otel-lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-lgtm
  template:
    metadata:
      labels:
        app: otel-lgtm
    spec:
      containers:
      - name: otel-lgtm
        image: axiz-local/otel-lgtm:2026.11-r1
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 3000
        - containerPort: 4317
        - containerPort: 4318
        volumeMounts:
        - name: grafana-dashboards
          mountPath: /otel-lgtm/axiz-dashboards
          readOnly: true
        - name: grafana-provisioning
          mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/axiz.yaml
          subPath: dashboards.yaml
          readOnly: true
        - name: writable-0
          mountPath: /data
        - name: writable-1
          mountPath: /tmp
      volumes:
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
          defaultMode: 493
      - name: grafana-provisioning
        configMap:
          name: grafana-provisioning
          defaultMode: 493
      - name: writable-0
        emptyDir: {}
      - name: writable-1
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
spec:
  selector:
    app: otel-lgtm
  ports:
  - name: p3000
    port: 3000
    targetPort: 3000
    nodePort: 30300
  - name: p4317
    port: 4317
    targetPort: 4317
  - name: p4318
    port: 4318
    targetPort: 4318
  type: NodePort
