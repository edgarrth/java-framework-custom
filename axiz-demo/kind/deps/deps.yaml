# Local infrastructure stand-ins; never deploy these fixtures to production.
apiVersion: v1
kind: Namespace
metadata:
  name: axiz-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: axiz-local/postgres:17.12-r2
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: app
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: writable-0
          mountPath: /var/lib/postgresql/data
        - name: writable-1
          mountPath: /var/run/postgresql
        - name: writable-2
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - app
          periodSeconds: 5
      volumes:
      - name: postgres-init
        configMap:
          name: postgres-init
          defaultMode: 493
      - name: writable-0
        emptyDir: {}
      - name: writable-1
        emptyDir: {}
      - name: writable-2
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - name: p5432
    port: 5432
    targetPort: 5432
---
