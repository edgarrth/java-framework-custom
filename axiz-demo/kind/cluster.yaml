# Clúster kind de la demo: un nodo, puertos del host para la API del canal, Keycloak y Grafana.
# Son 9080/9180/9300, no los 8080/8180/3000 de la demo local, para que ambas puedan ejecutarse a la vez.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: axiz-demo
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 9080}   # payments-ux
      - {containerPort: 30180, hostPort: 9180}   # keycloak (issuer http://localhost:9180)
      - {containerPort: 30300, hostPort: 9300}   # grafana
