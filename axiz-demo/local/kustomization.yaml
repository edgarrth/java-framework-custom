# Shared fixture data for kind; file paths remain inside this base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: postgres-init
  files:
  - postgres/init.sql
- name: kafka-topics
  files:
  - kafka/topics.sh
- name: localstack-init
  files:
  - localstack/init.sh
  - localstack/NET-SETTLE-SAMPLE.txt
- name: keycloak-realm
  files:
  - keycloak/axiz-realm.json
- name: wiremock-mappings
  files:
  - wiremock/mappings/core-token.json
  - wiremock/mappings/core-debit.json
  - wiremock/mappings/core-reversal.json
  - wiremock/mappings/core-credit-soap.json
  - wiremock/mappings/network-transfer.json
- name: grafana-dashboards
  files:
  - grafana/dashboards/axiz-services.json
  - grafana/dashboards/axiz-payments.json
- name: grafana-provisioning
  files:
  - grafana/dashboards.yaml
