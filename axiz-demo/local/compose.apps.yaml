# Los ocho servicios de la demo como contenedores en la red de compose.yaml (perfil "apps").
# Las imágenes provienen de Jib (axiz/<service>:local); scripts/compose.sh las construye y arranca
# la infraestructura y los servicios con un solo comando. Cada servicio conserva los perfiles local,platform
# y el puerto que usa en el host; SPRING_APPLICATION_JSON reemplaza los endpoints de localhost por
# los nombres de esta red (los mismos ajustes que kind/values/<service>.yaml).
# Solo para desarrollo: ningún valor de este archivo es una credencial real.
services:
  # los servicios leen las claves de los tokens por HTTP plano solo desde un nombre local del clúster, como en kind
  keycloak:
    networks:
      default:
        aliases:
        - keycloak.axiz-demo.svc.cluster.local
  payments-ux:
    image: axiz/payments-ux:local
    profiles:
    - apps
    restart: on-failure
    # los archivos de secretos de local/secrets son privados del usuario que ejecuta la demo
    user: ${AXIZ_UID:-1000}:${AXIZ_GID:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      valkey:
        condition: service_started
      localstack:
        condition: service_started
      keycloak:
        condition: service_started
      wiremock:
        condition: service_started
      otel-lgtm:
        condition: service_started
    ports:
    - 127.0.0.1:8080:8080
    environment:
      SPRING_PROFILES_ACTIVE: local,platform
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      SPRING_APPLICATION_JSON: '{"axiz.config.environment":"local","axiz.transport.allow-plain-http":true,"axiz.transport.allow-insecure-data-stores":true,"spring.data.redis.ssl.enabled":false,"management.opentelemetry.tracing.export.otlp.endpoint":"http://otel-lgtm:4318/v1/traces","management.otlp.metrics.export.url":"http://otel-lgtm:4318/v1/metrics","axiz.security.issuers":[{"issuer":"http://localhost:8180/realms/axiz","jwk-set-uri":"http://keycloak.axiz-demo.svc.cluster.local:8080/realms/axiz/protocol/openid-connect/certs","audiences":["local-services"]}],"spring.data.redis.url":"redis://valkey:6379","axiz.http-client.clients":{"payment-orders":{"base-url":"http://payment-orders:8081","auth":{"type":"TOKEN_RELAY"}},"beneficiaries":{"base-url":"http://beneficiaries:8082","auth":{"type":"TOKEN_RELAY"}}},"axiz.feature-flags.flags":{"payments-usd":{"enabled":false}},"axiz.secrets.directory":"/var/run/secrets/axiz"}'
    volumes:
    - ../services/payments-ux/local/secrets:/var/run/secrets/axiz:ro
