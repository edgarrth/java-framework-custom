# Infraestructura de toda la demo para ejecuciones locales (docker compose up -d, o ../scripts/demo.sh up).
# Los servicios se ejecutan en el host con los perfiles "local,platform" (scripts/run.sh <service>), para
# poder depurarlos; kind/ despliega todo dentro de Kubernetes.
# Solo para desarrollo: ningún valor de este archivo es una credencial real (los valores "local-only" son marcadores de posición).
name: axiz-demo

services:
  postgres:
    image: axiz-local/postgres:17.12-r2
    build: {context: ./images/postgres}
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  # Sustituto de ElastiCache (caché, idempotencia, locks, límites de tasa)
  valkey:
    image: axiz-local/valkey:8.1.8-r1
    build: {context: ./images/valkey}
    ports: ["127.0.0.1:6379:6379"]

  # Sustituto de MSK (un único broker KRaft, texto plano)
  kafka:
    image: axiz-local/kafka:4.2.2-r1
    build: {context: ./images/kafka}
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # dos listeners: los contenedores de este compose llegan al broker como kafka:29092 y los servicios del
      # host como localhost:9092. Si solo se anuncia localhost, un cliente dentro de la red
      # (kafka-topics) se redirige a su propio contenedor y los tópicos nunca se crean.
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  kafka-topics:
    image: axiz-local/kafka:4.2.2-r1
    build: {context: ./images/kafka}
    depends_on:
      kafka: {condition: service_healthy}
    volumes:
      - ./kafka/topics.sh:/topics.sh:ro
    entrypoint: ["/bin/bash", "/topics.sh"]

  # DynamoDB, S3, SQS, SNS, KMS y Secrets Manager
  # Estado local: LocalStack no conserva nada cuando se recrea su contenedor; PostgreSQL conserva sus
  # datos hasta "scripts/demo.sh down" (que elimina ambos). Nada depende de que estén sincronizados:
  # los escenarios usan sus propios ids en cada ejecución, y volver a procesar un archivo de liquidación
  # ya cargado escribe de nuevo su resumen cuando S3 lo perdió.
  localstack:
    image: axiz-local/localstack:4.14.0-r1
    build: {context: ./images/localstack}
    ports: ["127.0.0.1:4566:4566"]
    environment:
      SERVICES: dynamodb,s3,sqs,sns,kms,secretsmanager
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack:/etc/localstack/init/ready.d:ro

  # Proveedor OIDC: realm axiz con usuarios y clientes de la demo (ver keycloak/axiz-realm.json)
  keycloak:
    image: axiz-local/keycloak:26.8.2-r1
    build: {context: ./images/keycloak}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only
      # los tokens llevan siempre el issuer en el que confían los servicios, también cuando un contenedor los
      # solicita mediante el nombre de la red interna (back channel)
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Core bancario simulado (REST + SOAP), su endpoint de tokens y la red de pagos
  wiremock:
    image: axiz-local/wiremock:3.13.2-r1
    build: {context: ./images/wiremock}
    command: ["--global-response-templating", "--verbose"]
    ports: ["127.0.0.1:8089:8080"]
    volumes:
      - ./wiremock:/home/wiremock:ro

  # Grafana, Tempo, Loki, Prometheus y un colector de OpenTelemetry (OTLP 4317/4318)
  otel-lgtm:
    image: axiz-local/otel-lgtm:2026.11-r1
    build: {context: ./images/otel-lgtm}
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/axiz.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/axiz-dashboards:ro
