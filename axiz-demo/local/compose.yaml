# Whole-demo infrastructure for local runs (docker compose up -d, or ../scripts/demo.sh up).
# Services run on the host with the profiles "local,platform" (scripts/run.sh <service>), so they
# can be debugged; kind/ deploys everything inside Kubernetes instead.
# Development only: no value here is a real credential ("local-only" values are placeholders).
name: axiz-demo

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  # ElastiCache stand-in (cache, idempotency, locks, rate limits)
  valkey:
    image: valkey/valkey:8.1-alpine
    ports: ["6379:6379"]

  # MSK stand-in (single KRaft broker, plaintext)
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  kafka-topics:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: {condition: service_healthy}
    volumes:
      - ./kafka/topics.sh:/topics.sh:ro
    entrypoint: ["/bin/bash", "/topics.sh"]

  # DynamoDB, S3, SQS, SNS, KMS and Secrets Manager
  localstack:
    image: localstack/localstack:4.9
    ports: ["4566:4566"]
    environment:
      SERVICES: dynamodb,s3,sqs,sns,kms,secretsmanager
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack:/etc/localstack/init/ready.d:ro

  # OIDC provider: realm axiz with demo users and clients (see keycloak/axiz-realm.json)
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only
    ports: ["8180:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Simulated core banking (REST + SOAP), its token endpoint and the payment network
  wiremock:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--verbose"]
    ports: ["8089:8080"]
    volumes:
      - ./wiremock:/home/wiremock:ro

  # Grafana, Tempo, Loki, Prometheus and an OpenTelemetry collector (OTLP 4317/4318)
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    ports: ["3000:3000", "4317:4317", "4318:4318"]
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/axiz.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/axiz-dashboards:ro
