name: setup-maven
description: >-
  JDK 25 (Temurin or GraalVM), Maven cache and Nexus as the only repository. Credentials are read
  by Maven from the NEXUS_USERNAME and NEXUS_PASSWORD environment variables of the job (secrets);
  they are never written to disk.
inputs:
  java-version:
    description: JDK version
    default: "25"
  distribution:
    description: temurin or graalvm
    default: temurin
  nexus-url:
    description: Nexus base URL
    required: true
  candidate-bundle:
    description: Bundle already signature-verified by consume-build (optional)
    default: ""
  candidate-manifest-sha256:
    description: External expected candidate manifest hash
    default: ""
  candidate-source-repository:
    description: Expected candidate producer repository
    default: ""
outputs:
  local-repository:
    description: Isolated local repository when consuming a candidate
    value: ${{ steps.settings.outputs.local-repository }}
  candidate-repository:
    description: Read-only candidate copy, separate from original build evidence
    value: ${{ steps.settings.outputs.candidate-repository }}
runs:
  using: composite
  steps:
    - if: inputs.distribution == 'temurin'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.candidate-bundle == '' && 'maven' || '' }}
    - if: inputs.distribution == 'graalvm'
      uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
      with:
        java-version: ${{ inputs.java-version }}
        distribution: graalvm-community
        cache: ${{ inputs.candidate-bundle == '' && 'maven' || '' }}
        github-token: ${{ github.token }}
    - name: Maven settings and isolated verified candidate
      id: settings
      shell: bash
      env:
        NEXUS_URL: ${{ inputs.nexus-url }}
        CANDIDATE_BUNDLE: ${{ inputs.candidate-bundle }}
        EXPECTED_HASH: ${{ inputs.candidate-manifest-sha256 }}
        SOURCE_REPOSITORY: ${{ inputs.candidate-source-repository }}
      run: |
        set -euo pipefail
        args=()
        python=python3
        if [[ -n "$CANDIDATE_BUNDLE" || -n "$EXPECTED_HASH" || -n "$SOURCE_REPOSITORY" ]]; then
          [[ -n "$CANDIDATE_BUNDLE" && -n "$EXPECTED_HASH" && -n "$SOURCE_REPOSITORY" ]]
          verifier=$(mktemp -d "$RUNNER_TEMP/axiz-maven-verifier.XXXXXXXX")
          python3 -m venv "$verifier"
          python="$verifier/bin/python"
          if [[ ! -x "$python" ]]; then python="$verifier/Scripts/python.exe"; fi
          "$python" -m pip install --require-hashes --quiet -r "$GITHUB_ACTION_PATH/../build-manifest/requirements.txt"
          args+=(--candidate "$CANDIDATE_BUNDLE" --manifest-sha256 "$EXPECTED_HASH" --repository "$SOURCE_REPOSITORY")
        fi
        "$python" "$GITHUB_ACTION_PATH/settings.py" --settings "$HOME/.m2/settings.xml" \
          --temporary "$RUNNER_TEMP" --nexus-url "$NEXUS_URL" "${args[@]}"
