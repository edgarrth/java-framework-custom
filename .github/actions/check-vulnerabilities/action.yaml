name: check-vulnerabilities
description: Complete Trivy evidence with unconditional MEDIUM/HIGH/CRITICAL blocking; requires pinned Trivy 0.76.2 installed by the preceding scanner action.
inputs:
  mode:
    description: source, sbom or service (source plus every built image platform)
    required: true
  scope:
    description: Stable artifact family; never a tag or digest that resets risk identity
    required: true
  metadata:
    description: Trusted build-inputs metadata for an SBOM or service build
    default: ''
  sbom:
    description: CycloneDX file relative to the checkout, required for sbom mode
    default: ''
  output:
    description: Evidence directory relative to the checkout
    default: target/vulnerability-policy
runs:
  using: composite
  steps:
    - name: Scan complete vulnerability inventory and evaluate protected decisions
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        POLICY_REPOSITORY: ${{ github.repository }}
        POLICY_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        POLICY_BASE: ${{ github.event.pull_request.base.sha }}
        POLICY_MODE: ${{ inputs.mode }}
        POLICY_SCOPE: ${{ inputs.scope }}
        POLICY_METADATA: ${{ inputs.metadata }}
        POLICY_SBOM: ${{ inputs.sbom }}
        POLICY_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        args=()
        if [[ -n "$POLICY_METADATA" ]]; then args+=(--metadata "$POLICY_METADATA"); fi
        if [[ -n "$POLICY_SBOM" ]]; then args+=(--sbom "$POLICY_SBOM"); fi
        python3 "$GITHUB_ACTION_PATH/scan.py" --root "$GITHUB_WORKSPACE" \
          --repository "$POLICY_REPOSITORY" --branch "$POLICY_BRANCH" --base "$POLICY_BASE" \
          --mode "$POLICY_MODE" --scope "$POLICY_SCOPE" \
          --output "$GITHUB_WORKSPACE/$POLICY_OUTPUT" "${args[@]}"
