name: check-release-versions
description: Validate release state and independently versioned source components.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/release-policy"
        "$RUNNER_TEMP/release-policy/bin/pip" install --require-hashes -r "$GITHUB_ACTION_PATH/../check-workflow-security/requirements.txt"
        "$RUNNER_TEMP/release-policy/bin/python" "$GITHUB_ACTION_PATH/check_release_versions.py" .
