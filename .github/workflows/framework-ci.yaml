name: framework-ci
'on':
  pull_request: null
  push:
    branches:
    - develop
    - main
    - release/**
    - hotfix/**
    tags:
    - axiz-framework-v*
    - candidate/axiz-framework/**
permissions: {}
concurrency:
  group: framework-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
    - name: Verify immutable Axiz workflow release
      env:
        GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
        GH_HOST: github.com
        AXIZ_WORKFLOWS_VERSION: axiz-workflows-v2.0.0
      shell: bash
      run: |
        set -euo pipefail
        release=$(gh api "repos/edgarrth/java-framework-custom/releases/tags/$AXIZ_WORKFLOWS_VERSION")
        jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null
  pr:
    permissions:
      packages: read
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    needs: axiz-workflows-trust
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.event_name == 'pull_request') }}
    uses: edgarrth/java-framework-custom/.github/workflows/pr.yaml@axiz-workflows-v2.0.0
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      PACKAGES_READ_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME }}
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      AXIZ_NAMING_GUARD: ${{ secrets.AXIZ_NAMING_GUARD }}
  parameters:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate: ${{ steps.version.outputs.candidate }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    - name: Resolve final coordinates and optional candidate identity
      id: version
      run: |
        set -euo pipefail
        version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().findtext("{*}properties/{*}revision"))')
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        candidate=
        if [[ "$GITHUB_REF" == refs/tags/candidate/axiz-framework/* ]]; then
          candidate=${GITHUB_REF#refs/tags/candidate/axiz-framework/}
          [[ "$candidate" =~ ^([0-9]+\.[0-9]+\.[0-9]+)/[1-9][0-9]*$ && "${BASH_REMATCH[1]}" == "$version" ]]
        elif [[ "$GITHUB_REF" == refs/tags/axiz-framework-v* ]]; then
          [[ "${GITHUB_REF#refs/tags/axiz-framework-v}" == "$version" ]]
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
      working-directory: axiz-framework
  build:
    permissions:
      packages: read
      contents: read
      actions: read
      id-token: write
    needs:
    - axiz-workflows-trust
    - parameters
    uses: edgarrth/java-framework-custom/.github/workflows/lib-build.yaml@axiz-workflows-v2.0.0
    with:
      project-directory: axiz-framework
      version: ${{ needs.parameters.outputs.version }}
      source-sha: ${{ github.sha }}
      candidate: ${{ needs.parameters.outputs.candidate }}
      maven-args: '["-Daxiz.it.requireDocker=true"]'
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      PACKAGES_READ_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME }}
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  api-compat:
    permissions:
      packages: read
      contents: read
      actions: read
    needs:
    - axiz-workflows-trust
    - build
    runs-on: ubuntu-24.04
    env:
      PACKAGES_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
      PACKAGES_URL: https://maven.pkg.github.com/edgarrth/java-framework-custom
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    # Immutable internal release; check_workflow_security verifies the fail-closed release guard.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    - uses: edgarrth/java-framework-custom/.github/actions/setup-maven@axiz-workflows-v2.0.0
      with:
        packages-url: ${{ vars.AXIZ_PACKAGES_URL || 'https://maven.pkg.github.com/edgarrth/java-framework-custom' }}
    - name: Validate the final public API
      run: |
        set -euo pipefail
        mkdir -p target/api-evidence
        mode=$(python3 -c 'import json; print(json.load(open("docs/api/release-policy.json"))["mode"])')
        if [[ "$mode" == first-release ]]; then
          ./mvnw --bootstrap -B -ntp package -DskipTests 2>&1 | tee target/api-evidence/maven.log
        elif [[ "$mode" == published-baseline ]]; then
          baseline=$(python3 -c 'import json; print(json.load(open("docs/api/release-policy.json"))["baseline"])')
          python3 .github/scripts/check-api-compatibility.py --prepare-baseline
          ./mvnw --bootstrap -B -ntp verify -Papi-compat -Daxiz.api.baseline="$baseline" -Daxiz.api.baseline.directory="$PWD/target/api-baseline" -DskipTests 2>&1 | tee target/api-evidence/maven.log
        else
          echo "Unknown API gate mode" >&2
          exit 1
        fi
        python3 .github/scripts/check-jar-modules.py --root . --output target/api-evidence/jar-modules.json
        python3 .github/scripts/check-api-compatibility.py 2>&1 | tee target/api-evidence/gate.log
      working-directory: axiz-framework
    - name: Associate every API outcome with its source
      if: always()
      run: |
        mkdir -p target/api-evidence
        python3 - <<'PYCODE'
        import json, os
        from pathlib import Path
        evidence = Path("target/api-evidence")
        source = {"schema": 1, "commit": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
        (evidence / "source.json").write_text(json.dumps(source, indent=2) + "\n")
        if not (evidence / "result.json").is_file():
            (evidence / "result.json").write_text(json.dumps({**source, "passed": False, "error": "API build or validation did not complete"}, indent=2) + "\n")
        PYCODE
      working-directory: axiz-framework
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: api-evidence-${{ github.sha }}-${{ github.run_attempt }}
        path: |-
          axiz-framework/target/api-evidence
          axiz-framework/target/api-baseline/baseline.json
          axiz-framework/**/target/japicmp/*.xml
          axiz-framework/docs/api
        retention-days: 90
        if-no-files-found: error
  native-reactive:
    permissions:
      contents: read
      actions: read
    needs: axiz-workflows-trust
    uses: ./.github/workflows/framework-native-reactive.yaml
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      PACKAGES_READ_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME }}
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
  wrapper:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install pinned framework policy dependencies in an isolated environment
      run: |
        python3 -m venv "$RUNNER_TEMP/axiz-framework-python"
        "$RUNNER_TEMP/axiz-framework-python/bin/python" -m pip install \
          --disable-pip-version-check --require-hashes --quiet -r .github/scripts/requirements.txt
        echo "$RUNNER_TEMP/axiz-framework-python/bin" >> "$GITHUB_PATH"
      working-directory: axiz-framework
    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v3.19.0
    - name: Canonical framework and demo bootstrap charts
      run: python3 .github/scripts/check-helm-bootstrap.py
      working-directory: axiz-framework
    - name: Wrapper verification scenarios
      run: .github/scripts/test-mvnw.sh
      working-directory: axiz-framework
    - name: Build inputs survive a fresh checkout
      run: |
        python3 -m unittest discover -s .github/scripts -p 'test_build_inputs.py'
        python3 -m unittest discover -s .github/scripts -p 'test_api_compatibility.py'
        python3 -m unittest discover -s .github/scripts -p 'test_collect_test_evidence.py'
        python3 -m unittest discover -s ../.github/scripts -p 'test_container_recipes.py'
        python3 -m unittest discover -s ../.github/scripts -p 'test_wiremock_image.py'
        python3 .github/scripts/check-build-inputs.py .
      working-directory: axiz-framework
    - name: Publication consumes only an independent successful build
      run: |
        python3 -m unittest discover -s .github/scripts -p 'test_publish_gates.py'
        python3 .github/scripts/check-publish-gates.py ../.github/workflows/framework-ci.yaml ../.github/workflows/framework-deploy.yaml
      working-directory: axiz-framework
    - name: Framework workflows and native sample selection stay current
      run: |
        python3 -m unittest discover -s .github/scripts -p 'test_sample_workflows.py'
        python3 .github/scripts/check-sample-workflows.py --workflows ../.github/workflows
      working-directory: axiz-framework
    - name: One version per third-party library, defined once
      run: python3 .github/scripts/check-dependency-governance.py . ../axiz-tools ../axiz-demo
      working-directory: axiz-framework
    - name: Module names, parents and reactive dependency rules
      run: python3 .github/scripts/check-layer-structure.py .
      working-directory: axiz-framework
    - name: spring.factories uses the reviewed environment and ConfigData extension points
      run: python3 .github/scripts/check-spring-factories.py .
      working-directory: axiz-framework
    - name: Contract rules and response examples (Spectral)
      run: node .github/scripts/test-contracts.cjs
      working-directory: axiz-framework
    - name: The aggregated coverage report lists every module with code
      run: python3 .github/scripts/check-coverage-aggregate.py .
      working-directory: axiz-framework
    - name: Maven distribution checksum pinned (repository and generated projects)
      run: |
        for f in .mvn/wrapper/maven-wrapper.properties \
                 codegen/axiz-codegen-templates/src/main/resources/axiz/templates/shared/mvn/wrapper/maven-wrapper.properties; do
          grep -q '^distributionSha512Sum=' "$f" || { echo "::error::$f: run ./mvnw --pin-checksum"; exit 1; }
        done
      working-directory: axiz-framework
  samples:
    permissions:
      packages: read
      contents: read
      actions: read
    needs: axiz-workflows-trust
    runs-on: ubuntu-24.04
    env:
      PACKAGES_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
      PACKAGES_URL: https://maven.pkg.github.com/edgarrth/java-framework-custom
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Immutable internal release; check_workflow_security verifies the fail-closed release guard.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        persist-credentials: false
    # Exact immutable internal release; fail-closed verification is checked by workflow policy.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    - uses: edgarrth/java-framework-custom/.github/actions/setup-maven@axiz-workflows-v2.0.0
      with:
        packages-url: ${{ vars.AXIZ_PACKAGES_URL || 'https://maven.pkg.github.com/edgarrth/java-framework-custom' }}
    - name: Install the framework and generate the samples
      run: .github/scripts/samples.sh
      working-directory: axiz-framework
    - name: Generated MVC and WebFlux authorization denies missing scopes before application code
      run: bash .github/scripts/authorization-samples.sh
      working-directory: axiz-framework
    - name: Generated local infrastructure is repeatable
      run: bash .github/scripts/localstack-init-sample.sh
      working-directory: axiz-framework
    - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version-file: .github/scripts/release-version/.node-version
    - name: Release versions and POM updates of actual generated projects
      run: |
        npm ci --prefix .github/scripts/release-version --include=dev --no-audit --no-fund --ignore-scripts
        node .github/scripts/release-version/test.cjs target/samples/modules.json
      working-directory: axiz-framework
    - name: Build every sample with the consumer quality profile
      run: |
        failed=()
        for dir in target/samples/*/ target/audit-samples/*/; do
          echo "::group::${dir}"
          (cd "$dir" && ./mvnw -B -ntp -Pquality spotless:check verify) || failed+=("$dir")
          empty=()
          if [[ "$dir" == target/samples/axiz-sample-library/ ]]; then empty=(--allow-empty); fi
          python3 .github/scripts/collect-test-evidence.py "$dir" "${empty[@]}" \
            --output "$dir/target/test-evidence.json" || failed+=("$dir evidence")
          echo "::endgroup::"
        done
        if [ "${#failed[@]}" -gt 0 ]; then
          echo "::error::samples failed: ${failed[*]}"; exit 1
        fi
      working-directory: axiz-framework
    - name: Verify packaged web identity support without Kafka
      run: python3 .github/scripts/check-packaged-samples-irsa.py
      working-directory: axiz-framework
    - name: Check effective Kafka IAM configuration with consumer Spring runtime
      run: bash .github/scripts/check-sample-kafka-iam.sh
      working-directory: axiz-framework
    - name: Preserve complete sample test evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: generated-samples-test-evidence
        path: |-
          axiz-framework/target/samples/**/target/test-evidence.json
          axiz-framework/target/audit-samples/**/target/test-evidence.json
          axiz-framework/target/generated-packaged-irsa.json
        if-no-files-found: error
        retention-days: 90
  framework-pr-check:
    name: axiz-framework-pr
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [axiz-workflows-trust, pr, parameters, build, api-compat, native-reactive, wrapper, samples]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every pull request job
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPABLE: '[]'
        run: |
          jq -e --argjson skippable "$SKIPPABLE" 'length > 0 and all(to_entries[];
            .value.result == "success"
            or (.value.result == "skipped" and (.key | IN($skippable[]))))' <<< "$NEEDS" >/dev/null
