# Despliegue manual de un servicio de la demo: promueve a un ambiente un digest ya construido y
# atestiguado por service-build. Las reglas de protección del ambiente de GitHub (aprobaciones,
# ramas permitidas) se aplican antes de ejecutar el job; volver atrás es desplegar un digest anterior.
name: demo-deploy

on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        options: [beneficiaries, banking-core, notifications-processor, payment-process,
                  payment-network-gateway, payment-orders, payments-ux, payments-history, settlement-batch]
      environment:
        type: choice
        options: [dev, qa, prod]
      digest:
        description: Digest sha256 de la imagen publicada
        type: string
        required: true
      version:
        description: Versión del chart publicado
        type: string
        required: true

permissions: {}

jobs:
  deploy:
    uses: ./.github/workflows/service-deploy.yaml
    permissions:
      contents: write
      packages: read
      attestations: read
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
      digest: ${{ inputs.digest }}
      version: ${{ inputs.version }}
      gitops-repository: ${{ vars.AXIZ_GITOPS_REPOSITORY }}
    secrets:
      GITOPS_APP_CLIENT_ID: ${{ secrets.GITOPS_APP_CLIENT_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
