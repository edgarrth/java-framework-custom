# Workflow reutilizable para proyectos Maven (librerías, starters, el framework y las herramientas).
# verify compila con el perfil quality, ejecuta las pruebas y escanea el grafo de dependencias
# resuelto. publish (solo cuando se pide) despliega en GitHub Packages y atestigua la procedencia
# de cada jar con las atestaciones nativas de GitHub.
name: lib-build

on:
  workflow_call:
    inputs:
      working-directory:
        description: Raíz del proyecto Maven dentro del repositorio
        type: string
        default: '.'
      java-version:
        type: string
        default: '25'
      bootstrap:
        description: Ejecuta el wrapper con --bootstrap (instala primero los BOM y parents locales)
        type: boolean
        default: false
      maven-args:
        description: Argumentos adicionales para la verificación
        type: string
        default: ''
      maven-artifact:
        description: Artefacto del mismo run con un fragmento del repositorio Maven local, por ejemplo el framework del mismo commit
        type: string
        default: ''
      setup-command:
        description: Comando previo, por ejemplo instalar el framework del mismo commit
        type: string
        default: ''
      modules:
        description: Directorios a construir, relativos a working-directory y separados por espacios; vacío construye todo el proyecto
        type: string
        default: ''
      cache-key:
        description: Distingue el caché de dependencias cuando varias llamadas comparten working-directory
        type: string
        default: ''
      maven-threads:
        description: Hilos de Maven para construir módulos en paralelo (-T), por ejemplo 1C; vacío construye en secuencia
        type: string
        default: ''
      scan-dependencies:
        description: Escanea el SBOM del proyecto completo; en una matriz basta con una entrada
        type: boolean
        default: true
      verify:
        description: Ejecuta la verificación; se omite al publicar lo que ya verificó otra llamada
        type: boolean
        default: true
      publish:
        description: Despliega en GitHub Packages con procedencia atestiguada
        type: boolean
        default: false

permissions: {}

# Maven Central responde 429 cuando muchos jobs descargan a la vez: el resolver reintenta con espera
# exponencial (respeta Retry-After). setup-java conserva este valor y le agrega -ntp.
env:
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=8
    -Daether.connector.http.retryHandler.interval=10000
    -Daether.connector.http.retryHandler.intervalMax=120000

jobs:
  verify:
    if: inputs.verify
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BOOTSTRAP: ${{ inputs.bootstrap && '--bootstrap' || '' }}
      MAVEN_ARGS_EXTRA: ${{ inputs.maven-args }}
      MODULES: ${{ inputs.modules }}
      MAVEN_THREADS: ${{ inputs.maven-threads }}
      SETUP_COMMAND: ${{ inputs.setup-command }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      # Caché propio de este job: la clave restaura el anterior aunque cambie un pom.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-lib-${{ inputs.working-directory }}-${{ inputs.cache-key }}-${{ hashFiles(format('{0}/**/pom.xml', inputs.working-directory)) }}
          restore-keys: maven-lib-${{ inputs.working-directory }}-${{ inputs.cache-key }}-
      - name: Artefactos Maven del mismo run
        if: inputs.maven-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.maven-artifact }}
          path: ${{ runner.temp }}/maven-artifact
      - name: Fragmento copiado al repositorio Maven local
        if: inputs.maven-artifact != ''
        working-directory: .
        run: mkdir -p ~/.m2/repository && cp -r "$RUNNER_TEMP/maven-artifact/." ~/.m2/repository/
      - name: Preparación
        if: inputs.setup-command != ''
        working-directory: .
        run: bash -euo pipefail -c "$SETUP_COMMAND"
      - name: Compilación, pruebas y controles de calidad
        run: |
          select=()
          if [[ -n "$MODULES" ]]; then
            # Cada directorio aporta todos sus proyectos Maven; los demás se resuelven del repositorio local.
            # shellcheck disable=SC2086 # los directorios se separan a propósito
            projects=$(find $MODULES -name pom.xml -not -path '*/target/*' -not -path '*/src/*' -printf '%h\n' | sort | paste -sd, -)
            select=(-pl "$projects")
          fi
          threads=()
          [[ -z "$MAVEN_THREADS" ]] || threads=(-T "$MAVEN_THREADS")
          # shellcheck disable=SC2086 # los argumentos adicionales se separan a propósito
          ./mvnw $BOOTSTRAP -B -ntp "${threads[@]}" -Pquality "${select[@]}" verify $MAVEN_ARGS_EXTRA
      - name: SBOM del grafo de dependencias resuelto
        if: inputs.scan-dependencies
        run: ./mvnw -B -ntp -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json -DincludeTestScope=true
      - name: Vulnerabilidades MEDIUM, HIGH y CRITICAL bloquean
        if: inputs.scan-dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: sbom
          scan-ref: ${{ inputs.working-directory }}/target/bom.json
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'

  publish:
    if: ${{ !cancelled() && inputs.publish && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BOOTSTRAP: ${{ inputs.bootstrap && '--bootstrap' || '' }}
      SETUP_COMMAND: ${{ inputs.setup-command }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Artefactos Maven del mismo run
        if: inputs.maven-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.maven-artifact }}
          path: ${{ runner.temp }}/maven-artifact
      - name: Fragmento copiado al repositorio Maven local
        if: inputs.maven-artifact != ''
        working-directory: .
        run: mkdir -p ~/.m2/repository && cp -r "$RUNNER_TEMP/maven-artifact/." ~/.m2/repository/
      - name: Preparación
        if: inputs.setup-command != ''
        working-directory: .
        run: bash -euo pipefail -c "$SETUP_COMMAND"
      - name: Despliegue en GitHub Packages
        run: |
          # shellcheck disable=SC2086 # BOOTSTRAP vacío o --bootstrap
          ./mvnw $BOOTSTRAP -B -ntp -Prelease -DskipTests deploy
      - name: Procedencia de los jars publicados
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.working-directory }}/**/target/*.jar
