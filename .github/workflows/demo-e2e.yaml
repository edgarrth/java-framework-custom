name: demo-e2e
'on':
  schedule:
  - cron: 17 6 * * 1-5
  workflow_dispatch: null
permissions: {}
jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
    - name: Verify immutable Axiz workflow release
      env:
        GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
        GH_HOST: github.com
        AXIZ_WORKFLOWS_VERSION: axiz-workflows-v2.0.0 # x-release-please-version
      shell: bash
      run: |
        set -euo pipefail
        release=$(gh api "repos/edgarrth/java-framework-custom/releases/tags/$AXIZ_WORKFLOWS_VERSION")
        jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null
  kind:
    permissions:
      contents: read
      actions: read
    needs: axiz-workflows-trust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    # Immutable internal release; check_workflow_security verifies the fail-closed release guard.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    - uses: edgarrth/java-framework-custom/.github/actions/setup-maven@axiz-workflows-v2.0.0 # x-release-please-version
      with:
        nexus-url: ${{ secrets.NEXUS_URL }}
    - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3
      with:
        install_only: true
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
    - name: Deploy the demo
      env:
        NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
        NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
      run: kind/up.sh
      working-directory: axiz-demo
    - name: Smoke test
      env:
        SMOKE_LOCAL: '0'
        KC_URL: http://localhost:9180
        CHANNEL_URL: http://localhost:9080
        CRUD_URL: http://localhost:9082
        HISTORY_URL: http://localhost:9086
      run: |
        kubectl -n axiz-demo port-forward svc/beneficiaries 9082:80 &
        kubectl -n axiz-demo port-forward svc/payments-history 9086:80 &
        sleep 3
        scripts/smoke.sh
      working-directory: axiz-demo
    - name: Diagnostics
      if: failure()
      run: |
        kubectl -n axiz-demo get pods -o wide
        for d in $(kubectl -n axiz-demo get deploy -o name); do kubectl -n axiz-demo logs "$d" --tail=200 || true; done
      working-directory: axiz-demo
