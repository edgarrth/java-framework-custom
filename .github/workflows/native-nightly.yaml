# Compilación nativa nocturna: construye y ejecuta las pruebas de cada módulo listado como imagen nativa
# de GraalVM, de modo que los problemas de AOT y de alcanzabilidad aparecen el mismo día en que se introducen.
# La usan la demo (cada servicio) y el framework (un servicio generado por arquetipo).
name: native-nightly
on:
  workflow_call:
    inputs:
      project-directory:
        description: Relative product root in the source checkout
        type: string
        default: '.'
      modules:
        description: JSON list of Maven project directories, e.g. ["services/payments-business"]
        type: string
        required: true
      generate-script:
        description: Optional script that prepares the modules first (e.g. generates services)
        type: string
        default: ""
      runner:
        type: string
        default: ubuntu-24.04
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN:
        description: Read-only token for private immutable release verification (optional for public repositories)
        required: false
      PACKAGES_READ_USERNAME:
        required: false
      PACKAGES_READ_TOKEN:
        required: false

permissions: {}

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: axiz-workflows-v2.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/edgarrth/java-framework-custom/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  native:
    permissions:
      packages: read
      contents: read
      actions: read
    needs: axiz-workflows-trust
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    runs-on: ${{ inputs.runner }}
    env:
      PACKAGES_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
      MODULE: ${{ matrix.module }}
      GENERATE: ${{ inputs.generate-script }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Release interna inmutable: axiz-workflows-trust debe completarse con éxito antes.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: edgarrth/java-framework-custom/.github/actions/setup-maven@axiz-workflows-v2.0.0 # x-release-please-version
        with:
          distribution: graalvm
          packages-url: ${{ vars.AXIZ_PACKAGES_URL || 'https://maven.pkg.github.com/edgarrth/java-framework-custom' }}
      - name: Prepare
        if: inputs.generate-script != ''
        run: bash "$GENERATE"
        working-directory: ${{ inputs.project-directory }}
      - name: Native image and native tests
        working-directory: ${{ inputs.project-directory }}/${{ matrix.module }}
        run: mvn -B -ntp -Pnative package native:compile native:test
      - name: Binary size
        working-directory: ${{ inputs.project-directory }}/${{ matrix.module }}
        run: |
          for bin in target/*; do
            [ -f "$bin" ] && [ -x "$bin" ] && echo "- \`$MODULE\`: $(du -h "$bin" | cut -f1) ($(basename "$bin"))" >> "$GITHUB_STEP_SUMMARY"
          done
          true
