# Verificaciones nocturnas de la demo: despliegue completo en un clúster kind con prueba de humo y
# escaneo DAST autenticado, y compilación nativa de cada servicio.
name: demo-nightly

on:
  schedule:
    - cron: '17 6 * * 1-5'
  workflow_dispatch:

permissions: {}

# Maven Central responde 429 cuando muchos jobs descargan a la vez: el resolver reintenta con espera
# exponencial (respeta Retry-After). setup-java conserva este valor y le agrega -ntp.
env:
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=8
    -Daether.connector.http.retryHandler.interval=10000
    -Daether.connector.http.retryHandler.intervalMax=120000

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      # Caché propio de este job: la clave restaura el anterior aunque cambie un pom.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-demo-e2e-${{ hashFiles('axiz-demo/**/pom.xml') }}
          restore-keys: maven-demo-e2e-
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - name: Framework del mismo commit
        working-directory: axiz-framework
        run: ./mvnw --bootstrap -B -ntp -q -DskipTests install
      - name: Clúster kind con la demo completa
        working-directory: axiz-demo
        run: kind/up.sh
      - name: Prueba de humo
        working-directory: axiz-demo
        env:
          SMOKE_LOCAL: '0'
          KC_URL: http://localhost:9180
          CHANNEL_URL: http://localhost:9080
          CRUD_URL: http://localhost:9082
          HISTORY_URL: http://localhost:9086
        run: |
          kubectl -n axiz-demo port-forward svc/beneficiaries 9082:80 &
          kubectl -n axiz-demo port-forward svc/payments-history 9086:80 &
          sleep 3
          scripts/smoke.sh
      - name: DAST autenticado (OWASP ZAP) de cada contrato REST
        working-directory: axiz-demo
        env:
          KC_URL: http://localhost:9180
        run: |
          for pair in payment-orders:9081 banking-core:9083 payment-process:9084 payment-network-gateway:9087; do
            kubectl -n axiz-demo port-forward "svc/${pair%%:*}" "${pair##*:}:80" &
          done
          sleep 3
          DAST_TARGETS="payments-ux=http://localhost:9080 payment-orders=http://localhost:9081 \
            beneficiaries=http://localhost:9082 banking-core=http://localhost:9083 \
            payment-process=http://localhost:9084 payments-history=http://localhost:9086 \
            payment-network-gateway=http://localhost:9087" scripts/dast.sh
      - name: Reportes DAST
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-reports
          path: axiz-demo/target/dast
          if-no-files-found: ignore
      - name: Diagnóstico
        if: failure()
        run: |
          kubectl -n axiz-demo get pods -o wide
          for d in $(kubectl -n axiz-demo get deploy -o name); do kubectl -n axiz-demo logs "$d" --tail=200 || true; done

  framework:
    uses: ./.github/workflows/framework-snapshot.yaml
    permissions:
      contents: read

  native:
    needs: framework
    strategy:
      fail-fast: false
      matrix:
        service: [payments-ux, payment-orders, beneficiaries, banking-core, payment-process,
                  payments-history, notifications-processor, settlement-batch]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25'
          distribution: graalvm-community
      # Caché propio de este job: la clave restaura el anterior aunque cambie un pom.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-demo-native-${{ matrix.service }}-${{ hashFiles(format('axiz-demo/services/{0}/pom.xml', matrix.service)) }}
          restore-keys: maven-demo-native-${{ matrix.service }}-
      - name: Framework del mismo commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.framework.outputs.artifact }}
          path: ${{ runner.temp }}/maven-artifact
      - name: Framework copiado al repositorio Maven local
        run: mkdir -p ~/.m2/repository && cp -r "$RUNNER_TEMP/maven-artifact/." ~/.m2/repository/
      - name: Imagen nativa y pruebas nativas
        working-directory: axiz-demo/services/${{ matrix.service }}
        run: ./mvnw -B -ntp -Pnative package native:compile native:test
