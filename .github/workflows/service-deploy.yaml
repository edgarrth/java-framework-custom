name: service-deploy
on:
  workflow_call:
    inputs:
      build-run-id: {type: string, required: true}
      build-run-attempt: {type: string, required: true}
      manifest-sha256: {type: string, required: true}
      environment: {type: string, required: true}
      values-revision:
        description: Full commit SHA of environment values in the service source repository
        type: string
        required: true
      previous-manifest-sha256:
        description: Current deployed manifest hash or initial-deployment, checked before writing
        type: string
        required: true
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: {required: false}
      BUILD_READ_TOKEN: {required: false}
      BUILD_DESTINATION: {required: true}
      GITOPS_APP_CLIENT_ID: {required: true}
      GITOPS_APP_PRIVATE_KEY: {required: true}
      ARGOCD_AUTH_TOKEN: {required: true}

permissions: {}

concurrency:
  group: service-deploy-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: axiz-workflows-v2.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/edgarrth/java-framework-custom/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  destination:
    needs: axiz-workflows-trust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate destination before selecting protected environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VALUES_REVISION: ${{ inputs.values-revision }}
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
        run: |
          set -euo pipefail
          [[ "$ENVIRONMENT" == dev || "$ENVIRONMENT" == qa || "$ENVIRONMENT" == prod ]]
          [[ "$VALUES_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARGOCD_SERVER" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]

  deploy:
    permissions:
      packages: read
      contents: write
      actions: read
      id-token: write
    needs: [axiz-workflows-trust, destination]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    steps:
      - name: Isolate registry read credentials
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/axiz-deploy-docker" >> "$GITHUB_ENV"
          echo "HELM_REGISTRY_CONFIG=$RUNNER_TEMP/axiz-deploy-helm/config.json" >> "$GITHUB_ENV"
      # Release interna inmutable: axiz-workflows-trust debe completarse con éxito antes.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: edgarrth/java-framework-custom/.github/actions/consume-build@axiz-workflows-v2.0.0 # x-release-please-version
        id: build
        with:
          repository: ${{ github.repository }}
          build-run-id: ${{ inputs.build-run-id }}
          build-run-attempt: ${{ inputs.build-run-attempt }}
          manifest-sha256: ${{ inputs.manifest-sha256 }}
          kind: service
          token: ${{ secrets.BUILD_READ_TOKEN || github.token }}
      - name: Resolve trusted deployment destination before credentials
        id: destination
        env:
          BUILD_DESTINATION: ${{ secrets.BUILD_DESTINATION }}
          PYTHON: ${{ steps.build.outputs.python }}
          TOOLS: ${{ steps.build.outputs.tools-path }}
          BUNDLE: ${{ steps.build.outputs.bundle-path }}
        run: |
          set -euo pipefail
          export SERVICE
          SERVICE=$(jq -er '.parameters.service' "$BUNDLE/build-manifest.json")
          "$PYTHON" "$TOOLS/build_destination.py" deployment >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - name: Verify immutable registry content, values and environment approval
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.BUILD_READ_TOKEN || github.token }}
          GH_HOST: github.com
          BUNDLE: ${{ steps.build.outputs.bundle-path }}
          PYTHON: ${{ steps.build.outputs.python }}
          TOOLS: ${{ steps.build.outputs.tools-path }}
          HASH: ${{ inputs.manifest-sha256 }}
          ENVIRONMENT: ${{ inputs.environment }}
          VALUES_REVISION: ${{ inputs.values-revision }}
          PREVIOUS: ${{ inputs.previous-manifest-sha256 }}
          GITOPS: ${{ steps.destination.outputs.repository }}
          BRANCH: ${{ steps.destination.outputs.branch }}
          USERNAME: ${{ github.actor }}
          PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG" "$(dirname "$HELM_REGISTRY_CONFIG")"
          chmod 700 "$DOCKER_CONFIG" "$(dirname "$HELM_REGISTRY_CONFIG")"
          mapfile -t registries < <(jq -r '[.artifacts.image.repository,.artifacts.chart.oci|sub("^oci://";"")|split("/")[0]]|unique[]' "$BUNDLE/build-manifest.json")
          for registry in "${registries[@]}"; do
            if [[ "$registry" != ghcr.io ]]; then
              echo "::error::Deployment registry must be ghcr.io"
              exit 1
            fi
            printf '%s' "$PASSWORD" | docker login "$registry" --username "$USERNAME" --password-stdin
            printf '%s' "$PASSWORD" | helm registry login "$registry" --username "$USERNAME" --password-stdin
          done
          "$PYTHON" "$TOOLS/service_deploy.py" --bundle "$BUNDLE" --manifest-sha256 "$HASH" \
            --repository "$GITHUB_REPOSITORY" --environment "$ENVIRONMENT" --values-revision "$VALUES_REVISION" \
            --output "$RUNNER_TEMP/prepared-deployment.json" --configuration "$RUNNER_TEMP/values-refs.json"
          jq --arg environment "$ENVIRONMENT" --arg gitops "$GITOPS" --arg branch "$BRANCH" '. + [
            {name:"gitops-destination",ref:("https://github.com/"+$gitops+"/tree/"+$branch)},
            {name:"gitops-app",ref:("environment:"+$environment+"/GITOPS_APP_CLIENT_ID")},
            {name:"gitops-app-key",ref:("environment:"+$environment+"/GITOPS_APP_PRIVATE_KEY")},
            {name:"argocd-read-token",ref:("environment:"+$environment+"/ARGOCD_AUTH_TOKEN")}
          ]' "$RUNNER_TEMP/values-refs.json" > "$RUNNER_TEMP/deploy-configuration.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/approvals.json"
          "$PYTHON" "$TOOLS/deploy_record.py" --bundle "$BUNDLE" --manifest-sha256 "$HASH" \
            --repository "$GITHUB_REPOSITORY" --environment "$ENVIRONMENT" --destination "https://github.com/$GITOPS" \
            --previous-manifest "$PREVIOUS" --approvals "$RUNNER_TEMP/approvals.json" \
            --configuration "$RUNNER_TEMP/deploy-configuration.json" --result requested --output "$RUNNER_TEMP/deploy-request.json"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/deploy-request.sigstore.json" "$RUNNER_TEMP/deploy-request.json"
          echo "request-sha256=$(sha256sum "$RUNNER_TEMP/deploy-request.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          permission-contents: write
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ steps.destination.outputs.owner }}
          repositories: ${{ steps.destination.outputs.name }}
      - name: Commit approved digests and signed request to GitOps
        id: gitops
        env:
          PYTHON: ${{ steps.build.outputs.python }}
          TOOLS: ${{ steps.build.outputs.tools-path }}
          HASH: ${{ inputs.manifest-sha256 }}
          ENVIRONMENT: ${{ inputs.environment }}
          PREVIOUS: ${{ inputs.previous-manifest-sha256 }}
          BUILD_DESTINATION: ${{ secrets.BUILD_DESTINATION }}
          GITOPS_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          "$PYTHON" "$TOOLS/gitops.py" \
            --prepared "$RUNNER_TEMP/prepared-deployment.json" --manifest-sha256 "$HASH" \
            --environment "$ENVIRONMENT" --previous-manifest "$PREVIOUS" \
            --record "$RUNNER_TEMP/deploy-request.json" --signature "$RUNNER_TEMP/deploy-request.sigstore.json"
      - name: Confirm Argo CD applied the approved immutable sources
        id: health
        env:
          PYTHON: ${{ steps.build.outputs.python }}
          TOOLS: ${{ steps.build.outputs.tools-path }}
          HASH: ${{ inputs.manifest-sha256 }}
          ENVIRONMENT: ${{ inputs.environment }}
          RECORD: ${{ steps.preflight.outputs.request-sha256 }}
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          "$PYTHON" "$TOOLS/wait_service.py" --prepared "$RUNNER_TEMP/prepared-deployment.json" \
            --manifest-sha256 "$HASH" --environment "$ENVIRONMENT" --record-sha256 "$RECORD" --server "$ARGOCD_SERVER"
      - name: Sign deployment outcome
        id: record
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        env:
          BUNDLE: ${{ steps.build.outputs.bundle-path }}
          PYTHON: ${{ steps.build.outputs.python }}
          TOOLS: ${{ steps.build.outputs.tools-path }}
          HASH: ${{ inputs.manifest-sha256 }}
          ENVIRONMENT: ${{ inputs.environment }}
          PREVIOUS: ${{ inputs.previous-manifest-sha256 }}
          GITOPS: ${{ steps.destination.outputs.repository }}
          HEALTH: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          result=failed
          if [[ "$HEALTH" == success ]]; then result=succeeded; fi
          "$PYTHON" "$TOOLS/deploy_record.py" --bundle "$BUNDLE" --manifest-sha256 "$HASH" \
            --repository "$GITHUB_REPOSITORY" --environment "$ENVIRONMENT" --destination "https://github.com/$GITOPS" \
            --previous-manifest "$PREVIOUS" --approvals "$RUNNER_TEMP/approvals.json" \
            --configuration "$RUNNER_TEMP/deploy-configuration.json" --result "$result" --output "$RUNNER_TEMP/deploy-record.json"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/deploy-record.sigstore.json" "$RUNNER_TEMP/deploy-record.json"
      - name: Retain signed outcome in GitOps audit
        if: ${{ always() && steps.gitops.outcome == 'success' && steps.record.outcome == 'success' }}
        env:
          PYTHON: ${{ steps.build.outputs.python }}
          TOOLS: ${{ steps.build.outputs.tools-path }}
          HASH: ${{ inputs.manifest-sha256 }}
          ENVIRONMENT: ${{ inputs.environment }}
          PREVIOUS: ${{ inputs.previous-manifest-sha256 }}
          BUILD_DESTINATION: ${{ secrets.BUILD_DESTINATION }}
          GITOPS_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          "$PYTHON" "$TOOLS/gitops.py" \
            --prepared "$RUNNER_TEMP/prepared-deployment.json" --manifest-sha256 "$HASH" \
            --environment "$ENVIRONMENT" --previous-manifest "$PREVIOUS" --outcome \
            --record "$RUNNER_TEMP/deploy-record.json" --signature "$RUNNER_TEMP/deploy-record.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.record.outcome == 'success' }}
        with:
          name: deploy-record-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/deploy-request.json
            ${{ runner.temp }}/deploy-request.sigstore.json
            ${{ runner.temp }}/deploy-record.json
            ${{ runner.temp }}/deploy-record.sigstore.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry read credentials
        if: always()
        run: rm -rf "$DOCKER_CONFIG" "$(dirname "$HELM_REGISTRY_CONFIG")"
