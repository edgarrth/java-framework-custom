# Workflow reutilizable de despliegue GitOps. Verifica con `gh attestation verify` que el digest de
# la imagen fue construido por el workflow service-build de Axiz y escribe en el repositorio GitOps
# el archivo environments/<ambiente>/<servicio>.yaml que lee el ApplicationSet de Argo CD. El
# ambiente de GitHub aplica sus reglas de protección (aprobaciones, ramas) antes de ejecutar el job.
# Promover a otro ambiente o volver atrás es desplegar otro digest ya construido; nunca se recompila.
name: service-deploy

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      environment:
        description: Ambiente de GitHub y de GitOps (dev, qa, prod)
        type: string
        required: true
      image:
        description: Repositorio de la imagen, sin tag ni digest; por defecto ghcr.io/<owner>/<servicio>
        type: string
        default: ''
      digest:
        description: Digest sha256 de la imagen construida
        type: string
        required: true
      chart:
        description: Repositorio OCI del chart; por defecto oci://ghcr.io/<owner>/charts/<servicio>
        type: string
        default: ''
      version:
        description: Versión del chart publicado
        type: string
        required: true
      gitops-repository:
        description: Repositorio GitOps owner/name; por defecto, el mismo repositorio
        type: string
        default: ''
    secrets:
      GITOPS_APP_CLIENT_ID:
        required: false
      GITOPS_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
      attestations: read
    env:
      SERVICE: ${{ inputs.service }}
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image || format('ghcr.io/{0}/{1}', github.repository_owner, inputs.service) }}
      DIGEST: ${{ inputs.digest }}
      CHART: ${{ inputs.chart || format('oci://ghcr.io/{0}/charts/{1}', github.repository_owner, inputs.service) }}
      VERSION: ${{ inputs.version }}
      GITOPS: ${{ inputs.gitops-repository || github.repository }}
    steps:
      - name: Entradas válidas
        id: gitops
        run: |
          [[ "$SERVICE" =~ ^[a-z0-9][a-z0-9-]*$ && "$ENVIRONMENT" =~ ^[a-z0-9-]+$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$CHART" == oci://* && "$GITOPS" == */* ]]
          echo "owner=${GITOPS%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${GITOPS#*/}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: La imagen fue construida por el workflow service-build de Axiz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow edgarrth/java-framework-custom/.github/workflows/service-build.yaml
      - name: Token del repositorio GitOps
        id: app
        if: inputs.gitops-repository != '' && inputs.gitops-repository != github.repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ steps.gitops.outputs.owner }}
          repositories: ${{ steps.gitops.outputs.name }}
          permission-contents: write
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.GITOPS }}
          ref: main
          token: ${{ steps.app.outputs.token || github.token }}
          path: gitops
          persist-credentials: false
      - name: Estado deseado del servicio en el ambiente
        working-directory: gitops
        env:
          GIT_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          file="environments/$ENVIRONMENT/$SERVICE.yaml"
          mkdir -p "$(dirname "$file")"
          cat > "$file" <<EOF
          # Escrito por service-deploy; Argo CD lo lee con su ApplicationSet.
          service: $SERVICE
          environment: $ENVIRONMENT
          image:
            repository: $IMAGE
            digest: $DIGEST
          chart:
            oci: $CHART
            version: $VERSION
          source:
            repository: $GITHUB_REPOSITORY
            run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          if git diff --cached --quiet; then
            echo "El ambiente ya tiene ese digest; no hay cambios."
            exit 0
          fi
          git commit -m "deploy($ENVIRONMENT): $SERVICE $VERSION ${DIGEST:7:12}"
          # La credencial vive solo en este paso; no se persiste en la copia ni en artefactos.
          git remote set-url origin "https://x-access-token:$GIT_TOKEN@github.com/$GITOPS.git"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
