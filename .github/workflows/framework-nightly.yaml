# Verificaciones nocturnas del framework que son demasiado lentas para cada pull request: todas las
# combinaciones de proyectos generados, la compilación nativa de los ejemplos y la aceptación
# reactiva nativa.
name: framework-nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  samples-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Todas las combinaciones de arquetipo, estructura, stack y persistencia
        working-directory: axiz-framework
        env:
          MODE: all
        run: .github/scripts/samples.sh
      - name: Cada proyecto generado compila con el perfil quality, sin credenciales de AWS del runner
        working-directory: axiz-framework
        run: |
          failed=()
          for dir in target/samples/*/ target/audit-samples/*/; do
            echo "::group::$dir"
            (cd "$dir" && env -u AWS_REGION -u AWS_DEFAULT_REGION -u AWS_PROFILE \
              -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
              AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null \
              ./mvnw -B -ntp -Pquality spotless:check verify) || failed+=("$dir")
            echo "::endgroup::"
          done
          if [[ "${#failed[@]}" -gt 0 ]]; then
            echo "::error::Proyectos con fallas: ${failed[*]}"
            exit 1
          fi

  native-samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      - name: Ejemplos por defecto generados
        working-directory: axiz-framework
        run: .github/scripts/samples.sh
      - name: Imagen nativa y pruebas nativas de cada ejemplo de servicio
        working-directory: axiz-framework/target/samples
        run: |
          for sample in sample-orders sample-core sample-gateway sample-ux sample-support \
                        sample-notifications-processor sample-settlement-batch; do
            echo "::group::$sample"
            (cd "$sample" && ./mvnw -B -ntp -Pnative package native:compile native:test)
            echo "::endgroup::"
          done

  native-reactive:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      - name: Servicio reactivo nativo de aceptación
        working-directory: axiz-framework
        run: bash .github/scripts/reactive-native-sample.sh
