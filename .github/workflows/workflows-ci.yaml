name: workflows-ci
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions: {}
jobs:
  contracts:
    name: axiz-workflows-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Isolated and hash-verified policy dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/policy"
          "$RUNNER_TEMP/policy/bin/pip" install --require-hashes -r .github/actions/build-manifest/requirements.txt
          "$RUNNER_TEMP/policy/bin/pip" install --require-hashes -r .github/actions/check-workflow-security/requirements.txt
          "$RUNNER_TEMP/policy/bin/pip" install --require-hashes --only-binary=:all: -r axiz-docs/requirements.txt
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .github/scripts/release-version/.node-version
      - name: Locked regression engines without installation scripts
        run: npm ci --prefix .github/scripts/release-version --include=dev --ignore-scripts --no-audit --no-fund
      - name: Prepare read-only security reports for all three npm locks
        run: '"$RUNNER_TEMP/policy/bin/python" .github/scripts/npm_audit_summary.py collect --output "$RUNNER_TEMP/npm-audits.json"'
      - name: Prepare the reviewed upstream release action metadata
        run: '"$RUNNER_TEMP/policy/bin/python" .github/scripts/release_action.py prepare --cache "$RUNNER_TEMP/release-action-metadata"'
      - name: Prepare pinned actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Prepare pinned kubeconform and offline CRD schemas
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/policy/bin/python" .github/scripts/prepare_workflow_schemas.py --output "$RUNNER_TEMP/crd-schemas"
      - name: Prepare pinned Kyverno and Gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kyverno.tar.gz" "$(jq -er '.archive' .github/gitops/kyverno.json)"
          echo "$(jq -er '.sha256' .github/gitops/kyverno.json)  $RUNNER_TEMP/kyverno.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kyverno.tar.gz" -C "$RUNNER_TEMP" kyverno
          docker pull ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      - name: Shared offline policy controls
        env:
          AXIZ_ACTIONLINT: ${{ runner.temp }}/actionlint
          AXIZ_KUBECONFORM: ${{ runner.temp }}/kubeconform
          AXIZ_KYVERNO: ${{ runner.temp }}/kyverno
          AXIZ_NPM_AUDIT_INPUT: ${{ runner.temp }}/npm-audits.json
          AXIZ_RELEASE_ACTION_CACHE: ${{ runner.temp }}/release-action-metadata
          AXIZ_CRD_SCHEMAS: ${{ runner.temp }}/crd-schemas
        run: '"$RUNNER_TEMP/policy/bin/python" .github/scripts/workflows_policy_checks.py --output "$RUNNER_TEMP/policy-results"'
      - name: Complete isolated release and adoption lifecycle
        env:
          AXIZ_ACTIONLINT: ${{ runner.temp }}/actionlint
          AXIZ_KUBECONFORM: ${{ runner.temp }}/kubeconform
          AXIZ_KYVERNO: ${{ runner.temp }}/kyverno
          AXIZ_NPM_AUDIT_INPUT: ${{ runner.temp }}/npm-audits.json
          AXIZ_RELEASE_ACTION_CACHE: ${{ runner.temp }}/release-action-metadata
          AXIZ_CRD_SCHEMAS: ${{ runner.temp }}/crd-schemas
        run: '"$RUNNER_TEMP/policy/bin/python" .github/actions/check-workflow-security/release_entrypoints.py --output "$RUNNER_TEMP/lifecycle-results"'
