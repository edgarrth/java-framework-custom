name: workflows-ci
on:
  pull_request:
    paths: ['.github/**', 'release-please-config.json', '.release-please-manifest.json', '*/version.txt']
  push:
    branches: [main, develop]
    paths: ['.github/**', 'release-please-config.json', '.release-please-manifest.json', '*/version.txt']
  workflow_dispatch:
permissions: {}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Isolated and hash-verified policy dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/policy"
          "$RUNNER_TEMP/policy/bin/pip" install --require-hashes -r .github/actions/build-manifest/requirements.txt
      - name: Manifest and workflow regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/policy/bin/python" .github/actions/check-release-versions/check_release_versions.py .
          "$RUNNER_TEMP/policy/bin/python" -m unittest discover -s .github/actions/build-manifest
          "$RUNNER_TEMP/policy/bin/python" -m unittest discover -s .github/actions/check-workflow-security
          "$RUNNER_TEMP/policy/bin/python" .github/actions/check-workflow-security/check_workflow_security.py .
      - name: Pipeline contracts and remaining action regression tests
        run: |
          python="$RUNNER_TEMP/policy/bin/python"
          "$python" .github/actions/check-workflow-security/check_pipeline_contracts.py --build .github/workflows/lib-build.yaml --deploy .github/workflows/lib-deploy.yaml
          "$python" .github/actions/check-workflow-security/check_pipeline_contracts.py --build .github/workflows/service-build.yaml --deploy .github/workflows/service-deploy.yaml
          for suite in setup-maven check-encapsulation check-sbom check-mutations; do
            "$python" -m unittest discover -s ".github/actions/$suite" -p 'test_*.py'
          done
      - name: Pinned actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: GitOps CRD schemas
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/policy/bin/python" .github/actions/build-manifest/build_destination.py render --configuration .github/gitops/fixtures/build-configuration.json --output "$RUNNER_TEMP/gitops"
          "$RUNNER_TEMP/kubeconform" -strict -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' "$RUNNER_TEMP/gitops"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Renovate presets
        run: npx --yes --package renovate@41 -- renovate-config-validator .github/renovate/*.json
      - name: Release Please monorepo regression
        run: |
          npm ci --prefix .github/scripts/release-version --ignore-scripts --no-audit --no-fund
          node .github/scripts/release-version/test-monorepo.cjs
      - name: Gitleaks allowlist canaries
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.30.1
          "$RUNNER_TEMP/policy/bin/python" .github/actions/check-workflow-security/check_gitleaks.py --configuration .gitleaks.toml
