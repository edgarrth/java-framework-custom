name: tools-ci
'on':
  pull_request: null
  push:
    branches:
    - main
    - develop
    - release/**
    - hotfix/**
    tags:
    - axiz-tools-v*
    - candidate/axiz-tools/**
  workflow_dispatch:
    inputs:
      native-cli:
        description: Build signed CLI binaries for all supported operating systems
        type: boolean
        default: false
      version:
        description: Optional final build coordinate; defaults to the source POM without -SNAPSHOT
        type: string
        default: ''
      variant:
        type: choice
        options:
        - jvm
        - native
        default: jvm
      platforms:
        description: JSON image platforms
        type: string
        default: '["linux/amd64"]'
      base-image:
        description: Registry base image pinned by digest; overrides the platform variable
        type: string
        default: ''
      candidate-repository:
        description: Optional framework candidate producer repository
        type: string
        default: ''
      candidate-build-run-id:
        type: string
        default: ''
      candidate-build-run-attempt:
        type: string
        default: ''
      candidate-manifest-sha256:
        description: External signed framework candidate manifest SHA256
        type: string
        default: ''
permissions: {}
concurrency:
  group: tools-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
    - name: Verify immutable Axiz workflow release
      env:
        GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
        GH_HOST: github.com
        AXIZ_WORKFLOWS_VERSION: axiz-workflows-v2.0.0
      shell: bash
      run: |
        set -euo pipefail
        release=$(gh api "repos/edgarrth/java-framework-custom/releases/tags/$AXIZ_WORKFLOWS_VERSION")
        jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null
  parameters:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate: ${{ steps.version.outputs.candidate }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Resolve final coordinates and candidate identity
      id: version
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        version="$REQUESTED_VERSION"
        if [[ -z "$version" ]]; then
          version=$(python3 -c 'import xml.etree.ElementTree as E; p=E.parse("pom.xml").getroot(); print(p.findtext("{*}version") or p.findtext("{*}properties/{*}revision") or "")')
          version=${version%-SNAPSHOT}
        fi
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        candidate=
        if [[ "$GITHUB_REF" == refs/tags/candidate/axiz-tools/* ]]; then
          candidate=${GITHUB_REF#refs/tags/candidate/axiz-tools/}
          [[ "$candidate" =~ ^([0-9]+\.[0-9]+\.[0-9]+)/[1-9][0-9]*$ && "${BASH_REMATCH[1]}" == "$version" ]]
        elif [[ "$GITHUB_REF" == refs/tags/axiz-tools-v* ]]; then
          [[ "${GITHUB_REF#refs/tags/axiz-tools-v}" == "$version" ]]
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
      working-directory: axiz-tools
  pr:
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    needs: axiz-workflows-trust
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.event_name == 'pull_request') }}
    uses: edgarrth/java-framework-custom/.github/workflows/pr.yaml@axiz-workflows-v2.0.0
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
      AXIZ_NAMING_GUARD: ${{ secrets.AXIZ_NAMING_GUARD }}
  cli-native:
    permissions:
      contents: read
      actions: read
      id-token: write
    needs:
    - axiz-workflows-trust
    - parameters
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (startsWith(github.ref, 'refs/tags/axiz-tools-v') || inputs.native-cli
      == true) }}
    uses: edgarrth/java-framework-custom/.github/workflows/native.yaml@axiz-workflows-v2.0.0
    with:
      project-directory: axiz-tools
      module: axiz-cli
      binary: axiz
      version: ${{ needs.parameters.outputs.version }}
      source-sha: ${{ github.sha }}
      candidate: ${{ needs.parameters.outputs.candidate }}
      axiz-version: 2.0.0
      candidate-repository: ${{ inputs.candidate-repository }}
      candidate-build-run-id: ${{ inputs.candidate-build-run-id }}
      candidate-build-run-attempt: ${{ inputs.candidate-build-run-attempt }}
      candidate-manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      CANDIDATE_READ_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_READ_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_READ_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
  build:
    permissions:
      contents: read
      actions: read
      id-token: write
    needs:
    - axiz-workflows-trust
    - parameters
    - cli-native
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (!cancelled() && needs.parameters.result == 'success' && (needs.cli-native.result
      == 'success' || (needs.cli-native.result == 'skipped' && !startsWith(github.ref, 'refs/tags/axiz-tools-v') && inputs.native-cli
      != true))) }}
    uses: edgarrth/java-framework-custom/.github/workflows/lib-build.yaml@axiz-workflows-v2.0.0
    with:
      project-directory: axiz-tools
      version: ${{ needs.parameters.outputs.version }}
      source-sha: ${{ github.sha }}
      candidate: ${{ needs.parameters.outputs.candidate }}
      axiz-version: 2.0.0
      candidate-repository: ${{ inputs.candidate-repository }}
      candidate-build-run-id: ${{ inputs.candidate-build-run-id }}
      candidate-build-run-attempt: ${{ inputs.candidate-build-run-attempt }}
      candidate-manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
      native-module: ${{ (startsWith(github.ref, 'refs/tags/axiz-tools-v') || inputs.native-cli == true) && 'axiz-cli' || '' }}
      native-binary: ${{ (startsWith(github.ref, 'refs/tags/axiz-tools-v') || inputs.native-cli == true) && 'axiz' || '' }}
      native-platforms: ${{ (startsWith(github.ref, 'refs/tags/axiz-tools-v') || inputs.native-cli == true) && '["linux-x64","macos-arm64","windows-x64"]'
        || '[]' }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      CANDIDATE_READ_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_READ_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_READ_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  initializr:
    permissions:
      contents: read
      actions: read
      id-token: write
    needs:
    - axiz-workflows-trust
    - parameters
    uses: edgarrth/java-framework-custom/.github/workflows/service-build.yaml@axiz-workflows-v2.0.0
    with:
      service: axiz-initializr
      module: axiz-tools/axiz-initializr
      chart: axiz-tools/axiz-initializr/deploy/helm/axiz-initializr
      version: ${{ needs.parameters.outputs.version }}
      source-sha: ${{ github.sha }}
      variant: ${{ inputs.variant || 'jvm' }}
      platforms: ${{ inputs.platforms || '["linux/amd64"]' }}
      base-image: ${{ inputs.base-image || (inputs.variant == 'native' && vars.AXIZ_NATIVE_BASE_IMAGE || vars.AXIZ_JVM_BASE_IMAGE)
        }}
      axiz-version: 2.0.0
      candidate-repository: ${{ inputs.candidate-repository }}
      candidate-build-run-id: ${{ inputs.candidate-build-run-id }}
      candidate-build-run-attempt: ${{ inputs.candidate-build-run-attempt }}
      candidate-manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      CANDIDATE_READ_TOKEN: ${{ secrets.CANDIDATE_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_READ_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_READ_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
      BUILD_DESTINATION: ${{ secrets.BUILD_DESTINATION }}
      REGISTRY_BUILD_USERNAME: ${{ secrets.REGISTRY_BUILD_USERNAME }}
      REGISTRY_BUILD_PASSWORD: ${{ secrets.REGISTRY_BUILD_PASSWORD }}
  pipeline-contracts:
    needs: axiz-workflows-trust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        repository: edgarrth/java-framework-custom
        ref: axiz-workflows-v2.0.0
        token: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
        path: axiz-tools/target/workflow-contracts
        persist-credentials: false
    - name: Verify consumer inputs, secret contracts and build/deploy separation
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/axiz-pipeline-contracts"
        python="$RUNNER_TEMP/axiz-pipeline-contracts/bin/python"
        "$python" -m pip install --require-hashes --quiet -r target/workflow-contracts/.github/actions/check-workflow-security/requirements.txt
        checks=target/workflow-contracts/.github/actions/check-workflow-security
        workflows=target/workflow-contracts/.github/workflows
        "$python" "$checks/check_workflow_security.py" .. --scope executable
        "$python" "$checks/check_pipeline_contracts.py" --consumer ../.github/workflows/tools-ci.yaml --phase build --workflows "$workflows"
        for deploy in ../.github/workflows/tools-deploy.yaml ../.github/workflows/tools-deploy-initializr.yaml; do
          "$python" "$checks/check_pipeline_contracts.py" --consumer "$deploy" --phase deploy --workflows "$workflows"
        done
      working-directory: axiz-tools
  tools-pr-check:
    name: axiz-tools-pr
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [axiz-workflows-trust, parameters, pr, cli-native, build, initializr, pipeline-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every pull request job
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPABLE: '["cli-native"]'
        run: |
          jq -e --argjson skippable "$SKIPPABLE" 'length > 0 and all(to_entries[];
            .value.result == "success"
            or (.value.result == "skipped" and (.key | IN($skippable[]))))' <<< "$NEEDS" >/dev/null
