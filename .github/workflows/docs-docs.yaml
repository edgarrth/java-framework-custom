name: docs-docs
'on':
  pull_request: null
  push:
    branches:
    - main
    tags:
    - axiz-docs-v*
  workflow_dispatch: null
permissions: {}
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Reference pages and dashboards are up to date
      run: "python -m pip install --quiet -r requirements.txt\npython scripts/sync_reference.py --framework ../axiz-framework\
        \ --cli-help scripts/cli-help.txt\npython scripts/dashboards.py\nif [[ \"$GITHUB_REF\" != refs/tags/axiz-docs-v* ]]\
        \ && ! git diff --quiet -- docs dashboards; then\n  echo \"::error::generated pages differ from axiz-framework main:\
        \ run scripts/sync_reference.py\"\n  git diff --stat -- docs dashboards\n  exit 1\nfi\n"
      working-directory: axiz-docs
    - name: markdownlint
      run: npx --yes markdownlint-cli2@0.18.1 "docs/**/*.md" "README.md"
      working-directory: axiz-docs
    - name: Dashboards are valid JSON
      run: for f in dashboards/*.json; do python -m json.tool "$f" > /dev/null; done
      working-directory: axiz-docs
    - name: Build (strict, broken links and anchors fail)
      run: mkdocs build --strict
      working-directory: axiz-docs
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: site
        path: axiz-docs/site
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/axiz-docs-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Publish this version (mike)
      env:
        TAG: ${{ github.ref_name }}
      run: 'python -m pip install --quiet -r requirements.txt

        python scripts/sync_reference.py --framework ../axiz-framework --cli-help scripts/cli-help.txt

        python scripts/dashboards.py

        git config user.name "axiz-docs[bot]"

        git config user.email "axiz-docs@users.noreply.github.com"

        version="${TAG#axiz-docs-v}"

        mike deploy --push --update-aliases "${version%.*}" latest

        mike set-default --push latest

        '
      working-directory: axiz-docs
