# Generated by .github/scripts/render_docs_controls.py; review its source and the closed privileged roles.
name: docs-docs
'on':
  pull_request: null
  push:
    branches:
    - main
    tags:
    - axiz-docs-v*
  workflow_dispatch: null
permissions: {}
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/axiz-docs-v') && 'docs-publication' || format('docs-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - &id001
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
        fetch-depth: 0
        fetch-tags: true
    - &id002
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - &id003
      name: Install verified documentation wheels
      run: |
        python3 -m venv "$RUNNER_TEMP/docs-python"
        "$RUNNER_TEMP/docs-python/bin/pip" install --require-hashes --only-binary=:all: -r axiz-docs/requirements.txt
        echo "$RUNNER_TEMP/docs-python/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version-file: .github/scripts/release-version/.node-version
    - name: Install locked Markdown validator without scripts
      run: npm ci --prefix .github/scripts/docs-tools --include=dev --ignore-scripts --no-audit --no-fund
    - name: Markdown validator rejects invalid input
      run: node --test .github/scripts/docs-tools/test-lint.mjs
    - name: Reference pages and dashboards are current
      working-directory: axiz-docs
      run: |
        python scripts/sync_reference.py --framework ../axiz-framework --cli-help scripts/cli-help.txt
        python scripts/dashboards.py
        if [[ "$GITHUB_REF" != refs/tags/axiz-docs-v* ]]; then git diff --exit-code -- docs dashboards; fi
    - name: Markdown lint
      working-directory: axiz-docs
      run: node ../.github/scripts/docs-tools/lint.mjs .
    - name: Dashboards are valid JSON
      working-directory: axiz-docs
      run: for f in dashboards/*.json; do python -m json.tool "$f" > /dev/null; done
    - name: Strict documentation build
      working-directory: axiz-docs
      run: mkdocs build --strict
  prepare:
    needs: build
    if: startsWith(github.ref, 'refs/tags/axiz-docs-v')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      manifest_sha256: ${{ steps.attest.outputs.manifest_sha256 }}
      commit: ${{ steps.attest.outputs.commit }}
      tree: ${{ steps.attest.outputs.tree }}
      pages_name: ${{ steps.attest.outputs.pages_name }}
      pages_id: ${{ steps.attest.outputs.pages_id }}
      pages_sha256: ${{ steps.attest.outputs.pages_sha256 }}
      state_id: ${{ steps.state.outputs.artifact-id }}
    steps:
    - *id001
    - *id002
    - *id003
    - name: Generate site in an isolated Git copy without pushing
      id: prepare
      run: python .github/scripts/docs_prepare.py prepare --output "$RUNNER_TEMP/docs-publication"
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      id: pages
      with:
        name: ${{ steps.prepare.outputs.pages_name }}
        path: ${{ runner.temp }}/docs-publication/site
        retention-days: 30
        include-hidden-files: true
    - name: Attest the actual official Pages tar
      id: attest
      env:
        PAGES_ID: ${{ steps.pages.outputs.artifact_id }}
      run: python .github/scripts/docs_prepare.py attest --output "$RUNNER_TEMP/docs-publication" --tar "$RUNNER_TEMP/artifact.tar" --artifact-id "$PAGES_ID"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: state
      with:
        name: docs-publication-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/docs-publication/state
        retention-days: 30
        if-no-files-found: error
  publish:
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/axiz-docs-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: docs-publication
    permissions:
      contents: write
      actions: read
    steps:
    - &id004
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
