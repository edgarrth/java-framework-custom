# Workflow reutilizable de versionado con release-please: mantiene el pull request de release y, al
# fusionarlo, crea el tag y la release. Usa un token de GitHub App para que el tag dispare los
# workflows de publicación (los tags creados con GITHUB_TOKEN no los disparan).
name: release

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
    outputs:
      released:
        description: Si esta ejecución creó una release
        value: ${{ jobs.release.outputs.released }}
      paths-released:
        description: Lista JSON de los componentes publicados
        value: ${{ jobs.release.outputs.paths-released }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      released: ${{ steps.please.outputs.releases_created }}
      paths-released: ${{ steps.please.outputs.paths_released }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: please
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
