# Central monorepo release orchestration. Each component has an independent version and
# <component>-v<x.y.z> tag. GitHub App tokens allow the resulting tags to trigger publication.
# Root release-please-config.json and .release-please-manifest.json are the only release state.
name: release
on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
      runner:
        type: string
        default: ubuntu-24.04
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
    outputs:
      released:
        description: Whether a release was created by this run
        value: ${{ jobs.release.outputs.released }}
      paths-released:
        description: JSON list of released components
        value: ${{ jobs.release.outputs.paths-released }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ${{ inputs.runner }}
    outputs:
      released: ${{ steps.please.outputs.releases_created }}
      paths-released: ${{ steps.please.outputs.paths_released }}
    steps:
      - name: Token (GitHub App, short-lived)
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Release pull request or release
        id: please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
      - name: Summary
        if: steps.please.outputs.releases_created == 'true'
        env:
          COMPONENTS: ${{ steps.please.outputs.paths_released }}
        run: echo "Released components are recorded in the Release Please outputs" >> "$GITHUB_STEP_SUMMARY"
