# Orquestación central de releases del monorepo. Cada componente tiene una versión y un tag
# <component>-v<x.y.z> independientes. Los tokens de la GitHub App permiten que los tags resultantes disparen la publicación.
# release-please-config.json y .release-please-manifest.json en la raíz son el único estado de release.
name: release
on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
    outputs:
      released:
        description: Whether a release was created by this run
        value: ${{ jobs.release.outputs.released }}
      paths-released:
        description: JSON list of released components
        value: ${{ jobs.release.outputs.paths-released }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.please.outputs.releases_created }}
      paths-released: ${{ steps.please.outputs.paths_released }}
    steps:
      - name: Token (GitHub App, short-lived)
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Release pull request or release
        id: please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
      - name: Summary
        if: steps.please.outputs.releases_created == 'true'
        env:
          COMPONENTS: ${{ steps.please.outputs.paths_released }}
        run: echo "Released components are recorded in the Release Please outputs" >> "$GITHUB_STEP_SUMMARY"
