name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: axiz-workflows-v2.0.0
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/edgarrth/java-framework-custom/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null


  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Gitleaks 8.30.1 on the complete checkout
        run: |
          set -euo pipefail
          mkdir -p security-reports
          docker run --rm --network none -v "$PWD:/scan:ro" -v "$PWD/security-reports:/reports" \
            -w /scan ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir . --config /scan/.gitleaks.toml \
            --redact --report-format sarif --report-path /reports/gitleaks.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/*.sarif
          if-no-files-found: error
          retention-days: 90
  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Semgrep 1.180.0 including production and tests
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --require-hashes --only-binary=:all: -r .github/requirements/semgrep.txt
          mkdir -p security-reports
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --jobs 4 --timeout 30 --error --metrics=off \
            --disable-version-check --config p/java --config p/python --config p/github-actions \
            --config p/owasp-top-ten --config p/secrets \
            --config axiz-framework/quality/axiz-code-standards/src/main/resources/axiz/semgrep/axiz-rules.yaml \
            --sarif --output security-reports/semgrep.sarif .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-sast-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/*.sarif
          if-no-files-found: error
          retention-days: 90
  filesystem:
    needs: axiz-workflows-trust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trivy 0.76.2 on the complete checkout
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          limit-severities-for-sarif: true
          output: trivy.sarif
          exit-code: '1'
      # Exact immutable internal release: evaluate code and schema cannot come from the PR.
      - name: Complete vulnerability evidence and protected risk deadlines
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: edgarrth/java-framework-custom/.github/actions/check-vulnerabilities@axiz-workflows-v2.0.0
        with:
          mode: source
          scope: repository
          output: security-reports/vulnerability-policy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-filesystem-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trivy.sarif
            security-reports/vulnerability-policy/**
          if-no-files-found: error
          retention-days: 90
  infrastructure-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {name: postgres, image: 'axiz-local/postgres:17.12-r1', recipe: postgres}
          - {name: valkey, image: 'axiz-local/valkey:8.1.8-r1', recipe: valkey}
          - {name: kafka, image: 'axiz-local/kafka:4.2.2-r1', recipe: kafka}
          - {name: localstack, image: 'localstack/localstack:4.9', recipe: ''}
          - {name: keycloak, image: 'axiz-local/keycloak:26.8.2-r1', recipe: keycloak}
          - {name: wiremock, image: 'axiz-local/wiremock:3.13.2-r1', recipe: wiremock}
          - {name: otel-lgtm, image: 'grafana/otel-lgtm:0.11.10', recipe: ''}
          - {name: ryuk, image: 'testcontainers/ryuk:0.14.0', recipe: ''}
          - {name: java-runtime, image: 'eclipse-temurin:25-jre-noble', recipe: ''}
          - {name: initializr-runtime, image: 'eclipse-temurin:25-jdk-noble', recipe: ''}
          - {name: native-runtime, image: 'gcr.io/distroless/base-debian12:nonroot', recipe: ''}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify the canonical container recipes
        run: python3 .github/scripts/sync_container_recipes.py --check
      - name: Build the patched infrastructure image
        if: matrix.recipe != ''
        env:
          RECIPE: ${{ matrix.recipe }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          case "$RECIPE" in postgres|valkey|kafka|wiremock|keycloak) ;; *) exit 1 ;; esac
          docker build --pull --tag "$IMAGE" "axiz-demo/local/images/$RECIPE"
      - name: Scan the actual infrastructure image, including OS and embedded libraries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          format: json
          output: infrastructure.json
          exit-code: '1'
          ignore-unfixed: 'false'
      - name: Reject incomplete or empty image inventories
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          RECIPE: ${{ matrix.recipe }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$RECIPE" == wiremock ]]; then
            options+=(--maven-lock axiz-framework/quality/axiz-test-containers/src/main/resources/pe/axiz/quality/containers/images/wiremock/libraries.lock.json)
          fi
          python3 .github/scripts/check_image_scan.py infrastructure.json "$IMAGE" "${options[@]}"
      - name: Convert the original scan to SARIF
        if: always()
        run: trivy convert --format sarif --output infrastructure.sarif infrastructure.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-infrastructure-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infrastructure.json
            infrastructure.sarif
          if-no-files-found: error
          retention-days: 90
  publish-sarif:
    needs: [secrets, sast, filesystem, infrastructure-images]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: security-sarif
          category: monorepo-security
  security-pr-check:
    name: axiz-security-pr
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [axiz-workflows-trust, secrets, sast, filesystem, infrastructure-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every pull request job
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPABLE: '[]'
        run: |
          jq -e --argjson skippable "$SKIPPABLE" 'length > 0 and all(to_entries[];
            .value.result == "success"
            or (.value.result == "skipped" and (.key | IN($skippable[]))))' <<< "$NEEDS" >/dev/null
