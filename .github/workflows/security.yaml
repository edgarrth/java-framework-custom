# Seguridad del repositorio con herramientas nativas: CodeQL para el análisis estático, revisión de
# dependencias en cada pull request, Trivy sobre las fuentes (vulnerabilidades, configuración y
# secretos) y sobre las imágenes de infraestructura local, y las reglas Semgrep propias de Axiz. Los
# secretos los cubre además el secret scanning de GitHub con push protection.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript, actions]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql-${{ matrix.language }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Vulnerabilidades, configuración y secretos de las fuentes
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Las dependencias Java se escanean ya resueltas en el SBOM de cada build; aquí no se
          # consulta Maven Central para los POM internos.
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-sources.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('trivy-sources.sarif') != ''
        with:
          sarif_file: trivy-sources.sarif
          category: trivy-sources
      - name: Reglas Semgrep de Axiz
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 \
            semgrep scan --metrics=off --error \
              --config axiz-framework/quality/axiz-code-standards/src/main/resources/axiz/semgrep/axiz-rules.yaml .

  infrastructure-images:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {name: postgres, recipe: postgres, image: 'axiz-local/postgres:17.12-r2'}
          - {name: valkey, recipe: valkey, image: 'axiz-local/valkey:8.1.8-r1'}
          - {name: kafka, recipe: kafka, image: 'axiz-local/kafka:4.2.2-r1'}
          - {name: localstack, recipe: localstack, image: 'axiz-local/localstack:4.14.0-r1'}
          - {name: keycloak, recipe: keycloak, image: 'axiz-local/keycloak:26.8.2-r1'}
          - {name: wiremock, recipe: wiremock, image: 'axiz-local/wiremock:3.13.2-r1'}
          - {name: otel-lgtm, recipe: otel-lgtm, image: 'axiz-local/otel-lgtm:2026.11-r1'}
          - {name: ryuk, recipe: ryuk, image: 'axiz-local/ryuk:0.14.0-r1'}
          - {name: java-runtime, recipe: '', image: 'azul/zulu-openjdk-alpine:25-jre@sha256:8eaca94dd76729a65ce7d693d8aa84c12f9ae656624ae3b118d6a8d411764cd8'}
          - {name: initializr-runtime, recipe: '', image: 'azul/zulu-openjdk-alpine:25@sha256:fe4cdf0a179283ac4b6a6c262cce2282e39208c3cf869cb2f627288bac4127e0'}
          - {name: native-runtime, recipe: '', image: 'cgr.dev/chainguard/wolfi-base@sha256:7135c6a5e9f29b2542aaefee63d474973312bfdea95555963aef0e648210e4d2'}
    name: image (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Imagen local construida desde su receta
        if: matrix.recipe != ''
        env:
          RECIPE: ${{ matrix.recipe }}
          IMAGE: ${{ matrix.image }}
        run: docker build --pull --tag "$IMAGE" "axiz-demo/local/images/$RECIPE"
      - name: Sin vulnerabilidades MEDIUM, HIGH ni CRITICAL en el sistema ni en las librerías
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ matrix.image }}
          trivy-config: trivy.yaml
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.name }}

  axiz-security-pr:
    if: always()
    needs: [codeql, dependency-review, sources, infrastructure-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Todos los controles de seguridad terminaron bien
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
