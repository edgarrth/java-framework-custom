# Workflow reutilizable para servicios. verify compila con el perfil quality, ejecuta las pruebas,
# revisa la compatibilidad del contrato OpenAPI en los pull requests, valida el chart y escanea las
# dependencias. publish construye la imagen con Jib directamente en GHCR, la escanea por digest,
# publica el chart como artefacto OCI y atestigua procedencia y SBOM con las atestaciones nativas
# de GitHub; el despliegue verifica esas atestaciones antes de promover el digest.
name: service-build

on:
  workflow_call:
    inputs:
      service:
        description: Nombre del servicio, de su imagen y de su chart
        type: string
        required: true
      working-directory:
        description: Raíz del proyecto Maven dentro del repositorio
        type: string
        default: '.'
      module:
        description: Módulo Maven del servicio, relativo a working-directory ('.' si es el proyecto completo)
        type: string
        default: '.'
      chart:
        description: Directorio del chart, relativo a working-directory (por defecto deploy/helm/<servicio> del módulo)
        type: string
        default: ''
      java-version:
        type: string
        default: '25'
      native:
        description: Compila y empaqueta la imagen nativa (GraalVM)
        type: boolean
        default: false
      platforms:
        description: Plataformas de la imagen, separadas por coma
        type: string
        default: linux/amd64
      base-image:
        description: Imagen base fijada por digest; vacía usa la configurada en el POM
        type: string
        default: ''
      maven-artifact:
        description: Artefacto del mismo run con un fragmento del repositorio Maven local, por ejemplo el framework del mismo commit
        type: string
        default: ''
      setup-command:
        description: Comando previo, por ejemplo instalar el framework del mismo commit
        type: string
        default: ''
      publish:
        description: Publica imagen y chart en GHCR con atestaciones
        type: boolean
        default: false
    outputs:
      image:
        description: Repositorio de la imagen publicada
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Digest de la imagen publicada
        value: ${{ jobs.publish.outputs.digest }}
      chart:
        description: Repositorio OCI del chart publicado
        value: ${{ jobs.publish.outputs.chart }}
      version:
        description: Versión de la imagen y del chart
        value: ${{ jobs.publish.outputs.version }}

permissions: {}

# Maven Central responde 429 cuando muchos jobs descargan a la vez: el resolver reintenta con espera
# exponencial (respeta Retry-After). setup-java conserva este valor y le agrega -ntp.
env:
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=8
    -Daether.connector.http.retryHandler.interval=10000
    -Daether.connector.http.retryHandler.intervalMax=120000

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MODULE: ${{ inputs.module }}
      SERVICE: ${{ inputs.service }}
      CHART: ${{ inputs.chart }}
      SETUP_COMMAND: ${{ inputs.setup-command }}
      PROFILES: ${{ inputs.native && 'quality,native' || 'quality' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # setup-java escribe el settings.xml de GitHub Packages; GraalVM se instala encima cuando
      # se compila la variante nativa.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        if: inputs.native
        with:
          java-version: ${{ inputs.java-version }}
          distribution: graalvm-community
          cache: maven
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - name: Artefactos Maven del mismo run
        if: inputs.maven-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.maven-artifact }}
          path: ${{ runner.temp }}/maven-artifact
      - name: Fragmento copiado al repositorio Maven local
        if: inputs.maven-artifact != ''
        working-directory: .
        run: mkdir -p ~/.m2/repository && cp -r "$RUNNER_TEMP/maven-artifact/." ~/.m2/repository/
      - name: Preparación
        if: inputs.setup-command != ''
        working-directory: .
        run: bash -euo pipefail -c "$SETUP_COMMAND"
      - name: Compilación, pruebas y controles de calidad
        run: |
          if [[ "$MODULE" == . ]]; then
            ./mvnw -B -ntp "-P$PROFILES" verify
          else
            ./mvnw -B -ntp "-P$PROFILES" -pl "$MODULE" -am verify
          fi
      - name: Ubicación del contrato y del chart
        id: paths
        run: |
          chart=${CHART:-$MODULE/deploy/helm/$SERVICE}
          contract="$MODULE/src/main/openapi/openapi.yaml"
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "contract=$(realpath --relative-to="$GITHUB_WORKSPACE" "$contract")" >> "$GITHUB_OUTPUT"
          # Cambios incompatibles aceptados de forma explícita, versionados junto al contrato.
          accepted="$MODULE/src/main/openapi/breaking-changes.txt"
          if [[ -f "$accepted" ]]; then
            echo "accepted=$(realpath --relative-to="$GITHUB_WORKSPACE" "$accepted")" >> "$GITHUB_OUTPUT"
          fi
      - name: Cambios incompatibles en el contrato OpenAPI
        if: github.event_name == 'pull_request' && hashFiles(steps.paths.outputs.contract) != ''
        uses: oasdiff/oasdiff-action/breaking@8a211b41745fcecdfa4a86531ffbf08934fb14f6 # v0.1.23
        with:
          base: origin/${{ github.base_ref }}:${{ steps.paths.outputs.contract }}
          revision: HEAD:${{ steps.paths.outputs.contract }}
          fail-on: ERR
          err-ignore: ${{ steps.paths.outputs.accepted }}
          # Sin subir los contratos a oasdiff.com: el reporte queda en el log del job.
          review: 'false'
      - name: Chart válido para cada ambiente
        env:
          CHART_DIR: ${{ steps.paths.outputs.chart }}
        run: |
          for values in "$CHART_DIR"/values*.yaml; do
            echo "::group::$values"
            helm lint --strict "$CHART_DIR" -f "$values"
            helm template "$SERVICE" "$CHART_DIR" -f "$values" \
              | docker run --rm -i ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
                  -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 -
            echo "::endgroup::"
          done
      - name: SBOM del grafo de dependencias resuelto
        run: |
          # El wrapper de Axiz fija -f en la raíz del proyecto; el módulo se selecciona con -pl.
          select=()
          [[ "$MODULE" == . ]] || select=(-pl "$MODULE")
          goal=makeAggregateBom
          [[ "$MODULE" == . ]] || goal=makeBom
          ./mvnw -B -ntp "${select[@]}" -DskipTests "org.cyclonedx:cyclonedx-maven-plugin:2.9.2:$goal" \
            -DoutputFormat=json -DincludeTestScope=true
          cp "$MODULE/target/bom.json" "$RUNNER_TEMP/bom.json"
      - name: Vulnerabilidades MEDIUM, HIGH y CRITICAL bloquean
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: sbom
          scan-ref: ${{ runner.temp }}/bom.json
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'

  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MODULE: ${{ inputs.module }}
      SERVICE: ${{ inputs.service }}
      CHART: ${{ inputs.chart }}
      PLATFORMS: ${{ inputs.platforms }}
      BASE_IMAGE: ${{ inputs.base-image }}
      SETUP_COMMAND: ${{ inputs.setup-command }}
      PROFILES: ${{ inputs.native && 'native' || 'default' }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
      chart: ${{ steps.chart.outputs.chart }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # setup-java escribe el settings.xml de GitHub Packages; GraalVM se instala encima cuando
      # se compila la variante nativa.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        if: inputs.native
        with:
          java-version: ${{ inputs.java-version }}
          distribution: graalvm-community
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Artefactos Maven del mismo run
        if: inputs.maven-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.maven-artifact }}
          path: ${{ runner.temp }}/maven-artifact
      - name: Fragmento copiado al repositorio Maven local
        if: inputs.maven-artifact != ''
        working-directory: .
        run: mkdir -p ~/.m2/repository && cp -r "$RUNNER_TEMP/maven-artifact/." ~/.m2/repository/
      - name: Preparación
        if: inputs.setup-command != ''
        working-directory: .
        run: bash -euo pipefail -c "$SETUP_COMMAND"
      - name: Imagen construida con Jib directamente en GHCR
        id: image
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image="ghcr.io/$owner/$SERVICE"
          # El wrapper de Axiz fija -f en la raíz del proyecto; el módulo se selecciona con -pl.
          select=()
          [[ "$MODULE" == . ]] || select=(-pl "$MODULE")
          version=$(./mvnw -q "${select[@]}" help:evaluate -Dexpression=project.version -DforceStdout)
          version=${version%-SNAPSHOT}
          base=()
          [[ -z "$BASE_IMAGE" ]] || base=("-Djib.from.image=$BASE_IMAGE")
          build=(-pl "$MODULE" -am)
          [[ "$MODULE" == . ]] && build=()
          ./mvnw -B -ntp "-P$PROFILES" "${build[@]}" -DskipTests package
          ./mvnw -B -ntp "${select[@]}" "-P$PROFILES" jib:build "${base[@]}" \
            "-Djib.to.image=$image:$GITHUB_SHA" "-Djib.to.tags=$version" \
            "-Djib.from.platforms=$PLATFORMS" \
            "-Djib.container.labels=org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY,org.opencontainers.image.revision=$GITHUB_SHA"
          digest=$(cat "$MODULE/target/jib-image.digest")
          {
            echo "image=$image"
            echo "digest=$digest"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: La imagen publicada no tiene vulnerabilidades MEDIUM, HIGH ni CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
      - name: SBOM de la imagen
        run: |
          # El wrapper de Axiz fija -f en la raíz del proyecto; el módulo se selecciona con -pl.
          select=()
          [[ "$MODULE" == . ]] || select=(-pl "$MODULE")
          goal=makeAggregateBom
          [[ "$MODULE" == . ]] || goal=makeBom
          ./mvnw -B -ntp "${select[@]}" -DskipTests "org.cyclonedx:cyclonedx-maven-plugin:2.9.2:$goal" -DoutputFormat=json
          cp "$MODULE/target/bom.json" "$RUNNER_TEMP/bom.json"
      - name: Procedencia de la imagen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: SBOM atestiguado de la imagen
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/bom.json
          push-to-registry: true
      - name: Chart publicado como artefacto OCI
        id: chart
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          owner=${GITHUB_REPOSITORY_OWNER,,}
          chart=${CHART:-$MODULE/deploy/helm/$SERVICE}
          helm package "$chart" --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/$SERVICE-$VERSION.tgz" "oci://ghcr.io/$owner/charts"
          echo "chart=oci://ghcr.io/$owner/charts/$SERVICE" >> "$GITHUB_OUTPUT"
