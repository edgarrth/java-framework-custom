# Componentes nativos solo de build; lib-build verifica y vincula todas las plataformas a un único manifiesto.
name: native
on:
  workflow_call:
    inputs:
      project-directory:
        description: Canonical relative Maven reactor path in the checkout
        type: string
        default: '.'
      version:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      module:
        description: Native Maven module relative to the reactor
        type: string
        required: true
      binary:
        description: Native executable name
        type: string
        required: true
      candidate:
        type: string
        default: ''
      maven-args:
        type: string
        default: '[]'
      axiz-version:
        type: string
        default: ''
      candidate-repository:
        type: string
        default: ''
      candidate-build-run-id:
        type: string
        default: ''
      candidate-build-run-attempt:
        type: string
        default: ''
      candidate-manifest-sha256:
        type: string
        default: ''
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN:
        required: false
      PACKAGES_READ_USERNAME:
        required: false
      PACKAGES_READ_TOKEN:
        required: false
      CANDIDATE_READ_TOKEN:
        required: false
permissions: {}
jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: axiz-workflows-v2.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/edgarrth/java-framework-custom/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  build:
    name: native:${{ matrix.suffix }}
    permissions:
      packages: read
      contents: read
      actions: read
    needs: axiz-workflows-trust
    defaults:
      run:
        working-directory: ${{ inputs.project-directory }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: linux-x64
          - os: macos-15
            suffix: macos-arm64
          - os: windows-2025
            suffix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      # Release interna inmutable: axiz-workflows-trust debe completarse con éxito antes.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: edgarrth/java-framework-custom/.github/actions/consume-build@axiz-workflows-v2.0.0 # x-release-please-version
        id: candidate
        if: inputs.candidate-manifest-sha256 != '' || inputs.candidate-repository != '' || inputs.candidate-build-run-id != '' || inputs.candidate-build-run-attempt
          != ''
        with:
          repository: ${{ inputs.candidate-repository }}
          build-run-id: ${{ inputs.candidate-build-run-id }}
          build-run-attempt: ${{ inputs.candidate-build-run-attempt }}
          manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
          kind: maven-library
          token: ${{ secrets.CANDIDATE_READ_TOKEN || github.token }}
      # Release interna inmutable: axiz-workflows-trust debe completarse con éxito antes.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: edgarrth/java-framework-custom/.github/actions/build-inputs@axiz-workflows-v2.0.0 # x-release-please-version
        id: inputs
        with:
          project-directory: ${{ inputs.project-directory }}
          version: ${{ inputs.version }}
          source-sha: ${{ inputs.source-sha }}
          candidate: ${{ inputs.candidate }}
          maven-args: ${{ inputs.maven-args }}
          axiz-version: ${{ inputs.axiz-version }}
          token: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          candidate-bundle: ${{ steps.candidate.outputs.bundle-path }}
          candidate-manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
          kind: native-component
          native-module: ${{ inputs.module }}
          native-binary: ${{ inputs.binary }}
          native-platforms: '["linux-x64","macos-arm64","windows-x64"]'
      # Release interna inmutable: axiz-workflows-trust debe completarse con éxito antes.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: edgarrth/java-framework-custom/.github/actions/setup-maven@axiz-workflows-v2.0.0 # x-release-please-version
        with:
          packages-url: ${{ vars.AXIZ_PACKAGES_URL || 'https://maven.pkg.github.com/edgarrth/java-framework-custom' }}
          candidate-bundle: ${{ steps.candidate.outputs.bundle-path }}
          candidate-manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
          candidate-source-repository: ${{ inputs.candidate-repository }}
          distribution: graalvm
      - name: Compile and smoke the native executable
        shell: bash
        env:
          PACKAGES_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME || github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
          VERSION: ${{ inputs.version }}
          NATIVE_MODULE: ${{ inputs.module }}
          NATIVE_BINARY: ${{ inputs.binary }}
          NATIVE_PLATFORM: ${{ matrix.suffix }}
          PYTHON: ${{ steps.inputs.outputs.python }}
          TOOLS: ${{ steps.inputs.outputs.tools }}
          METADATA: ${{ steps.inputs.outputs.metadata }}
        run: |
          set -euo pipefail
          "$PYTHON" "$TOOLS/maven_version.py" --version "$VERSION"
          "$PYTHON" "$TOOLS/native_components.py" compile --metadata "$METADATA"
          "$PYTHON" "$TOOLS/native_components.py" create --metadata "$METADATA" \
            --module "$NATIVE_MODULE" --binary "$NATIVE_BINARY" --platform "$NATIVE_PLATFORM" \
            --output target/native-component
      - name: Retain unsigned native component
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-native-${{ github.run_attempt }}-${{ matrix.suffix }}
          path: ${{ inputs.project-directory }}/target/native-component
          retention-days: 90
          if-no-files-found: error

  sign:
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.event_name != 'pull_request') }}
    needs: [axiz-workflows-trust, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: edgarrth/java-framework-custom
          ref: axiz-workflows-v2.0.0 # x-release-please-version
          path: .axiz-trusted-workflows
          persist-credentials: false
          token: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Verify producer authority and sign exact product data
        id: sign
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          BUILD_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/axiz-signer-python"
          python="$RUNNER_TEMP/axiz-signer-python/bin/python"
          tools="$GITHUB_WORKSPACE/.axiz-trusted-workflows/.github/actions/build-manifest"
          "$python" -m pip install --require-hashes --quiet -r "$tools/requirements.txt"
          "$python" "$tools/sign_product.py" --kind native-component --output "$RUNNER_TEMP/signed-product"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-component-${{ github.run_attempt }}-linux-x64
          path: ${{ runner.temp }}/signed-product/native-component-${{ github.run_attempt }}-linux-x64
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-component-${{ github.run_attempt }}-macos-arm64
          path: ${{ runner.temp }}/signed-product/native-component-${{ github.run_attempt }}-macos-arm64
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-component-${{ github.run_attempt }}-windows-x64
          path: ${{ runner.temp }}/signed-product/native-component-${{ github.run_attempt }}-windows-x64
          retention-days: 90
          if-no-files-found: error
