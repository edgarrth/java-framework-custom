name: framework-native-nightly
'on':
  schedule:
  - cron: 17 6 * * *
  workflow_dispatch: null
permissions: {}
jobs:
  reactive:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/framework-native-reactive.yaml
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_READ_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_READ_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
    - name: Verify immutable Axiz workflow release
      env:
        GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
        GH_HOST: github.com
        AXIZ_WORKFLOWS_VERSION: axiz-workflows-v2.0.0 # x-release-please-version
      shell: bash
      run: |
        set -euo pipefail
        release=$(gh api "repos/edgarrth/java-framework-custom/releases/tags/$AXIZ_WORKFLOWS_VERSION")
        jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null
  native:
    permissions:
      contents: read
      actions: read
    needs: axiz-workflows-trust
    uses: edgarrth/java-framework-custom/.github/workflows/native-nightly.yaml@axiz-workflows-v2.0.0 # x-release-please-version
    with:
      project-directory: axiz-framework
      generate-script: .github/scripts/samples.sh
      modules: |-
        ["target/samples/sample-orders", "target/samples/sample-core",
         "target/samples/sample-gateway", "target/samples/sample-ux",
         "target/samples/sample-support", "target/samples/sample-notifications-processor",
         "target/samples/sample-settlement-batch"]
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
