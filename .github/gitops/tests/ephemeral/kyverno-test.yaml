apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ephemeral-subresource-admission
policies:
- ../../policies/verify-ephemeral-images.yaml
resources:
- resources.yaml
variables: values.yaml
results:
- policy: axiz-verify-images-ephemeral
  rule: only-build-registry
  resources:
  - ephemeral-approved
  kind: Pod
  result: pass
- policy: axiz-verify-images-ephemeral
  rule: only-build-registry
  resources:
  - ephemeral-foreign
  kind: Pod
  result: fail
- policy: axiz-verify-images-ephemeral
  rule: only-build-registry
  resources:
  - ephemeral-no-digest
  kind: Pod
  result: fail
