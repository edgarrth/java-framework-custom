apiVersion: v1
kind: Pod
metadata:
  name: pod-approved
  namespace: axiz-dev
spec:
  containers:
  - name: app
    image: registry.ci.test:5443/payments/builds/edgarrth/java-framework-custom/payment-orders@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
---
