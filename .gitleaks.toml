# Configuración de gitleaks compartida por todos los repositorios de axiz
title = "axiz gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "axiz-package-credential"
description = "Package registry credential"
regex = '''(?i)(?:packages|github|ghcr|nexus)[_-]?(?:read[_-]?|publish[_-]?)?(token|password)\s*[:=]\s*['"][A-Za-z0-9+/=_-]{12,}['"]'''
tags = ["registry", "credential"]

[[rules]]
id = "axiz-jdbc-password"
description = "Password embedded in a JDBC URL"
regex = '''jdbc:[a-z0-9]+://[^\s'"]*password=[^\s&'"]{4,}'''
tags = ["database", "credential"]

# Solo un falso positivo revisado de esta regla, en estas rutas exactas y en una línea con únicamente un digest.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Canonical SHA-256 metadata; never allow an entire evidence file"
condition = "AND"
paths = [
  '^(?:axiz-framework/)?docs/api/public-api\.json$',
]
regexTarget = "line"
regexes = [
  '^\s*"(?:sha256|[A-Za-z]*Sha256)"\s*:\s*"[0-9a-f]{64}"\s*,?\s*$',
]

[[rules.allowlists]]
description = "Public Go module checksums in the two reviewed dependency patches, not OAuth credentials"
condition = "AND"
paths = [
  '^(?:axiz-demo/local/images|axiz-framework/quality/axiz-test-containers/src/main/resources/pe/axiz/quality/containers/images|axiz-framework/codegen/axiz-codegen-templates/src/main/resources/axiz/templates/service/local/images)/otel-lgtm/(?:prometheus|tempo)-dependencies\.patch$',
]
regexTarget = "line"
regexes = [
  '^\s*[+\-]?golang\.org/x/oauth2 v0\.(?:36|37)\.0(?:/go\.mod)? h1:[A-Za-z0-9+/]{43}=\s*$',
]
