# Service template set: one entry per generated file.
#   template  file of this set (mustache unless binary)
#   path      output path (a mustache template itself)
#   when      condition over the context: dotted paths, &&, ||, ! (see ProjectGenerator#context)
#   each      list of the context; the entry is rendered once per element, bound as `item`
#   binary    copied as is (Helm templates, static files)
files:
  # --- build and governance ------------------------------------------------------------------
  - {template: /shared/mvnw, path: mvnw, binary: true}
  - {template: /shared/mvnw.cmd, path: mvnw.cmd, binary: true}
  - {template: /shared/mvn/wrapper/maven-wrapper.properties, path: .mvn/wrapper/maven-wrapper.properties, binary: true}
  - {template: /shared/mvn/jvm.config, path: .mvn/jvm.config, binary: true}
  - {template: /shared/mvn/maven.config, path: .mvn/maven.config, binary: true}
  - {template: pom.xml.mustache, path: pom.xml}
  - {template: README.md.mustache, path: README.md}
  - {template: project.yaml.mustache, path: .axiz/project.yaml}
  - {template: static/editorconfig, path: .editorconfig, binary: true}
  - {template: static/gitignore, path: .gitignore, binary: true}
  - {template: static/gitattributes, path: .gitattributes, binary: true}
  - {template: static/gitleaks.toml, path: .gitleaks.toml, binary: true}
  - {template: static/semgrepignore, path: .semgrepignore, binary: true}
  - {template: /service/static/pre-commit-config.yaml, path: .pre-commit-config.yaml, binary: true}
  - {template: static/renovate.json, path: renovate.json, binary: true}
  - {template: static/pull_request_template.md, path: .github/pull_request_template.md, binary: true}
  - {template: static/CODEOWNERS, path: .github/CODEOWNERS, binary: true}
  - {template: github/ci.yaml.mustache, path: .github/workflows/ci.yaml}
  - {template: github/deploy.yaml.mustache, path: .github/workflows/deploy.yaml}
  - {template: /shared/release/release.yaml, path: .github/workflows/release.yaml, binary: true}
  - {template: /shared/release/release-please-config.json.mustache, path: release-please-config.json}
  - {template: /shared/release/release-please-manifest.json, path: .release-please-manifest.json, binary: true}
  - {template: /shared/release/version.txt, path: version.txt, binary: true}

  # --- local environment ---------------------------------------------------------------------
  - {template: local/compose.yaml.mustache, path: compose.yaml}
  - {template: local/images/postgres/Dockerfile, path: local/images/postgres/Dockerfile, binary: true, when: infra.postgres}
  - {template: local/images/valkey/Dockerfile, path: local/images/valkey/Dockerfile, binary: true, when: infra.redis}
  - {template: local/images/wiremock/Dockerfile, path: local/images/wiremock/Dockerfile, binary: true, when: infra.wiremock}
  - {template: local/images/keycloak/Dockerfile, path: local/images/keycloak/Dockerfile, binary: true, when: infra.keycloak}
  - {template: local/images/kafka/Dockerfile, path: local/images/kafka/Dockerfile, binary: true, when: infra.kafka}
  - {template: local/dev-secrets.sh.mustache, path: local/dev-secrets.sh}
  - {template: local/localstack-init.sh.mustache, path: local/localstack/init.sh, when: infra.localstack}
  - {template: static/keycloak-realm.json, path: local/keycloak/axiz-realm.json, binary: true, when: infra.keycloak}
  - {template: local/wiremock-readme.md, path: local/wiremock/mappings/README.md, binary: true, when: infra.wiremock}

  # --- contracts -----------------------------------------------------------------------------
  - {template: contract/openapi.yaml.mustache, path: src/main/openapi/openapi.yaml, when: api.present}
  - {template: contract/openapi.yaml.mustache, path: .axiz/openapi.snapshot.yaml, when: api.present}
  - {template: contract/asyncapi.yaml.mustache, path: src/main/asyncapi/asyncapi.yaml, when: api.hasAsyncapi}
  - {template: contract/asyncapi.yaml.mustache, path: .axiz/asyncapi.snapshot.yaml, when: api.hasAsyncapi}

  # --- code ----------------------------------------------------------------------------------
  - {template: java/Application.java.mustache, path: "src/main/java/{{project.packagePath}}/{{project.className}}Application.java"}
  - {template: java/package-info-base.java.mustache, path: "src/main/java/{{project.packagePath}}/package-info.java"}
  - {template: java/package-info.java.mustache, path: "src/main/java/{{project.packagePath}}/{{item.path}}/package-info.java", each: fw.packages}
  - {template: java/rest/Controller.java.mustache, path: "src/main/java/{{project.packagePath}}/{{fw.restPath}}/{{item.className}}Controller.java", each: tags}
  # hexagonal
  - {template: java/hexagonal/UseCase.java.mustache, path: "src/main/java/{{project.packagePath}}/application/usecase/{{item.className}}UseCase.java", each: operations, when: fw.hexagonal}
  - {template: java/hexagonal/UseCaseConfiguration.java.mustache, path: "src/main/java/{{project.packagePath}}/config/UseCaseConfiguration.java", when: fw.hexagonal}
  # cqrs
  - {template: java/cqrs/Command.java.mustache, path: "src/main/java/{{project.packagePath}}/application/command/{{item.className}}Command.java", each: operations, when: fw.cqrs && item.write}
  - {template: java/cqrs/CommandHandler.java.mustache, path: "src/main/java/{{project.packagePath}}/application/command/{{item.className}}Handler.java", each: operations, when: fw.cqrs && item.write}
  - {template: java/cqrs/Query.java.mustache, path: "src/main/java/{{project.packagePath}}/application/query/{{item.className}}Query.java", each: operations, when: fw.cqrs && item.readOnly}
  - {template: java/cqrs/QueryHandler.java.mustache, path: "src/main/java/{{project.packagePath}}/application/query/{{item.className}}Handler.java", each: operations, when: fw.cqrs && item.readOnly}
  - {template: java/cqrs/AuthorizationConfiguration.java.mustache, path: "src/main/java/{{project.packagePath}}/config/CqrsAuthorizationConfiguration.java", when: fw.cqrs && caps.security}
  - {template: test/CqrsAuthorizationTest.java.mustache, path: "src/test/java/{{project.packagePath}}/config/CqrsAuthorizationTest.java", when: fw.cqrs && caps.security}
  # layered
  - {template: java/layered/Service.java.mustache, path: "src/main/java/{{project.packagePath}}/service/{{item.className}}Service.java", each: tags, when: fw.layered}
  # bff
  - {template: java/bff/Composition.java.mustache, path: "src/main/java/{{project.packagePath}}/composition/{{item.className}}Composition.java", each: tags, when: fw.bff}
  # eda
  - {template: java/eda/ExampleCreated.java.mustache, path: "src/main/java/{{project.packagePath}}/event/ExampleCreated.java", when: fw.exampleEvents}
  - {template: java/eda/ExampleCreatedHandler.java.mustache, path: "src/main/java/{{project.packagePath}}/handler/ExampleCreatedHandler.java", when: fw.exampleEvents}
  # batch
  - {template: java/batch/InputLine.java.mustache, path: "src/main/java/{{project.packagePath}}/job/InputLine.java", when: fw.batch}
  - {template: java/batch/InputLineProcessor.java.mustache, path: "src/main/java/{{project.packagePath}}/job/InputLineProcessor.java", when: fw.batch}
  - {template: java/batch/JobConfiguration.java.mustache, path: "src/main/java/{{project.packagePath}}/job/{{project.className}}JobConfiguration.java", when: fw.batch}

  # --- resources -----------------------------------------------------------------------------
  - {template: resources/application.yaml.mustache, path: src/main/resources/application.yaml}
  - {template: resources/application-local.yaml.mustache, path: src/main/resources/application-local.yaml}
  - {template: resources/messages.properties.mustache, path: src/main/resources/messages.properties, when: caps.i18n}
  - {template: resources/messages_en.properties.mustache, path: src/main/resources/messages_en.properties, when: caps.i18n}
  - {template: resources/V1__init.sql.mustache, path: src/main/resources/db/migration/V1__init.sql, when: persistence.aurora}

  # --- tests ---------------------------------------------------------------------------------
  - {template: test/ArchitectureTest.java.mustache, path: "src/test/java/{{project.packagePath}}/ArchitectureTest.java"}
  - {template: test/ArchitectureSelfCheckTest.java.mustache, path: "src/test/java/{{project.packagePath}}/ArchitectureSelfCheckTest.java"}
  - {template: test/ApplicationTest.java.mustache, path: "src/test/java/{{project.packagePath}}/{{project.className}}ApplicationTest.java"}
  - {template: test/ApplicationTestSupport.java.mustache, path: "src/test/java/{{project.packagePath}}/{{project.className}}ApplicationTestSupport.java"}
  - {template: test/ApplicationModelTest.java.mustache, path: "src/test/java/{{project.packagePath}}/{{item.name}}ApplicationModelTest.java", each: applicationModels, when: item.record}
  - {template: test/SensitiveDataCanaryTest.java.mustache, path: "src/test/java/{{project.packagePath}}/SensitiveDataCanaryTest.java"}
  - {template: test/AuditTestConfiguration.java.mustache, path: "src/test/java/{{project.packagePath}}/AuditTestConfiguration.java", when: auditResources.required}
  - {template: test/ContractExamplesTest.java.mustache, path: "src/test/java/{{project.packagePath}}/{{fw.restPath}}/ContractExamplesTest.java", when: hasExamples}
  - {template: test/example.json.mustache, path: "src/test/resources/contract-examples/{{item.operationId}}.json", each: examples}
  - {template: test/ExampleCreatedHandlerTest.java.mustache, path: "src/test/java/{{project.packagePath}}/handler/ExampleCreatedHandlerTest.java", when: fw.exampleEvents}
  - {template: test/InputLineProcessorTest.java.mustache, path: "src/test/java/{{project.packagePath}}/job/InputLineProcessorTest.java", when: fw.batch}

  # --- deployment (Helm) ---------------------------------------------------------------------
  - {template: helm/Chart.yaml.mustache, path: "deploy/helm/{{project.name}}/Chart.yaml"}
  - {template: helm/values.yaml.mustache, path: "deploy/helm/{{project.name}}/values.yaml"}
  - {template: helm/values-env.yaml.mustache, path: "deploy/helm/{{project.name}}/values-{{item.name}}.yaml", each: environments}
  - {template: static/helm/helmignore, path: "deploy/helm/{{project.name}}/.helmignore", binary: true}
  - {template: static/helm/_helpers.tpl, path: "deploy/helm/{{project.name}}/templates/_helpers.tpl", binary: true}
  - {template: static/helm/deployment.yaml, path: "deploy/helm/{{project.name}}/templates/deployment.yaml", binary: true, when: archetype.deployment}
  - {template: static/helm/service.yaml, path: "deploy/helm/{{project.name}}/templates/service.yaml", binary: true, when: archetype.deployment}
  - {template: static/helm/hpa.yaml, path: "deploy/helm/{{project.name}}/templates/hpa.yaml", binary: true, when: archetype.deployment}
  - {template: static/helm/pdb.yaml, path: "deploy/helm/{{project.name}}/templates/pdb.yaml", binary: true, when: archetype.deployment}
  - {template: static/helm/cronjob.yaml, path: "deploy/helm/{{project.name}}/templates/cronjob.yaml", binary: true, when: archetype.cronjob}
  - {template: static/helm/configmap.yaml, path: "deploy/helm/{{project.name}}/templates/configmap.yaml", binary: true}
  - {template: static/helm/configmap-errors.yaml, path: "deploy/helm/{{project.name}}/templates/configmap-errors.yaml", binary: true}
  - {template: static/helm/externalsecret.yaml, path: "deploy/helm/{{project.name}}/templates/externalsecret.yaml", binary: true}
  - {template: static/helm/serviceaccount.yaml, path: "deploy/helm/{{project.name}}/templates/serviceaccount.yaml", binary: true}
  - {template: static/helm/prometheusrule.yaml, path: "deploy/helm/{{project.name}}/templates/prometheusrule.yaml", binary: true}
  - {template: static/helm/networkpolicy.yaml, path: "deploy/helm/{{project.name}}/templates/networkpolicy.yaml", binary: true}

  - {template: java/hexagonal/Model.java.mustache, path: "src/main/java/{{project.packagePath}}/application/model/{{item.name}}.java", each: applicationModels, when: fw.hasApplicationModels}

  - {template: java/cqrs/HandlerConfiguration.java.mustache, path: "src/main/java/{{project.packagePath}}/config/HandlerConfiguration.java", when: fw.cqrs}

  - {template: test/ApplicationMappingTest.java.mustache, path: "src/test/java/{{project.packagePath}}/{{item.className}}ApplicationMappingTest.java", each: operations, when: fw.hasApplicationModels && item.exampleTestable}

  - {template: test/AuthorizationTest.java.mustache, path: "src/test/java/{{project.packagePath}}/{{fw.restPath}}/{{item.className}}AuthorizationTest.java", each: tags, when: caps.security && item.hasSecuredOperations}
  - {template: test/ControllerResponseTest.java.mustache, path: "src/test/java/{{project.packagePath}}/{{fw.restPath}}/{{item.className}}ControllerResponseTest.java", each: tags, when: caps.web}
  - {template: test/response-example.json.mustache, path: "src/test/resources/response-examples/{{item.operationId}}.json", each: operations, when: item.hasResponse}
  - {template: local/images/localstack/Dockerfile, path: local/images/localstack/Dockerfile, binary: true, when: infra.localstack}
  - {template: local/images/localstack/requirements.lock, path: local/images/localstack/requirements.lock, binary: true, when: infra.localstack}
  - {template: local/images/localstack/build-requirements.lock, path: local/images/localstack/build-requirements.lock, binary: true, when: infra.localstack}
  - {template: local/images/localstack/libraries.lock.json, path: local/images/localstack/libraries.lock.json, binary: true, when: infra.localstack}
  - {template: local/images/localstack/files.list, path: local/images/localstack/files.list, binary: true, when: infra.localstack}
  - {template: local/images/otel-lgtm/Dockerfile, path: local/images/otel-lgtm/Dockerfile, binary: true}
  - {template: local/images/otel-lgtm/collector-LICENSE, path: local/images/otel-lgtm/collector-LICENSE, binary: true}
  - {template: local/images/otel-lgtm/collector-components.go, path: local/images/otel-lgtm/collector-components.go, binary: true}
  - {template: local/images/otel-lgtm/collector-go.mod, path: local/images/otel-lgtm/collector-go.mod, binary: true}
  - {template: local/images/otel-lgtm/collector-go.sum, path: local/images/otel-lgtm/collector-go.sum, binary: true}
  - {template: local/images/otel-lgtm/collector-main.go, path: local/images/otel-lgtm/collector-main.go, binary: true}
  - {template: local/images/otel-lgtm/collector-main_others.go, path: local/images/otel-lgtm/collector-main_others.go, binary: true}
  - {template: local/images/otel-lgtm/collector-main_windows.go, path: local/images/otel-lgtm/collector-main_windows.go, binary: true}
  - {template: local/images/otel-lgtm/collector-manifest.yaml, path: local/images/otel-lgtm/collector-manifest.yaml, binary: true}
  - {template: local/images/otel-lgtm/collector.yaml, path: local/images/otel-lgtm/collector.yaml, binary: true}
  - {template: local/images/otel-lgtm/datasources.yaml, path: local/images/otel-lgtm/datasources.yaml, binary: true}
  - {template: local/images/otel-lgtm/grafana-dependencies.patch, path: local/images/otel-lgtm/grafana-dependencies.patch, binary: true}
  - {template: local/images/otel-lgtm/grafana.ini, path: local/images/otel-lgtm/grafana.ini, binary: true}
  - {template: local/images/otel-lgtm/loki-dependencies.patch, path: local/images/otel-lgtm/loki-dependencies.patch, binary: true}
  - {template: local/images/otel-lgtm/loki.yaml, path: local/images/otel-lgtm/loki.yaml, binary: true}
  - {template: local/images/otel-lgtm/prometheus-dependencies.patch, path: local/images/otel-lgtm/prometheus-dependencies.patch, binary: true}
  - {template: local/images/otel-lgtm/prometheus.yaml, path: local/images/otel-lgtm/prometheus.yaml, binary: true}
  - {template: local/images/otel-lgtm/sources.lock.json, path: local/images/otel-lgtm/sources.lock.json, binary: true}
  - {template: local/images/otel-lgtm/start.sh, path: local/images/otel-lgtm/start.sh, binary: true}
  - {template: local/images/otel-lgtm/tempo-dependencies.patch, path: local/images/otel-lgtm/tempo-dependencies.patch, binary: true}
  - {template: local/images/otel-lgtm/tempo.yaml, path: local/images/otel-lgtm/tempo.yaml, binary: true}
  - {template: local/images/otel-lgtm/files.list, path: local/images/otel-lgtm/files.list, binary: true}
