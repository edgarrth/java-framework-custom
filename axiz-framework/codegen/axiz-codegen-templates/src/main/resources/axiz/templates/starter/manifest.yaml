# Starter template set: a new capability as a layer 1 library, its Spring Boot auto-configuration
# and the starter that users add (the same layout as the axiz modules).
files:
  - {template: /shared/mvnw, path: mvnw, binary: true}
  - {template: /shared/mvnw.cmd, path: mvnw.cmd, binary: true}
  - {template: /shared/mvn/wrapper/maven-wrapper.properties, path: .mvn/wrapper/maven-wrapper.properties, binary: true}
  - {template: /shared/mvn/jvm.config, path: .mvn/jvm.config, binary: true}
  - {template: /shared/mvn/maven.config, path: .mvn/maven.config, binary: true}
  - {template: pom.xml.mustache, path: pom.xml}
  - {template: README.md.mustache, path: README.md}
  - {template: /library/project.yaml.mustache, path: .axiz/project.yaml}
  - {template: /service/static/editorconfig, path: .editorconfig, binary: true}
  - {template: /service/static/gitignore, path: .gitignore, binary: true}
  - {template: /service/static/gitattributes, path: .gitattributes, binary: true}
  - {template: /service/static/gitleaks.toml, path: .gitleaks.toml, binary: true}
  - {template: /service/static/pre-commit-config.yaml, path: .pre-commit-config.yaml, binary: true}
  - {template: /service/static/renovate.json, path: renovate.json, binary: true}
  - {template: /service/static/pull_request_template.md, path: .github/pull_request_template.md, binary: true}
  - {template: /service/static/CODEOWNERS, path: .github/CODEOWNERS, binary: true}
  - {template: /library/ci.yaml.mustache, path: .github/workflows/ci.yaml}
  - {template: /library/deploy.yaml.mustache, path: .github/workflows/deploy.yaml}
  - {template: /shared/release/release.yaml, path: .github/workflows/release.yaml, binary: true}
  - {template: /shared/release/release-please-config.json.mustache, path: release-please-config.json}
  - {template: /shared/release/release-please-manifest.json, path: .release-please-manifest.json, binary: true}
  - {template: /shared/release/version.txt, path: version.txt, binary: true}
  # layer 1
  - {template: core/pom.xml.mustache, path: "{{platform.coreArtifact}}/pom.xml"}
  - {template: core/README.md.mustache, path: "{{platform.coreArtifact}}/README.md"}
  - {template: /library/java/package-info.java.mustache, path: "{{platform.coreArtifact}}/src/main/java/{{project.packagePath}}/package-info.java"}
  - {template: /library/java/Main.java.mustache, path: "{{platform.coreArtifact}}/src/main/java/{{project.packagePath}}/{{platform.mainClass}}.java"}
  - {template: /library/java/MainTest.java.mustache, path: "{{platform.coreArtifact}}/src/test/java/{{project.packagePath}}/{{platform.mainClass}}Test.java"}
  # layer 3
  - {template: autoconfigure/pom.xml.mustache, path: "{{platform.capabilityArtifact}}-spring-boot-autoconfigure/pom.xml"}
  - {template: autoconfigure/README.md.mustache, path: "{{platform.capabilityArtifact}}-spring-boot-autoconfigure/README.md"}
  - {template: autoconfigure/package-info.java.mustache, path: "{{platform.capabilityArtifact}}-spring-boot-autoconfigure/src/main/java/{{platform.springPackagePath}}/package-info.java"}
  - {template: autoconfigure/Properties.java.mustache, path: "{{platform.capabilityArtifact}}-spring-boot-autoconfigure/src/main/java/{{platform.springPackagePath}}/{{platform.propertiesClass}}.java"}
  - {template: autoconfigure/AutoConfiguration.java.mustache, path: "{{platform.capabilityArtifact}}-spring-boot-autoconfigure/src/main/java/{{platform.springPackagePath}}/{{platform.autoConfigurationClass}}.java"}
  - {template: autoconfigure/imports.mustache, path: "{{platform.capabilityArtifact}}-spring-boot-autoconfigure/src/main/resources/META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports"}
  - {template: autoconfigure/AutoConfigurationTest.java.mustache, path: "{{platform.capabilityArtifact}}-spring-boot-autoconfigure/src/test/java/{{platform.springPackagePath}}/{{platform.autoConfigurationClass}}Test.java"}
  - {template: starter/pom.xml.mustache, path: "{{platform.capabilityArtifact}}-spring-boot-starter/pom.xml"}
  - {template: starter/README.md.mustache, path: "{{platform.capabilityArtifact}}-spring-boot-starter/README.md"}
