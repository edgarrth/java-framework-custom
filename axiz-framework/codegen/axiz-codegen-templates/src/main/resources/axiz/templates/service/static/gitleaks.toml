# gitleaks configuration shared by all axiz repositories
title = "axiz gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "axiz-nexus-token"
description = "Nexus user token"
regex = '''(?i)nexus[_-]?(token|password)\s*[:=]\s*['"][A-Za-z0-9+/=_-]{12,}['"]'''
tags = ["nexus", "credential"]

[[rules]]
id = "axiz-jdbc-password"
description = "Password embedded in a JDBC URL"
regex = '''jdbc:[a-z0-9]+://[^\s'"]*password=[^\s&'"]{4,}'''
tags = ["database", "credential"]

# Only a reviewed false positive of this rule, at these exact paths and on a digest-only line.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Canonical SHA-256 metadata; never allow an entire evidence file"
condition = "AND"
paths = [
  '^(?:axiz-framework/)?docs/api/public-api\.json$',
]
regexTarget = "line"
regexes = [
  '^\s*"(?:sha256|[A-Za-z]*Sha256)"\s*:\s*"[0-9a-f]{64}"\s*,?\s*$',
]
