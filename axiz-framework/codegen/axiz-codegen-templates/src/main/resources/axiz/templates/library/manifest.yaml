# Library template set: a plain Java (layer 1) library published to Nexus.
files:
  - {template: /shared/mvnw, path: mvnw, binary: true}
  - {template: /shared/mvnw.cmd, path: mvnw.cmd, binary: true}
  - {template: /shared/mvn/wrapper/maven-wrapper.properties, path: .mvn/wrapper/maven-wrapper.properties, binary: true}
  - {template: /shared/mvn/jvm.config, path: .mvn/jvm.config, binary: true}
  - {template: /shared/mvn/maven.config, path: .mvn/maven.config, binary: true}
  - {template: pom.xml.mustache, path: pom.xml}
  - {template: README.md.mustache, path: README.md}
  - {template: project.yaml.mustache, path: .axiz/project.yaml}
  - {template: /service/static/editorconfig, path: .editorconfig, binary: true}
  - {template: /service/static/gitignore, path: .gitignore, binary: true}
  - {template: /service/static/gitattributes, path: .gitattributes, binary: true}
  - {template: /service/static/gitleaks.toml, path: .gitleaks.toml, binary: true}
  - {template: /service/static/pre-commit-config.yaml, path: .pre-commit-config.yaml, binary: true}
  - {template: /service/static/renovate.json, path: renovate.json, binary: true}
  - {template: /service/static/pull_request_template.md, path: .github/pull_request_template.md, binary: true}
  - {template: /service/static/CODEOWNERS, path: .github/CODEOWNERS, binary: true}
  - {template: ci.yaml.mustache, path: .github/workflows/ci.yaml}
  - {template: deploy.yaml.mustache, path: .github/workflows/deploy.yaml}
  - {template: /shared/release/release.yaml, path: .github/workflows/release.yaml, binary: true}
  - {template: /shared/release/release-please-config.json.mustache, path: release-please-config.json}
  - {template: /shared/release/release-please-manifest.json, path: .release-please-manifest.json, binary: true}
  - {template: /shared/release/version.txt, path: version.txt, binary: true}
  - {template: java/package-info.java.mustache, path: "src/main/java/{{project.packagePath}}/package-info.java"}
  - {template: java/Main.java.mustache, path: "src/main/java/{{project.packagePath}}/{{platform.mainClass}}.java"}
  - {template: java/MainTest.java.mustache, path: "src/test/java/{{project.packagePath}}/{{platform.mainClass}}Test.java"}
