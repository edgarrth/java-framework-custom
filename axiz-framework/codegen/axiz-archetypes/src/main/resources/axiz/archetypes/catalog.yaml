# Contratos de capa: roles de servicio cerrados; la primera entrada es la de por defecto.
archetypes:
- name: business
  role: Dueño de las reglas de negocio del dominio
  kind: service
  structures:
  - hexagonal
  - layered
  extensions:
  - cqrs
  stacks:
  - servlet
  - reactive
  persistence:
  - aurora
  - dynamodb
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - i18n
  - security
  - audit
  - secrets
  deployment: deployment
  rest: true
  properties: {}
- name: core
  role: Fachada hacia los sistemas internos de registro
  kind: service
  structures:
  - hexagonal
  extensions: []
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - i18n
  - security
  - http-client
  - resilience
  - secrets
  - audit
  deployment: deployment
  rest: true
  properties: {}
- name: gateway
  role: Fachada y seguridad para sistemas externos
  kind: service
  structures:
  - hexagonal
  extensions: []
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - security
  - http-client
  - resilience
  - secrets
  - audit
  - idempotency
  deployment: deployment
  rest: true
  properties: {}
- name: ux
  role: Experiencia de canal sin persistencia de dominio
  kind: service
  structures:
  - bff
  extensions: []
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - i18n
  - security
  - http-client
  - resilience
  - cache
  deployment: deployment
  rest: true
  properties:
    axiz.web.api-version.enabled: true
    axiz.web.api-version.supported:
    - '1'
    axiz.web.api-version.default-version: '1'
    axiz.bff.timeout: 3s
- name: support
  role: Servicio de soporte reutilizable entre dominios
  kind: service
  structures:
  - hexagonal
  - layered
  extensions: []
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  - aurora
  - dynamodb
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - i18n
  - security
  deployment: deployment
  rest: true
  properties: {}
- name: event-processor
  role: Consume eventos de dominio sin API REST pública
  kind: service
  structures:
  - eda
  - hexagonal
  extensions:
  - cqrs
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  - aurora
  - dynamodb
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - security
  - messaging
  - messaging-kafka
  - inbox
  deployment: deployment
  rest: false
  properties:
    axiz.messaging.consumer.max-attempts: 5
    axiz.messaging.kafka.topics:
    - example-events
- name: batch
  role: Procesamiento programado de archivos y conciliación
  kind: service
  structures:
  - batch
  extensions: []
  stacks:
  - servlet
  persistence:
  - aurora
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - storage
  - storage-s3
  - audit
  - secrets
  deployment: cronjob
  rest: false
  properties:
    spring.main.web-application-type: none
    spring.batch.job.enabled: true
    spring.batch.jdbc.initialize-schema: never
    job.input-key: ${JOB_INPUT_KEY:in/input.csv}
- name: library
  role: Librería Java plana para el ecosistema (aplican las reglas de la capa 1)
  kind: platform
  structures:
  - none
  stacks:
  - servlet
  persistence: []
  starters: []
  deployment: none
  rest: false
  properties: {}
  extensions: []
- name: starter
  role: Nueva capacidad de axiz (librería de capa 1 más starter Spring Boot de capa 3)
  kind: platform
  structures:
  - none
  stacks:
  - servlet
  persistence: []
  starters: []
  deployment: none
  rest: false
  properties: {}
  extensions: []
