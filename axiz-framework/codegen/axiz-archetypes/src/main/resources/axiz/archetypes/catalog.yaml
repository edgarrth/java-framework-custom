# Layer contracts: closed service roles; the first entry is the default.
archetypes:
- name: business
  role: Owner of domain business rules
  kind: service
  structures:
  - hexagonal
  - layered
  extensions:
  - cqrs
  stacks:
  - servlet
  - reactive
  persistence:
  - aurora
  - dynamodb
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - i18n
  - security
  - audit
  - secrets
  deployment: deployment
  rest: true
  properties: {}
- name: core
  role: Facade to internal systems of record
  kind: service
  structures:
  - hexagonal
  extensions: []
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - i18n
  - security
  - http-client
  - resilience
  - secrets
  - audit
  deployment: deployment
  rest: true
  properties: {}
- name: gateway
  role: Facade and security for external systems
  kind: service
  structures:
  - hexagonal
  extensions: []
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - security
  - http-client
  - resilience
  - secrets
  - audit
  - idempotency
  deployment: deployment
  rest: true
  properties: {}
- name: ux
  role: Channel experience without domain persistence
  kind: service
  structures:
  - bff
  extensions: []
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - i18n
  - security
  - http-client
  - resilience
  - cache
  deployment: deployment
  rest: true
  properties:
    axiz.web.api-version.enabled: true
    axiz.web.api-version.supported:
    - '1'
    axiz.web.api-version.default-version: '1'
    axiz.bff.timeout: 3s
- name: support
  role: Reusable cross-domain support service
  kind: service
  structures:
  - hexagonal
  - layered
  extensions: []
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  - aurora
  - dynamodb
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - web
  - i18n
  - security
  deployment: deployment
  rest: true
  properties: {}
- name: event-processor
  role: Consumes domain events without a public REST API
  kind: service
  structures:
  - eda
  - hexagonal
  extensions:
  - cqrs
  stacks:
  - servlet
  - reactive
  persistence:
  - none
  - aurora
  - dynamodb
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - security
  - messaging
  - messaging-kafka
  - inbox
  deployment: deployment
  rest: false
  properties:
    axiz.messaging.consumer.max-attempts: 5
    axiz.messaging.kafka.topics:
    - example-events
- name: batch
  role: Scheduled file processing and reconciliation
  kind: service
  structures:
  - batch
  extensions: []
  stacks:
  - servlet
  persistence:
  - aurora
  starters:
  - foundation
  - errors
  - logging
  - observability
  - metrics
  - config
  - sensitive
  - storage
  - storage-s3
  - audit
  deployment: cronjob
  rest: false
  properties:
    spring.main.web-application-type: none
    spring.batch.job.enabled: true
    spring.batch.jdbc.initialize-schema: never
    job.input-key: ${JOB_INPUT_KEY:in/input.csv}
- name: library
  role: Plain Java library for the ecosystem (layer 1 rules apply)
  kind: platform
  structures:
  - none
  stacks:
  - servlet
  persistence: []
  starters: []
  deployment: none
  rest: false
  properties: {}
  extensions: []
- name: starter
  role: New axiz capability (layer 1 library + layer 3 Spring Boot starter)
  kind: platform
  structures:
  - none
  stacks:
  - servlet
  persistence: []
  starters: []
  deployment: none
  rest: false
  properties: {}
  extensions: []
