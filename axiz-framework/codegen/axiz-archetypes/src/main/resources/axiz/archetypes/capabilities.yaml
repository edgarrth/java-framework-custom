# Capacidades de axiz: lo que `axiz add <capability>` (y el initializr) añade a un servicio.
#
#   starter        artefacto starter de axiz (versión gestionada por axiz-bom)
#   dependencies   artefactos adicionales, groupId:artifactId (adaptadores, drivers); versiones del BOM
#   requires       capacidades que se añaden junto con esta
#   properties     entradas de application.yaml (claves planas); los placeholders ${VAR:default} mantienen
#                  los valores fuera del código: los valores reales provienen del ConfigMap o del almacén de secretos
#   configMapKeys  claves que el ConfigMap del servicio debe definir por entorno (`config` de los valores de Helm)
#   secrets        claves del secreto del servicio (ExternalSecret desde AWS Secrets Manager)
#   example        uso que se muestra después de añadirla
#   persistence    por almacén, propiedades, dependencias y requires adicionales; una capacidad con este
#                  mapa solo admite los almacenes listados. Almacenes: aurora (stack servlet: JDBC/JPA),
#                  r2dbc (Aurora desde el stack reactivo) y dynamodb
capabilities:
  # --- base -------------------------------------------------------------------------------
  - name: foundation
    stacks: [servlet, reactive]
    starter: axiz-foundation-spring-boot-starter
    description: Reloj y calendario de negocio (zona, fines de semana, feriados), valores por defecto de JSON y validación
    properties:
      axiz.foundation.zone: America/Lima
    configMapKeys: [axiz.foundation.calendar.holidays]
    example: |
      BusinessCalendar calendar; // inyectado
      LocalDate settlement = calendar.addBusinessDays(today, 1);

  - name: web
    stacks: [servlet, reactive]
    starter: axiz-web-spring-boot-starter
    description: Cabeceras de metadatos de la petición, correlación, paginación, versionado de API, CORS y convenciones JSON
    properties:
      axiz.web.pagination.default-size: 20
      axiz.web.pagination.max-size: 200
    example: |
      @GetMapping
      PageResponse<Item> list(@Paging PageRequest page) { ... }

  - name: errors
    stacks: [servlet, reactive]
    starter: axiz-errors-spring-boot-starter
    description: Problem details RFC 9457, catálogo de errores (ConfigMap <app>-errors) y mapeo de errores externos
    properties:
      axiz.errors.type-base-uri: ${AXIZ_ERRORS_TYPE_BASE_URI:}
    example: |
      throw new BusinessException(MyErrors.LIMIT_EXCEEDED, "limit exceeded", Map.of("limit", limit));

  - name: logging
    stacks: [servlet, reactive]
    starter: axiz-logging-spring-boot-starter
    description: Logs JSON estructurados con traza y contexto de la petición, log de acceso HTTP con enmascaramiento
    properties:
      axiz.logging.http.enabled: true
    example: |
      log.atInfo().addKeyValue("orderId", id).log("order created");

  - name: observability
    stacks: [servlet, reactive]
    starter: axiz-observability-spring-boot-starter
    description: Trazas y métricas OpenTelemetry mediante Micrometer (OTLP), sin agente Java
    properties:
      management.opentelemetry.tracing.export.otlp.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      management.otlp.metrics.export.url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
      management.tracing.sampling.probability: ${AXIZ_TRACE_SAMPLING:0.1}
    example: |
      @Metered(event = "order.price")
      Money price(Order order) { ... }

  - name: metrics
    stacks: [servlet, reactive]
    starter: axiz-metrics-spring-boot-starter
    description: Métricas genéricas de eventos (conteo, duración, importes por moneda, valores) con tags acotados
    properties:
      management.endpoints.web.exposure.include: health,info,prometheus
      management.endpoint.health.probes.enabled: true
    example: |
      metrics.amount("order.created", order.total(), e -> e.channel(channel).outcome(Outcome.SUCCESS));

  - name: config
    stacks: [servlet, reactive]
    starter: axiz-config-spring-boot-starter
    description: ConfigMaps montados como archivos (axiz-common, <app>, <app>-errors; sin acceso a la API de Kubernetes) y comprobación de llaves requeridas
    local:
      axiz.config.environment: local
      axiz.transport.allow-plain-http: true
      axiz.transport.allow-insecure-data-stores: true
    example: |
      axiz.config.required: [axiz.http-client.clients.core.base-url]

  - name: config-aws
    stacks: [servlet, reactive]
    starter: axiz-config-aws-spring-boot-starter
    requires: [config]
    description: Arranque opcional desde AWS Parameter Store con ambiente y destino elegidos por el proceso
    example: |
      # Se definen en el proceso, antes de Config Data; no en application.yaml.
      AXIZ_CONFIG_PARAMETER_STORE_ENABLED=true
      AXIZ_CONFIG_PARAMETER_STORE_APPLICATION=payments
      AXIZ_CONFIG_ENVIRONMENT=prod

  - name: i18n
    stacks: [servlet, reactive]
    starter: axiz-i18n-spring-boot-starter
    description: Mensajes y problem details localizados (es-PE por defecto) desde messages*.properties
    properties:
      axiz.i18n.default-locale: es-PE
    example: |
      String text = messages.get("order.created", locale, Map.of("orderId", orderId));

  - name: sensitive
    stacks: [servlet, reactive]
    starter: axiz-sensitive-spring-boot-starter
    description: Enmascaramiento de campos sensibles en respuestas, logs y auditoría según el nivel de sensibilidad
    properties:
      axiz.sensitive.response: MEDIUM
    example: |
      record Customer(@Sensitive(level = HIGH, mask = PARTIAL) String documentNumber) {}

  - name: security
    stacks: [servlet, reactive]
    starter: axiz-security-spring-boot-starter
    description: Resource server OAuth2 (emisores confiables, audiencias, claims), contexto del llamador y límite de tasa
    properties:
      axiz.security.issuers[0].issuer: ${AXIZ_OIDC_ISSUER}
      axiz.security.issuers[0].audiences[0]: ${spring.application.name}
    configMapKeys: [axiz.security.issuers]
    local:
      axiz.security.issuers[0].issuer: http://localhost:8180/realms/axiz
      axiz.security.issuers[0].audiences[0]: local-services
      # Swagger UI sin token solo en un portátil; en cualquier entorno requiere un token
      axiz.security.public-api-docs: true
    example: |
      @PreAuthorize("hasAuthority('SCOPE_orders.write')")

  - name: security-redis
    stacks: [servlet, reactive]
    starter: axiz-security-redis-spring-boot-starter
    description: Límites de tasa compartidos en Redis con el transporte TLS gestionado
    requires: [security]
    properties:
      axiz.security.rate-limit.enabled: true
      axiz.security.rate-limit.store: redis
      axiz.security.rate-limit.rules[0].name: api
      axiz.security.rate-limit.rules[0].paths: ["/**"]
      axiz.security.rate-limit.rules[0].limit: 100
      axiz.security.rate-limit.rules[0].window: 1m
      axiz.security.rate-limit.rules[0].fail-open: false
    configMapKeys: [axiz.security.rate-limit]
    example: |
      axiz.security.rate-limit.store: redis

  # --- integration ------------------------------------------------------------------------
  - name: http-client
    stacks: [servlet, reactive]
    starter: axiz-http-client-spring-boot-starter
    description: Clientes HTTP declarativos por nombre con timeouts, reintentos, circuit breaker, OAuth2 client credentials y propagación de cabeceras
    requires: [resilience]
    properties:
      axiz.http-client.clients.example.base-url: ${EXAMPLE_BASE_URL:https://example.invalid}
    configMapKeys: [axiz.http-client.clients]
    example: |
      @HttpExchange("/v1/accounts")
      interface AccountsClient { @GetExchange("/{id}") Account get(@PathVariable String id); }

  - name: resilience
    stacks: [servlet, reactive]
    starter: axiz-resilience-spring-boot-starter
    description: Políticas de timeout, reintento con backoff, circuit breaker y bulkhead por nombre
    properties:
      axiz.resilience.defaults.timeouts.total: 15s
    example: |
      axiz.resilience.instances.core.retry.max-attempts: 2

  - name: soap
    stacks: [servlet]
    starter: axiz-soap-spring-boot-starter
    description: Clientes SOAP 1.1/1.2 con WS-Security, timeouts y observaciones
    requires: [secrets]
    properties:
      axiz.soap.clients.example.endpoint: ${EXAMPLE_SOAP_ENDPOINT:https://example.invalid/soap}
    configMapKeys: [axiz.soap.clients]
    example: |
      Element reply = soapClients.call("example", "urn:getBalance", requestXml);

  - name: secrets
    stacks: [servlet, reactive]
    starter: axiz-secrets-spring-boot-starter
    description: Fuentes de secretos ordenadas y caché con TTL acotado, independientes del proveedor
    example: |
      try (SecretValue apiKey = secretResolver.require("partner-api-key")) { /* use apiKey */ }

  - name: secrets-file
    stacks: [servlet, reactive]
    starter: axiz-secrets-file-spring-boot-starter
    requires: [secrets]
    description: Archivos de secretos montados y variables de entorno, con instantáneas nativas refrescadas
    properties:
      axiz.secrets.directory: /var/run/secrets/axiz
    local:
      axiz.secrets.directory: ./local/secrets

  - name: secrets-aws
    stacks: [servlet, reactive]
    starter: axiz-secrets-aws-spring-boot-starter
    requires: [secrets]
    description: Fuentes explícitas de Secrets Manager y Parameter Store con identidad de AWS compartida
    properties:
      axiz.secrets.secrets-manager.enabled: true
    local:
      axiz.aws.endpoint: http://localhost:4566

  # --- data -------------------------------------------------------------------------------
  - name: jpa
    stacks: [servlet]
    dependencies: [pe.axiz:axiz-kit-jpa]
    starter: axiz-jpa-spring-boot-starter
    description: PostgreSQL con JPA, Flyway, auditoría y columnas cifradas
    properties:
      spring.datasource.url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
      spring.datasource.username: ${DB_USERNAME:app}
      spring.jpa.open-in-view: false
      spring.jpa.hibernate.ddl-auto: validate
      spring.flyway.enabled: true
    configMapKeys: [spring.datasource.url, spring.datasource.username]
    persistence:
      aurora: {}
    example: |
      @Entity class Order extends AuditableEntity { ... }

  - name: jpa-aws
    stacks: [servlet]
    starter: axiz-jpa-aws-spring-boot-starter
    requires: [jpa]
    description: AWS JDBC wrapper para failover de Aurora y autenticación IAM opcional
    properties:
      axiz.jpa.aws-wrapper.enabled: ${AXIZ_JPA_AWS_WRAPPER:true}
      axiz.jpa.aws-wrapper.iam: ${AXIZ_JPA_IAM:false}
    configMapKeys: [axiz.jpa.aws-wrapper.enabled, axiz.jpa.aws-wrapper.iam]

  - name: r2dbc
    stacks: [reactive]
    dependencies: [pe.axiz:axiz-kit-r2dbc]
    starter: axiz-r2dbc-spring-boot-starter
    description: Aurora PostgreSQL para servicios reactivos sobre R2DBC (no bloqueante), Flyway, auditoría, columnas cifradas y de dinero, endpoint de lectura
    properties:
      spring.r2dbc.url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/app}
      spring.r2dbc.username: ${DB_USERNAME:app}
      spring.r2dbc.properties.sslMode: ${DB_SSL_MODE:verify-full}
      spring.flyway.enabled: true
    configMapKeys: [spring.r2dbc.url, spring.r2dbc.username]
    persistence:
      r2dbc: {}
    example: |
      @Table("payment") class PaymentRow extends AuditableRow { ... }
      interface PaymentRows extends ReactiveCrudRepository<PaymentRow, UUID> {}

  - name: r2dbc-aws
    stacks: [reactive]
    starter: axiz-r2dbc-aws-spring-boot-starter
    requires: [r2dbc]
    description: Autenticación IAM de AWS con credenciales independientes de escritura y de lectura
    properties:
      axiz.r2dbc.iam.enabled: ${AXIZ_R2DBC_IAM:true}
    configMapKeys: [axiz.r2dbc.iam.enabled]
    local:
      axiz.r2dbc.iam.enabled: false

  - name: dynamodb
    stacks: [servlet, reactive]
    dependencies: [pe.axiz:axiz-kit-dynamodb]
    starter: axiz-dynamodb-spring-boot-starter
    description: Cliente enhanced de DynamoDB, repositorios con paginación por cursor y bloqueo optimista
    properties:
      axiz.dynamodb.table-prefix: ${AXIZ_DYNAMODB_TABLE_PREFIX:local-}
    configMapKeys: [axiz.dynamodb.table-prefix]
    local:
      axiz.aws.endpoint: http://localhost:4566
      spring.cloud.aws.endpoint: http://localhost:4566
      spring.cloud.aws.region.static: us-east-1
    example: |
      DynamoRepository<Item> items = repositories.create("items", Item.class);

  - name: dynamodb-cursor
    starter: axiz-dynamodb-spring-boot-starter
    stacks: [servlet, reactive]
    requires: [dynamodb, secrets]
    description: Cursores de DynamoDB autenticados y ligados a la consulta, con claves rotativas compartidas
    properties:
      axiz.dynamodb.cursor.current-key-id: v1
      axiz.dynamodb.cursor.key-ids: [v1]
      axiz.dynamodb.cursor.secret-prefix: cursor-key-
      axiz.dynamodb.cursor.encrypt: false
    configMapKeys: [axiz.dynamodb.cursor.current-key-id, axiz.dynamodb.cursor.key-ids, axiz.dynamodb.cursor.encrypt]
    secrets: [cursor-key-v1]
    example: |
      CursorCodec cursors = repositories.cursors();
      String next = cursors.encode(lastKey, "table/index/filter/tenant");

  - name: cache
    stacks: [servlet, reactive]
    starter: axiz-cache-spring-boot-starter
    description: '@AxizCacheable con soporte de Mono/Flux y Caffeine como L1'
    properties:
      axiz.cache.default-ttl: 10m
      axiz.cache.redis: false
    example: |
      @AxizCacheable(value = "rates", ttl = "5m")
      Rate rate(String currency) { ... }

  - name: cache-redis
    stacks: [servlet, reactive]
    starter: axiz-cache-spring-boot-starter
    description: Caché L2 en ElastiCache (Redis/Valkey), tolerante a caídas de Redis
    requires: [cache]
    dependencies: [pe.axiz:axiz-cache-redis-spring-boot-starter]
    properties:
      axiz.cache.redis: true
      spring.data.redis.url: ${REDIS_URL:redis://localhost:6379}
    configMapKeys: [spring.data.redis.url]
    example: |
      @AxizCacheable("customers")

  - name: storage
    stacks: [servlet, reactive]
    starter: axiz-storage-spring-boot-starter
    description: Puertos de almacenamiento de objetos síncronos y asíncronos nativos, y fachadas de Spring
  - name: messaging
    stacks: [servlet, reactive]
    starter: axiz-messaging-spring-boot-starter
    description: Puertos, handlers y rutas CloudEvents, y fachada de Spring
  - name: storage-s3
    stacks: [servlet, reactive]
    starter: axiz-storage-s3-spring-boot-starter
    description: Almacenamiento de objetos en S3 (streaming, URLs prefirmadas, metadatos), con observaciones
    requires: [storage]
    properties:
      axiz.storage.bucket: ${AXIZ_STORAGE_BUCKET:local-bucket}
    configMapKeys: [axiz.storage.bucket]
    local:
      axiz.aws.endpoint: http://localhost:4566
      spring.cloud.aws.endpoint: http://localhost:4566
      spring.cloud.aws.region.static: us-east-1
    example: |
      storage.put("in/file.txt", content, ObjectMetadata.of("text/plain", length));
      // Servlet: ObjectStorage + InputStream. Reactivo: ReactiveStorage + Publisher<ByteBuffer>, devuelve Mono<Void>.
      // Las descargas se consumen con reactiveStorage.content(key) para liberar las respuestas al terminar, fallar o cancelar.

  - name: sequence
    stacks: [servlet, reactive]
    starter: axiz-sequence-spring-boot-starter
    description: Secuencias de negocio (prefijo, ancho, reinicio diario o mensual) sobre JDBC, R2DBC nativo o DynamoDB
    properties:
      axiz.sequence.sequences.operation.prefix: OP
    persistence:
      aurora:
        dependencies: [pe.axiz:axiz-sequence-jdbc-spring-boot-starter]
      r2dbc:
        properties: {axiz.sequence.store: r2dbc}
        dependencies: [pe.axiz:axiz-sequence-r2dbc-spring-boot-starter]
      dynamodb:
        properties: {axiz.sequence.store: dynamodb, axiz.sequence.table: '${axiz.dynamodb.table-prefix}axiz-sequence'}
        dependencies: [pe.axiz:axiz-sequence-dynamodb-spring-boot-starter]
    example: |
      sequences.next("operation"); // String con Sequences; Mono<String> con ReactiveSequences

  # --- messaging --------------------------------------------------------------------------
  - name: messaging-kafka
    stacks: [servlet, reactive]
    starter: axiz-messaging-kafka-spring-boot-starter
    requires: [messaging]
    description: CloudEvents sobre Kafka con reintentos, DLQ y propagación de trazas
    properties:
      spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    configMapKeys: [spring.kafka.bootstrap-servers, axiz.messaging.destinations]
    example: |
      axizEvents.publish("orders", "order-created.v1", order.id(), new OrderCreated(order.id()));

  - name: messaging-msk
    stacks: [servlet, reactive]
    starter: axiz-messaging-msk-spring-boot-starter
    requires: [messaging-kafka]
    description: Autenticación IAM de MSK mediante la política compartida de credenciales de AWS
    properties:
      axiz.messaging.kafka.authentication: msk
    configMapKeys: [axiz.messaging.kafka.authentication]
    local:
      axiz.messaging.kafka.authentication: configured

  - name: messaging-sqs
    stacks: [servlet, reactive]
    starter: axiz-messaging-sqs-spring-boot-starter
    requires: [messaging]
    description: Consumidores y publicadores CloudEvents sobre SQS (estándar y FIFO) con DLQ
    properties:
      axiz.messaging.sqs.wait-time: 20s
    configMapKeys: [axiz.messaging.sqs.queues, axiz.messaging.destinations]
    local:
      axiz.aws.endpoint: http://localhost:4566
    example: |
      axiz.messaging.sqs.queues: [https://sqs.<region>.amazonaws.com/<account>/orders]

  - name: messaging-sns
    stacks: [servlet, reactive]
    starter: axiz-messaging-sns-spring-boot-starter
    requires: [messaging]
    description: Publicación CloudEvents en tópicos SNS (difusión)
    properties: {}
    configMapKeys: [axiz.messaging.destinations]
    local:
      axiz.aws.endpoint: http://localhost:4566
    example: |
      axiz.messaging.destinations.notifications: arn:aws:sns:<region>:<account>:notifications

  - name: outbox
    requiresAnyOf: [messaging-kafka, messaging-sns, messaging-sqs]
    stacks: [servlet, reactive]
    starter: axiz-outbox-spring-boot-starter
    description: Outbox transaccional en Aurora (JDBC o R2DBC) con relay hacia MSK, SNS o SQS (al menos una vez)
    properties:
      axiz.outbox.relay.enabled: true
    persistence:
      aurora:
        requires: [jpa]
        dependencies: [pe.axiz:axiz-outbox-jdbc-spring-boot-starter]
      r2dbc:
        properties:
          axiz.outbox.store: r2dbc
        requires: [r2dbc]
        dependencies: [pe.axiz:axiz-outbox-r2dbc-spring-boot-starter]
    example: |
      // dentro de la transacción del cambio de negocio: se publica si y solo si se confirma
      transactionalEvents.enqueue("orders", event.id(), "order-created.v1", "order", order.id(), event);
      // servicios reactivos: reactiveTransactionalEvents.enqueue(...) devuelve un Mono en la misma transacción

  - name: inbox
    stacks: [servlet, reactive]
    starter: axiz-inbox-spring-boot-starter
    description: Deduplicación del consumidor (inbox) con leases y retención, sobre JDBC, R2DBC o DynamoDB
    properties:
      axiz.inbox.retention: 14d
    persistence:
      aurora:
        dependencies: [pe.axiz:axiz-inbox-jdbc-spring-boot-starter]
      r2dbc:
        properties: {axiz.inbox.store: r2dbc}
        dependencies: [pe.axiz:axiz-inbox-r2dbc-spring-boot-starter]
      dynamodb:
        properties: {axiz.inbox.store: dynamodb, axiz.inbox.table: '${axiz.dynamodb.table-prefix}axiz-inbox'}
        dependencies: [pe.axiz:axiz-inbox-dynamodb-spring-boot-starter]
    example: |
      // los consumidores se deduplican de forma automática por el id del evento

  - name: idempotency
    stacks: [servlet, reactive]
    starter: axiz-idempotency-spring-boot-starter
    description: Idempotency-Key para POST/PATCH con respuestas guardadas (en memoria solo en local/test; los ambientes compartidos requieren idempotency-redis o idempotency-dynamodb)
    properties:
      axiz.idempotency.retention: 24h
    example: |
      @Idempotent
      @PostMapping ResponseEntity<Order> create(...)

  - name: idempotency-redis
    stacks: [servlet, reactive]
    starter: axiz-idempotency-spring-boot-starter
    description: Almacén de idempotencia en ElastiCache (Redis/Valkey)
    requires: [idempotency]
    dependencies: [pe.axiz:axiz-idempotency-redis-spring-boot-starter]
    properties:
      axiz.idempotency.store: redis
      spring.data.redis.url: ${REDIS_URL:redis://localhost:6379}
    configMapKeys: [spring.data.redis.url]
    example: |
      axiz.idempotency.store: redis

  - name: idempotency-dynamodb
    stacks: [servlet, reactive]
    starter: axiz-idempotency-spring-boot-starter
    description: Almacén de idempotencia en DynamoDB (escrituras condicionales y TTL)
    requires: [idempotency, dynamodb]
    dependencies: [pe.axiz:axiz-idempotency-dynamodb-spring-boot-starter]
    properties:
      axiz.idempotency.store: dynamodb
      axiz.idempotency.table: ${axiz.dynamodb.table-prefix}axiz-idempotency
    example: |
      axiz.idempotency.store: dynamodb

  - name: saga
    stacks: [servlet]
    starter: axiz-saga-spring-boot-starter
    description: Sagas orquestadas con estado persistido, reintentos por paso y compensaciones
    requires: [jpa]
    dependencies: [pe.axiz:axiz-saga-jdbc-spring-boot-starter]
    properties:
      axiz.saga.step-attempts: 3
    example: |
      SagaResult<PaymentContext> result = orchestrator.start(PaymentSaga.DEFINITION, codec, sagaId, context);

  # --- operations -------------------------------------------------------------------------
  - name: lock
    stacks: [servlet, reactive]
    starter: axiz-lock-spring-boot-starter
    description: Locks distribuidos (en memoria solo en local/test; los ambientes compartidos requieren lock-redis o lock-dynamodb)
    local:
      axiz.lock.store: memory
    example: |
      // el lease se comprueba justo antes del efecto; el débito es idempotente (clave) en el core
      lockTemplate.withLock("account:" + id, Duration.ofSeconds(10), Duration.ofSeconds(2), lease -> {
        lease.ensureHeld();
        return core.debit(id, amount, idempotencyKey);
      });

  - name: lock-redis
    stacks: [servlet, reactive]
    starter: axiz-lock-spring-boot-starter
    description: Locks distribuidos en ElastiCache (Redis/Valkey)
    requires: [lock]
    dependencies: [pe.axiz:axiz-lock-redis-spring-boot-starter]
    properties:
      axiz.lock.store: redis
      spring.data.redis.url: ${REDIS_URL:redis://localhost:6379}
    configMapKeys: [spring.data.redis.url]
    example: |
      axiz.lock.store: redis

  - name: lock-dynamodb
    stacks: [servlet, reactive]
    starter: axiz-lock-spring-boot-starter
    description: Locks distribuidos en DynamoDB (leases)
    requires: [lock, dynamodb]
    dependencies: [pe.axiz:axiz-lock-dynamodb-spring-boot-starter]
    properties:
      axiz.lock.store: dynamodb
      axiz.lock.table: ${axiz.dynamodb.table-prefix}axiz-locks
    example: |
      axiz.lock.store: dynamodb

  - name: scheduling
    stacks: [servlet, reactive]
    starter: axiz-scheduling-spring-boot-starter
    description: 'Jobs @Scheduled con ShedLock (JDBC, R2DBC o DynamoDB) para que solo una réplica los ejecute'
    properties:
      axiz.scheduling.default-lock-at-most-for: 10m
    persistence:
      aurora:
        dependencies: [pe.axiz:axiz-scheduling-jdbc-spring-boot-starter]
      r2dbc:
        properties: {axiz.scheduling.store: r2dbc}
        dependencies: [pe.axiz:axiz-scheduling-r2dbc-spring-boot-starter]
      dynamodb:
        properties: {axiz.scheduling.store: dynamodb, axiz.scheduling.table: '${axiz.dynamodb.table-prefix}axiz-shedlock'}
        dependencies: [pe.axiz:axiz-scheduling-dynamodb-spring-boot-starter]
    example: |
      @Scheduled(cron = "0 0 2 * * *") @SchedulerLock(name = "purge")
      void purge() { ... }

  - name: audit
    stacks: [servlet, reactive]
    starter: axiz-audit-spring-boot-starter
    description: 'Rastro de auditoría de negocio con @Auditable, saneado por sensibilidad, con entrega ASYNC/DURABLE/SYNC explícita y cadena HMAC con clave fuera de local/test/ci'
    properties:
      axiz.audit.mode: ASYNC
    secrets: [audit-hmac-key]
    example: |
      @Auditable(action = "create", resource = "order", resourceIdArgument = "id")

  - name: audit-kafka
    stacks: [servlet, reactive]
    starter: axiz-audit-kafka-spring-boot-starter
    description: Eventos de auditoría publicados en MSK
    requires: [audit, messaging-kafka]
    properties:
      axiz.audit.kafka.topic: ${AXIZ_AUDIT_TOPIC:audit}
    configMapKeys: [axiz.audit.kafka.topic]
    example: |
      axiz.audit.kafka.topic: audit

  - name: audit-sqs
    stacks: [servlet, reactive]
    starter: axiz-audit-sqs-spring-boot-starter
    description: Eventos de auditoría publicados en SQS
    requires: [audit]
    properties:
      axiz.audit.sqs.queue-url: ${AXIZ_AUDIT_QUEUE_URL}
    configMapKeys: [axiz.audit.sqs.queue-url]
    local:
      axiz.aws.endpoint: http://localhost:4566
    example: |
      axiz.audit.sqs.queue-url: https://sqs.<region>.amazonaws.com/<account>/audit

  - name: crypto
    stacks: [servlet, reactive]
    starter: axiz-crypto-spring-boot-starter
    description: Cifrado de campos, índices ciegos con rotación independiente y hash de contraseñas
    requires: [secrets-file]
    properties:
      axiz.crypto.fields.current-key-id: v1
      axiz.crypto.fields.key-ids: [v1]
      axiz.crypto.fields.index-current-key-id: v1
      axiz.crypto.fields.index-secrets.v1: blind-index-key
    configMapKeys: [axiz.crypto.fields.current-key-id, axiz.crypto.fields.key-ids]
    secrets: [field-key-v1, blind-index-key]
    example: |
      @Converter
      final class AccountNumberConverter extends EncryptedConverter {
        AccountNumberConverter(FieldEncryptor encryptor) { super(encryptor); }
        @Override protected String context() { return "account.number"; }
      }
      @Convert(converter = AccountNumberConverter.class) String accountNumber;

  - name: crypto-kms
    stacks: [servlet, reactive]
    starter: axiz-crypto-kms-spring-boot-starter
    description: Cifrado de sobre con AWS KMS y reutilización acotada de claves de datos
    requires: [crypto]
    properties:
      axiz.crypto.kms.key-id: ${AXIZ_KMS_KEY_ID:alias/local}
    configMapKeys: [axiz.crypto.kms.key-id]
    local:
      axiz.aws.endpoint: http://localhost:4566
    example: |
      byte[] encrypted = envelopeEncryptor.encrypt(payload, "statements");

  - name: carddata
    stacks: [servlet, reactive]
    starter: axiz-core-carddata
    description: Tipos semánticos de PAN y de datos de autenticación transitorios; enmascarados por defecto, sin bóveda
    requires: [sensitive]
    example: |
      try (Pan pan = Pan.of(value)) { /* only reveal at an authorized integration boundary */ }

  - name: tokenization
    stacks: [servlet, reactive]
    starter: axiz-tokenization-spring-boot-starter
    description: Cliente remoto de tokens autenticado, sin almacenamiento de bóveda, claves ni SDK de proveedores
    requires: [http-client, security]
    properties:
      axiz.tokenization.mode: remote
      axiz.tokenization.remote.client: token-vault
      axiz.http-client.clients.token-vault.base-url: ${TOKEN_VAULT_URL}
      axiz.http-client.clients.token-vault.auth.type: TOKEN_RELAY
      axiz.http-client.clients.token-vault.retry: NONE
      axiz.http-client.clients.token-vault.max-attempts: 1
      axiz.http-client.clients.token-vault.max-concurrent-calls: 32
      axiz.http-client.clients.token-vault.max-connections: 32
      axiz.http-client.clients.token-vault.connect-timeout: 2s
      axiz.http-client.clients.token-vault.read-timeout: 5s
      axiz.http-client.clients.token-vault.total-timeout: 10s
    configMapKeys: [axiz.http-client.clients.token-vault.base-url]
    local:
      axiz.tokenization.mode: local
      axiz.http-client.clients.token-vault.base-url: https://synthetic.invalid
    example: |
      // SensitiveValue se posee y se cierra; el consumidor recibe solo el token, nunca el índice.
      tokenizer.tokenize(type, value, domain, operationId);

  - name: tokenization-vault
    stacks: [servlet, reactive]
    starter: axiz-tokenization-vault-spring-boot-starter
    description: Bóveda central de tokens con políticas explícitas, auditoría durable y presupuestos distribuidos
    requires: [crypto, audit, security]
    requiresAnyOf: [audit-kafka, audit-sqs, outbox]
    configMapKeys: [axiz.tokenization.vault.auth, axiz.tokenization.vault.types]
    example: |
      # Se aportan los SPI verificados de mapeo de claims, políticas de tipos, política de acceso y conciliación.
      # El servidor se niega a arrancar si falta un colaborador requerido o un control de claves.

  - name: tokenization-vault-dynamodb
    stacks: [servlet, reactive]
    starter: axiz-tokenization-vault-dynamodb-spring-boot-starter
    description: Tabla explícita de la bóveda central, unicidad atómica y controles de rotación de claves
    requires: [tokenization-vault, dynamodb, crypto-kms]
    properties:
      axiz.tokenization.vault.dynamodb.table: ${TOKEN_VAULT_TABLE}
    configMapKeys: [axiz.tokenization.vault.dynamodb.table]
    example: |
      # La tabla y los controles de claves se aprovisionan con la identidad de operador separada antes del arranque.

  - name: tokenization-vault-redis
    stacks: [servlet, reactive]
    starter: axiz-tokenization-vault-redis-spring-boot-starter
    description: Conexión TLS autenticada y dedicada para presupuestos de tokens distribuidos que fallan de forma cerrada
    requires: [tokenization-vault, secrets]
    properties:
      axiz.tokenization.vault.redis.fail-open: false
      axiz.tokenization.vault.redis.connection.tls: true
    configMapKeys: [axiz.tokenization.vault.redis.namespace, axiz.tokenization.vault.redis.connection, axiz.tokenization.vault.redis.policy]
    example: |
      # Se aportan todas las ventanas de sujeto, cliente y tenant y los límites de concurrencia; no hay cuotas inventadas.
      # connection.password-secret es una referencia de SecretResolver, nunca una credencial en línea.

  - name: tokenization-pan
    stacks: [servlet, reactive]
    starter: axiz-tokenization-pan-spring-boot-starter
    description: Perfil PAN para la bóveda genérica; independiente de los despliegues solo para DNI
    requires: [tokenization-vault]
    example: |
      # Se registra un tipo de servidor que referencia el perfil PAN instalado y un keyset y propósitos explícitos.

  - name: tenancy
    stacks: [servlet, reactive]
    starter: axiz-tenancy-spring-boot-starter
    description: Multi-tenancy desde el token o una cabecera confiable, propagado a logs, métricas y datos
    properties:
      axiz.tenancy.enabled: true
    example: |
      String tenant = TenantContext.current().orElseThrow();

  - name: featureflags
    stacks: [servlet, reactive]
    starter: axiz-featureflags-spring-boot-starter
    description: Feature flags (OpenFeature) por porcentaje, canal, tenant y reglas, desde el ConfigMap
    properties:
      axiz.feature-flags.flags.example.enabled: false
    configMapKeys: [axiz.feature-flags.flags]
    example: |
      if (featureFlags.isEnabled("new-pricing", context)) { ... }

  - name: notification
    stacks: [servlet, reactive]
    starter: axiz-notification-spring-boot-starter
    description: Notificaciones con plantilla (correo, SMS, push) publicadas como eventos
    requires: [messaging-sns]
    properties: {}
    example: |
      notificationSender.send(new NotificationRequest(id, NotificationChannel.EMAIL, to, "payment-confirmed", locale, params, null));

# Capacidades seleccionadas por estilo arquitectónico. Las dependencias, propiedades, migraciones y recursos
# locales derivan todos de estas capacidades. Los valores por defecto que dependen del almacén solo se aplican
# cuando la persistencia seleccionada los admite; las peticiones explícitas incompatibles se rechazan.
styles:
  eda:
    capabilities: [inbox]
  batch:
    capabilities: [scheduling]
