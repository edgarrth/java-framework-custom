# Spectral ruleset for axiz contracts (OpenAPI 3.1 and AsyncAPI). Usage: spectral lint -r axiz-openapi.yaml openapi.yaml
extends:
  - [spectral:oas, recommended]
  - [spectral:asyncapi, recommended]
rules:
  axiz-safe-parameter-names:
    description: Parameter names must be safe for generated Java annotations and identifiers.
    severity: error
    given:
      - $.paths[*].parameters[*].name
      - $.paths[*][get,put,post,delete,patch].parameters[*].name
      - $.components.parameters[*].name
    then:
      function: pattern
      functionOptions: { match: "^[A-Za-z][A-Za-z0-9_.-]{0,63}$" }
  axiz-operation-id-camel-case:
    description: operationId must be lowerCamelCase (it names the generated use case / handler).
    severity: error
    given: $.paths[*][get,put,post,delete,patch].operationId
    then:
      function: casing
      functionOptions: { type: camel }
  axiz-paths-kebab-case:
    description: Path segments must be kebab-case.
    severity: error
    given: $.paths
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^(/([a-z0-9]+(-[a-z0-9]+)*|\\{[a-zA-Z0-9]+\\}))+$"
  axiz-versioned-paths:
    description: Paths must start with a version segment (/v1/...).
    severity: error
    given: $.paths
    then:
      field: "@key"
      function: pattern
      functionOptions: { match: "^/v[0-9]+/" }
  axiz-problem-json-errors:
    description: 4xx/5xx responses must use application/problem+json (RFC 9457).
    severity: error
    given: $.paths[*][*].responses[?(@property >= '400')].content
    then:
      field: application/problem+json
      function: truthy
  axiz-examples-required:
    description: Request and response bodies need examples (used for contract tests).
    severity: warn
    given: $.paths[*][*][requestBody,responses][*].content[*]
    then:
      function: xor
      functionOptions: { properties: [example, examples] }
  axiz-no-business-ids-in-query:
    description: Do not send document numbers or card numbers as query parameters.
    severity: error
    given: $.paths[*][*].parameters[?(@.in == 'query')].name
    then:
      function: pattern
      functionOptions:
        notMatch: "/(card|pan|documentNumber|password|otp)/i"
  axiz-pagination-params:
    description: Collection GET operations must accept page and size.
    severity: warn
    given: $.paths[*].get.responses['200'].content['application/json'].schema
    then:
      function: truthy
  axiz-idempotency-key-on-post:
    description: Non-idempotent POST operations should declare the Idempotency-Key header.
    severity: warn
    given: $.paths[*].post
    then:
      field: parameters
      function: truthy
  axiz-explicit-http-access:
    description: >-
      Every operation declares its access: security inherited from the root or its own, with an
      OAuth2/OpenID Connect or bearer scheme, or security: [] for explicit public access. The
      generator, axiz contract lint, axiz doctor and the Initializr apply the same rule.
    severity: error
    formats: [oas3]
    given: $
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - required: [security]
            - properties:
                paths:
                  additionalProperties:
                    properties:
                      get: {required: [security]}
                      put: {required: [security]}
                      post: {required: [security]}
                      delete: {required: [security]}
                      patch: {required: [security]}
  axiz-exact-amounts:
    description: >-
      Monetary numbers (amount, *Amount, price, total, balance, fee) declare multipleOf (their
      decimal scale) and maximum, so clients and servers agree on precision and range.
    severity: error
    formats: [oas3]
    given: $..properties[?(@property.match(/^(amount|[a-z]+Amount|price|total|balance|fee)$/) && @.type == 'number')]
    then:
      - field: multipleOf
        function: defined
      - field: maximum
        function: defined
  axiz-closed-objects:
    description: >-
      Object schemas declare additionalProperties, so unknown fields are an explicit decision
      (OWASP API3: mass assignment and excessive data exposure).
    severity: warn
    formats: [oas3]
    given: $.components.schemas[?(@.type == 'object')]
    then:
      field: additionalProperties
      function: defined
  axiz-bounded-strings:
    description: >-
      String properties declare maxLength, an enum, a format or a pattern (OWASP API4: unbounded
      input).
    severity: warn
    formats: [oas3]
    given: $.components.schemas[*].properties[?(@.type == 'string' && !@.enum && !@.format && !@.pattern && !@.const)]
    then:
      field: maxLength
      function: defined
