# Mensajes del framework en inglés. Se mantienen explícitos, y no solo en el bundle raíz: con un locale
# por defecto en español (es-PE) la búsqueda llega al locale por defecto antes que a la raíz, de modo que una
# petición en inglés obtendría español. Mismas claves que messages.properties y messages_es.properties (I18nTest).
error.AXZ-CORE-0001=The request is not valid.
error.AXZ-CORE-0002=Header {header} is missing or invalid.
error.AXZ-CORE-0003=The request body could not be read.
error.AXZ-CORE-0404=The requested resource was not found.
error.AXZ-CORE-0405=The HTTP method is not allowed for this resource.
error.AXZ-CORE-0409=The request conflicts with the current state of the resource.
error.AXZ-CORE-0412=A precondition of the request was not met.
error.AXZ-CORE-0415=The content type is not supported.
error.AXZ-CORE-0500=An unexpected error occurred. Please try again later.
error.AXZ-CORE-0501=This operation is not available.
error.AXZ-CORE-0503=The service is temporarily unavailable.
error.AXZ-SEC-0401=Authentication is required.
error.AXZ-SEC-0403=You are not allowed to perform this operation.
error.AXZ-SEC-0429=Too many requests. Please retry later.
error.AXZ-EXT-0502=A dependent service failed to process the request.
error.AXZ-EXT-0504=A dependent service did not answer in time.
error.AXZ-IDEM-0409=A request with the same Idempotency-Key is still being processed.
