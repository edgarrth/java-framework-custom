# Nightly: one generated service per archetype compiled and tested as a GraalVM native image.
name: native-nightly

on:
  schedule:
    - cron: "17 6 * * *" # 01:17 in Lima
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    uses: axiz/axiz-workflows/.github/workflows/native-nightly.yaml@v1.0.0
    with:
      generate-script: .github/scripts/samples.sh
      modules: >-
        ["target/samples/sample-experience", "target/samples/sample-business",
         "target/samples/sample-process", "target/samples/sample-integration",
         "target/samples/sample-event-processor", "target/samples/sample-batch",
         "target/samples/sample-crud"]
    secrets: inherit
