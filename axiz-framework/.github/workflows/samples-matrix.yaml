# Nightly: every combination the generator offers (archetype x framework x web stack x
# persistence, MODE=all), not only the defaults that the pull request job builds. Each project is
# built with its own wrapper and without any AWS configuration in the environment, as on a laptop
# or a fresh CI runner: a project that needs a region, a profile or credentials just to start its
# tests fails here.
name: samples-matrix

on:
  schedule:
    - cron: "47 6 * * *" # 01:47 in Lima, after native-nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MODE: all
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: axiz/axiz-workflows/actions/setup-maven@v1.0.0
        with:
          nexus-url: ${{ secrets.NEXUS_URL }}
      - name: Install the framework and generate every combination
        run: .github/scripts/samples.sh
      - name: Build every sample without AWS configuration (verify)
        run: |
          failed=()
          for dir in target/samples/*/; do
            echo "::group::${dir}"
            (cd "$dir" && env -u AWS_REGION -u AWS_DEFAULT_REGION -u AWS_PROFILE \
              -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
              AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null \
              ./mvnw -B -ntp verify) || failed+=("$dir")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::samples failed: ${failed[*]}"; exit 1
          fi
