# Build only. The separate deploy.yaml consumes this completed run and its signed manifest;
# failure of any job (including wrapper, samples and API compatibility) prevents promotion.
name: ci

on:
  pull_request:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
    tags: ["v*", "candidate/**"]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: v2.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/axiz/axiz-workflows/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  pr:
    needs: axiz-workflows-trust
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.event_name == 'pull_request') }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/pr.yaml@v2.0.0
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
      AXIZ_NAMING_GUARD: ${{ secrets.AXIZ_NAMING_GUARD }}

  parameters:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate: ${{ steps.version.outputs.candidate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Resolve final coordinates and optional candidate identity
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().findtext("{*}properties/{*}revision"))')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          candidate=
          if [[ "$GITHUB_REF" == refs/tags/candidate/* ]]; then
            candidate=${GITHUB_REF#refs/tags/candidate/}
            [[ "$candidate" =~ ^([0-9]+\.[0-9]+\.[0-9]+)/[1-9][0-9]*$ && "${BASH_REMATCH[1]}" == "$version" ]]
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF#refs/tags/v}" == "$version" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

  build:
    needs: [axiz-workflows-trust, parameters]
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/lib-build.yaml@v2.0.0
    with:
      version: ${{ needs.parameters.outputs.version }}
      source-sha: ${{ github.sha }}
      candidate: ${{ needs.parameters.outputs.candidate }}
      maven-args: '["-Daxiz.it.requireDocker=true"]'
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_READ_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_READ_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  api-compat:
    # Mandatory: explicit first publication or comparison with a genuine published v2 baseline.
    needs: [axiz-workflows-trust, build]
    runs-on: ubuntu-24.04
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/setup-maven@v2.0.0
        with:
          nexus-url: ${{ secrets.NEXUS_URL }}
      - name: Validate the final public API
        run: |
          set -euo pipefail
          mkdir -p target/api-evidence
          mode=$(python3 -c 'import json; print(json.load(open("docs/api/release-policy.json"))["mode"])')
          if [[ "$mode" == first-release ]]; then
            ./mvnw --bootstrap -B -ntp package -DskipTests 2>&1 | tee target/api-evidence/maven.log
          elif [[ "$mode" == published-baseline ]]; then
            baseline=$(python3 -c 'import json; print(json.load(open("docs/api/release-policy.json"))["baseline"])')
            python3 .github/scripts/check-api-compatibility.py --prepare-baseline
            ./mvnw --bootstrap -B -ntp verify -Papi-compat -Daxiz.api.baseline="$baseline" -Daxiz.api.baseline.directory="$PWD/target/api-baseline" -DskipTests 2>&1 | tee target/api-evidence/maven.log
          else
            echo "Unknown API gate mode" >&2
            exit 1
          fi
          python3 .github/scripts/check-api-compatibility.py 2>&1 | tee target/api-evidence/gate.log
      - name: Associate every API outcome with its source
        if: always()
        run: |
          mkdir -p target/api-evidence
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          evidence = Path("target/api-evidence")
          source = {"schema": 1, "commit": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          (evidence / "source.json").write_text(json.dumps(source, indent=2) + "\n")
          if not (evidence / "result.json").is_file():
              (evidence / "result.json").write_text(json.dumps({**source, "passed": False, "error": "API build or validation did not complete"}, indent=2) + "\n")
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: api-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/api-evidence
            target/api-baseline/baseline.json
            **/target/japicmp/*.xml
            docs/api
          retention-days: 90
          if-no-files-found: error

  native-reactive:
    needs: axiz-workflows-trust
    uses: ./.github/workflows/native-reactive.yaml
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_READ_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_READ_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}

  wrapper:
    # the Maven wrapper (also copied into every generated project) verifies the distribution
    # before running it; a release requires the official checksum to be pinned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned framework policy dependencies in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/axiz-framework-python"
          "$RUNNER_TEMP/axiz-framework-python/bin/python" -m pip install \
            --disable-pip-version-check --quiet -r .github/scripts/requirements.txt
          echo "$RUNNER_TEMP/axiz-framework-python/bin" >> "$GITHUB_PATH"
      - name: Wrapper verification scenarios
        run: .github/scripts/test-mvnw.sh
      - name: Build inputs survive a fresh checkout
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_build_inputs.py'
          python3 -m unittest discover -s .github/scripts -p 'test_api_compatibility.py'
          python3 -m unittest discover -s .github/scripts -p 'test_collect_test_evidence.py'
          python3 .github/scripts/check-build-inputs.py .
      - name: Publication consumes only an independent successful build
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_publish_gates.py'
          python3 .github/scripts/check-publish-gates.py .github/workflows/ci.yaml .github/workflows/deploy.yaml
      - name: Framework workflows and native sample selection stay current
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_sample_workflows.py'
          python3 .github/scripts/check-sample-workflows.py
      - name: One version per third-party library, defined once
        run: python3 .github/scripts/check-dependency-governance.py .
      - name: architecture contract module names, parents and closed reactive exceptions
        run: python3 .github/scripts/check-layer-structure.py .
      - name: spring.factories only registers environment post-processors
        run: python3 .github/scripts/check-spring-factories.py .
      - name: Contract rules and response examples (Spectral)
        run: node .github/scripts/test-contracts.cjs
      - name: The aggregated coverage report lists every module with code
        run: python3 .github/scripts/check-coverage-aggregate.py .
      - name: Maven distribution checksum pinned (repository and generated projects)
        run: |
          for f in .mvn/wrapper/maven-wrapper.properties \
                   codegen/axiz-codegen-templates/src/main/resources/axiz/templates/shared/mvn/wrapper/maven-wrapper.properties; do
            grep -q '^distributionSha512Sum=' "$f" || { echo "::error::$f: run ./mvnw --pin-checksum"; exit 1; }
          done

  samples:
    needs: axiz-workflows-trust
    # every archetype generated with its defaults and built with its own wrapper: tests,
    # architecture rules and quality gates of a real team project
    runs-on: ubuntu-24.04
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/setup-maven@v2.0.0
        with:
          nexus-url: ${{ secrets.NEXUS_URL }}
      - name: Install the framework and generate the samples
        run: .github/scripts/samples.sh
      - name: Generated MVC and WebFlux authorization denies missing scopes before application code
        run: bash .github/scripts/authorization-samples.sh
      - name: Generated local infrastructure is repeatable
        run: bash .github/scripts/localstack-init-sample.sh
      - name: Release versions and POM updates of actual generated projects
        run: |
          npm ci --prefix .github/scripts/release-version --no-audit --no-fund --ignore-scripts
          node .github/scripts/release-version/test.cjs target/samples/modules.json
      - name: Build every sample (verify)
        run: |
          failed=()
          for dir in target/samples/*/ target/audit-samples/*/; do
            echo "::group::${dir}"
            (cd "$dir" && ./mvnw -B -ntp spotless:check verify) || failed+=("$dir")
            empty=()
            if [[ "$dir" == target/samples/axiz-sample-library/ ]]; then empty=(--allow-empty); fi
            python3 .github/scripts/collect-test-evidence.py "$dir" "${empty[@]}" \
              --output "$dir/target/test-evidence.json" || failed+=("$dir evidence")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::samples failed: ${failed[*]}"; exit 1
          fi
      - name: Verify packaged web identity support without Kafka
        run: python3 .github/scripts/check-packaged-samples-irsa.py
      - name: Check effective Kafka IAM configuration with consumer Spring runtime
        run: bash .github/scripts/check-sample-kafka-iam.sh
      - name: Preserve complete sample test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-samples-test-evidence
          path: |
            target/samples/**/target/test-evidence.json
            target/audit-samples/**/target/test-evidence.json
            target/generated-packaged-irsa.json
          if-no-files-found: error
          retention-days: 90
