# axiz-framework pipeline (shared axiz workflows):
#   pull request   pr checks + build with every quality gate + generated sample projects
#   develop        the same, then the SNAPSHOT is published to Nexus
#   tag v*         release published to Nexus (tags come from release.yaml)
# Publication is a separate job that needs every gate (build, wrapper, samples) and promotes the
# artifacts the build verified; a failing gate never publishes.
name: ci

on:
  pull_request:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
    tags: ["v*"]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: v1.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/axiz/axiz-workflows/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  pr:
    needs: axiz-workflows-trust
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.event_name == 'pull_request') }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/pr.yaml@v1.0.0
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      AXIZ_NAMING_GUARD: ${{ secrets.AXIZ_NAMING_GUARD }}

  build:
    needs: axiz-workflows-trust
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/lib-publish.yaml@v1.0.0
    with:
      # store contracts against PostgreSQL, Valkey and DynamoDB containers must run, not skip
      maven-args: -Daxiz.it.requireDocker=true
      stage: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    needs: [axiz-workflows-trust, build, wrapper, samples, api-compat]
    # api-compat is skipped until the repository sets AXIZ_API_BASELINE; it never fails silently
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (!cancelled()       && needs.build.result == 'success'       && needs.wrapper.result == 'success'       && needs.samples.result == 'success'       && (needs.api-compat.result == 'success' || needs.api-compat.result == 'skipped')       && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))) }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/lib-promote.yaml@v1.0.0
    # release provenance: attached to the GitHub release, signed with the KMS key (OIDC)
    permissions:
      contents: write
      id-token: write
    secrets:
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}


  api-compat:
    # public API and SPI compatibility with the last release (opt-in before 1.0.0: set the
    # repository variable AXIZ_API_BASELINE to the released version to compare with)
    needs: [axiz-workflows-trust, build]
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (vars.AXIZ_API_BASELINE != '') }}
    runs-on: ubuntu-24.04
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      BASELINE: ${{ vars.AXIZ_API_BASELINE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/setup-maven@v1.0.0
        with:
          nexus-url: ${{ secrets.NEXUS_URL }}
      - name: japicmp against the baseline
        run: ./mvnw -B -ntp verify -DskipTests -Papi-compat -Daxiz.api.baseline="$BASELINE"

  wrapper:
    # the Maven wrapper (also copied into every generated project) verifies the distribution
    # before running it; a release requires the official checksum to be pinned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Wrapper verification scenarios
        run: .github/scripts/test-mvnw.sh
      - name: Publication waits for every gate
        run: python3 .github/scripts/check-publish-gates.py .github/workflows/ci.yaml
      - name: One version per third-party library, defined once
        run: python3 .github/scripts/check-dependency-governance.py .
      - name: spring.factories only registers environment post-processors
        run: python3 .github/scripts/check-spring-factories.py .
      - name: Contract rules and response examples (Spectral)
        run: node .github/scripts/test-contracts.cjs
      - name: The aggregated coverage report lists every module with code
        run: python3 .github/scripts/check-coverage-aggregate.py .
      - name: Release versions of a generated project (release-please calculation)
        run: |
          npm install --prefix .github/scripts/release-version --no-audit --no-fund --ignore-scripts
          node .github/scripts/release-version/test.cjs
      - name: Maven distribution checksum pinned (repository and generated projects)
        run: |
          for f in .mvn/wrapper/maven-wrapper.properties \
                   codegen/axiz-codegen-templates/src/main/resources/axiz/templates/shared/mvn/wrapper/maven-wrapper.properties; do
            grep -q '^distributionSha512Sum=' "$f" || { echo "::error::$f: run ./mvnw --pin-checksum"; exit 1; }
          done

  samples:
    needs: axiz-workflows-trust
    # every archetype generated with its defaults and built with its own wrapper: tests,
    # architecture rules and quality gates of a real team project
    runs-on: ubuntu-24.04
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/setup-maven@v1.0.0
        with:
          nexus-url: ${{ secrets.NEXUS_URL }}
      - name: Install the framework and generate the samples
        run: .github/scripts/samples.sh
      - name: Build every sample (verify)
        run: |
          failed=()
          for dir in target/samples/*/; do
            echo "::group::${dir}"
            (cd "$dir" && ./mvnw -B -ntp verify) || failed+=("$dir")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::samples failed: ${failed[*]}"; exit 1
          fi
