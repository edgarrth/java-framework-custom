# r2dbc-proxy inicializa todo su paquete en tiempo de build. Su listener de observación crea un
# logger de Micrometer, cuyo backend pertenece a la aplicación en ejecución. Ese listener se mantiene en
# tiempo de ejecución en lugar de congelar el estado del logging (o la configuración de la aplicación) en la imagen nativa.
Args = --initialize-at-run-time=io.r2dbc.proxy.observation.ObservationProxyExecutionListener
