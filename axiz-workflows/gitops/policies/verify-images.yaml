# Admission policy: the registry prefix must match BUILD_REGISTRY's build namespace.
# Images require keyless signatures and SLSA provenance from the exact immutable service-build
# release. Keep the subject and builder version aligned when adopting a new workflow release.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: axiz-verify-images
  annotations:
    policies.kyverno.io/title: Signed axiz images
    policies.kyverno.io/description: Only images signed by the axiz CI run in the service namespaces.
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 15
  background: false
  rules:
    - name: signed-by-axiz-ci
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [axiz-dev, axiz-qa, axiz-prod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/axiz/builds/*"
          mutateDigest: false
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    subject: https://github.com/axiz/axiz-workflows/.github/workflows/service-build.yaml@refs/tags/v2.0.0 # x-release-please-version
                    issuer: https://token.actions.githubusercontent.com
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        subject: https://github.com/axiz/axiz-workflows/.github/workflows/service-build.yaml@refs/tags/v2.0.0 # x-release-please-version
                        issuer: https://token.actions.githubusercontent.com
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ runDetails.builder.id }}"
                      operator: Equals
                      value: https://github.com/axiz/axiz-workflows/.github/workflows/service-build.yaml@refs/tags/v2.0.0 # x-release-please-version
    - name: only-build-registry
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [axiz-dev, axiz-qa, axiz-prod]
      validate:
        message: Images must come from the approved build registry and use a content digest.
        pattern:
          spec:
            containers:
              - image: "ghcr.io/axiz/builds/*@sha256:*"
