name: lib-build
on:
  workflow_call:
    inputs:
      version:
        description: Final Maven release coordinate, including for candidates
        type: string
        required: true
      source-sha:
        description: Full commit equal to the producer run commit
        type: string
        required: true
      candidate:
        description: Optional readable final-version/attempt label
        type: string
        default: ''
      maven-args:
        description: JSON array of allowlisted public Maven properties
        type: string
        default: '[]'
      axiz-version:
        description: Framework dependency version for tools; omit for the framework itself
        type: string
        default: ''
      native-module:
        description: Optional module with signed native components built earlier in this producer run
        type: string
        default: ''
      native-binary:
        type: string
        default: ''
      native-platforms:
        description: JSON array of required native targets; empty for JVM-only builds
        type: string
        default: '[]'
      candidate-repository:
        description: Producer repository of the framework candidate consumed by tools
        type: string
        default: ''
      candidate-build-run-id:
        type: string
        default: ''
      candidate-build-run-attempt:
        type: string
        default: ''
      candidate-manifest-sha256:
        type: string
        default: ''
      runner:
        type: string
        default: ubuntu-24.04
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN:
        required: false
      NEXUS_URL:
        required: true
      NEXUS_READ_USERNAME:
        required: true
      NEXUS_READ_PASSWORD:
        required: true
      CANDIDATE_READ_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      SONAR_TOKEN:
        required: false
    outputs:
      manifest-sha256:
        description: External build identity for independent promotion
        value: ${{ jobs.build.outputs.manifest-sha256 }}
      build-run-id:
        description: Producer run
        value: ${{ github.run_id }}
      build-run-attempt:
        description: Producer attempt
        value: ${{ github.run_attempt }}

permissions:
  contents: read
  id-token: write

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: v2.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/axiz/axiz-workflows/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  build:
    needs: axiz-workflows-trust
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    outputs:
      manifest-sha256: ${{ steps.bundle.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/consume-build@v2.0.0 # x-release-please-version
        id: candidate
        if: inputs.candidate-manifest-sha256 != '' || inputs.candidate-repository != '' || inputs.candidate-build-run-id != '' || inputs.candidate-build-run-attempt != ''
        with:
          repository: ${{ inputs.candidate-repository }}
          build-run-id: ${{ inputs.candidate-build-run-id }}
          build-run-attempt: ${{ inputs.candidate-build-run-attempt }}
          manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
          kind: maven-library
          token: ${{ secrets.CANDIDATE_READ_TOKEN || github.token }}
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/build-inputs@v2.0.0 # x-release-please-version
        id: inputs
        with:
          version: ${{ inputs.version }}
          source-sha: ${{ inputs.source-sha }}
          candidate: ${{ inputs.candidate }}
          native-module: ${{ inputs.native-module }}
          native-binary: ${{ inputs.native-binary }}
          native-platforms: ${{ inputs.native-platforms }}
          maven-args: ${{ inputs.maven-args }}
          axiz-version: ${{ inputs.axiz-version }}
          token: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          candidate-bundle: ${{ steps.candidate.outputs.bundle-path }}
          candidate-manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/setup-maven@v2.0.0 # x-release-please-version
        with:
          nexus-url: ${{ secrets.NEXUS_URL }}
          candidate-bundle: ${{ steps.candidate.outputs.bundle-path }}
          candidate-manifest-sha256: ${{ inputs.candidate-manifest-sha256 }}
          candidate-source-repository: ${{ inputs.candidate-repository }}
      - name: Compile, test, quality, mutation and local Maven staging
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
          VERSION: ${{ inputs.version }}
          ARGUMENTS: ${{ steps.inputs.outputs.arguments }}
          PYTHON: ${{ steps.inputs.outputs.python }}
          TOOLS: ${{ steps.inputs.outputs.tools }}
        run: |
          set -euo pipefail
          mkdir -p target/build-reports
          "$PYTHON" "$TOOLS/maven_version.py" --version "$VERSION" 2>&1 | tee target/build-reports/coordinates.log
          mapfile -d '' -t extra < "$ARGUMENTS"
          maven=mvn
          if [[ -x ./mvnw ]]; then maven=./mvnw; fi
          bootstrap=()
          if [[ -f platform/axiz-dependencies/pom.xml && -f platform/axiz-bom/pom.xml ]]; then
            [[ "$maven" == ./mvnw ]]
            bootstrap=(--bootstrap)
          fi
          "$maven" "${bootstrap[@]}" -B -ntp deploy -Pquality,release "${extra[@]}" \
            "-DaltDeploymentRepository=staging::file://$GITHUB_WORKSPACE/target/staging-repo" \
            2>&1 | tee target/build-reports/verify.log
      - name: Verify mutation workers and encapsulation
        env:
          TOOLS: ${{ steps.inputs.outputs.tools }}
        run: |
          set -euo pipefail
          python3 "$TOOLS/../check-mutations/check_mutations.py" . 2>&1 | tee target/build-reports/mutation.log
          python3 "$TOOLS/../check-encapsulation/check_encapsulation.py" . 2>&1 | tee target/build-reports/encapsulation.log
      - name: Sonar quality gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$SONAR_TOKEN" ]]; then
            mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
              "-Drevision=$VERSION" "-Dsonar.host.url=$SONAR_HOST_URL" -Dsonar.qualitygate.wait=true
          fi
      - name: SBOM of the complete staged reactor
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_READ_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_READ_PASSWORD }}
          VERSION: ${{ inputs.version }}
          TOOLS: ${{ steps.inputs.outputs.tools }}
        run: |
          set -euo pipefail
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom \
            "-Drevision=$VERSION" -DoutputFormat=json -Dcyclonedx.skipNotDeployed=false
          python3 "$TOOLS/../check-sbom/check_sbom.py" target/bom.json pom.xml
          cp target/bom.json target/build-reports/bom.json
      - name: Scan the dependency inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/build-reports/bom.json
          format: json
          output: target/build-reports/scan.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: inputs.native-module != ''
        with:
          pattern: native-component-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/native-components
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Verify and bind native components to the Maven product
        if: inputs.native-module != ''
        env:
          PYTHON: ${{ steps.inputs.outputs.python }}
          TOOLS: ${{ steps.inputs.outputs.tools }}
          METADATA: ${{ steps.inputs.outputs.metadata }}
          COMPONENTS: ${{ runner.temp }}/native-components
        run: |
          set -euo pipefail
          "$PYTHON" "$TOOLS/native_components.py" merge --metadata "$METADATA" --components "$COMPONENTS" \
            --staging target/staging-repo --reports target/build-reports
      - name: Record exact artifacts, evidence and parameters
        id: bundle
        env:
          PYTHON: ${{ steps.inputs.outputs.python }}
          TOOLS: ${{ steps.inputs.outputs.tools }}
          METADATA: ${{ steps.inputs.outputs.metadata }}
        run: |
          set -euo pipefail
          "$PYTHON" "$TOOLS/build_bundle.py" --metadata "$METADATA" --staging target/staging-repo \
            --reports target/build-reports --bundle target/build-bundle --complete
      - name: Sign the immutable build identity
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle target/build-bundle/build-manifest.sigstore.json \
            target/build-bundle/build-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-bundle-${{ steps.bundle.outputs.manifest-sha256 }}
          path: target/build-bundle
          retention-days: 90
          if-no-files-found: error
      - name: Trusted build output for later approval
        env:
          HASH: ${{ steps.bundle.outputs.manifest-sha256 }}
        run: |
          {
            echo '### Maven build available for independent promotion'
            echo "Run: $GITHUB_RUN_ID, attempt: $GITHUB_RUN_ATTEMPT"
            echo "Manifest SHA-256: $HASH"
          } >> "$GITHUB_STEP_SUMMARY"
