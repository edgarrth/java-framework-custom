# Infrastructure of a service with Terraform: MSK topics, SQS queues, SNS topics, DynamoDB tables,
# S3 buckets, parameters and secret definitions (never their values). Plan on the pull request,
# apply on merge with the approval of the environment.
name: infra
on:
  workflow_call:
    inputs:
      directory:
        description: Terraform root module (per environment, e.g. infra/envs/dev)
        type: string
        required: true
      environment:
        type: string
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-${{ inputs.directory }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'pull_request' && format('{0}-plan', inputs.environment) || inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.3
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - name: Static analysis (tfsec rules in Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.directory }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - run: terraform plan -input=false -out=tfplan -lock-timeout=5m
      - name: Plan in the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terraform show -no-color tfplan | tail -c 60000 > plan.txt
          { echo "### Terraform plan (${{ inputs.environment }})"; echo '```'; cat plan.txt; echo '```'; } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md --edit-last || \
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
      - name: Apply (after merge; the environment requires approval)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan
