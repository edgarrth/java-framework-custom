# Libraries, starters and tools: build with every quality gate on each change, publish to Nexus
# when asked. Branch rules (section "Branches" of the README): develop publishes SNAPSHOTs, tags
# v<x.y.z> created by the release workflow publish immutable versions, work branches never publish.
#
# Publication promotes the artifacts this build verified (never a rebuild): with "stage" the same
# Maven run that passes every gate deploys into a local staging repository, uploaded with its
# SHA-256 manifest only when every step of the job succeeded. "publish: true" promotes it right
# after this job; callers with more gates (samples, wrapper, images) set "stage: true" and call
# lib-promote.yaml from a job that "needs" all of them, so a failing gate never publishes.
name: lib-publish
on:
  workflow_call:
    inputs:
      publish:
        description: Promote the verified artifacts to Nexus right after this workflow's checks
        type: boolean
        default: false
      stage:
        description: Keep the verified artifacts (staging repository) for a later lib-promote job
        type: boolean
        default: false
      maven-args:
        description: Extra Maven arguments
        type: string
        default: ""
      runner:
        description: Runner label (e.g. an Actions Runner Controller scale set inside EKS)
        type: string
        default: ubuntu-24.04
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN:
        description: Read-only token for private immutable release verification (optional for public repositories)
        required: false
      NEXUS_URL:
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true
      SONAR_HOST_URL:
        required: false
      SONAR_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: v1.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/axiz/axiz-workflows/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  verify:
    needs: axiz-workflows-trust
    runs-on: ${{ inputs.runner }}
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      EXTRA_ARGS: ${{ inputs.maven-args }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/setup-maven@v1.0.0 # x-release-please-version
        with:
          nexus-url: ${{ secrets.NEXUS_URL }}
      - name: Version (tag v<x.y.z> = release, otherwise the SNAPSHOT of the pom)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "REVISION_ARG=-Drevision=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "REVISION_ARG=" >> "$GITHUB_ENV"
          fi
      - name: Build, standards, tests, coverage and mutation testing
        env:
          STAGE: ${{ inputs.stage || inputs.publish }}
        run: |
          if [ "$STAGE" = "true" ]; then
            # one run: every gate passes before each module is deployed to the local staging repo
            # shellcheck disable=SC2086 # Maven arguments are split on purpose
            mvn -B -ntp deploy -Pquality,release $REVISION_ARG $EXTRA_ARGS \
              -DaltDeploymentRepository="staging::file://$GITHUB_WORKSPACE/target/staging-repo"
          else
            # shellcheck disable=SC2086 # Maven arguments are split on purpose
            mvn -B -ntp verify -Pquality $REVISION_ARG $EXTRA_ARGS
          fi
      - name: Test results of this commit (job summary)
        if: always()
        # Immutable internal release: axiz-workflows-trust must succeed first.
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: axiz/axiz-workflows/actions/test-report@v1.0.0 # x-release-please-version
        with:
          command: mvn -B -ntp verify -Pquality (deploy -Pquality,release when staging) ${{ inputs.maven-args }}
      - name: Mutation workers completed without errors
        # Immutable internal release: axiz-workflows-trust must succeed first.
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: axiz/axiz-workflows/actions/check-mutations@v1.0.0 # x-release-please-version
      - name: Encapsulation regression gate
        # Immutable internal release: axiz-workflows-trust must succeed first.
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: axiz/axiz-workflows/actions/check-encapsulation@v1.0.0 # x-release-please-version
      - name: SonarQube analysis (when the organization defines SONAR_TOKEN)
        if: env.SONAR_TOKEN != ''
        run: |
          # shellcheck disable=SC2086 # arguments are split on purpose
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.qualitygate.wait=true $REVISION_ARG $EXTRA_ARGS
      - name: OpenRewrite static analysis (report only, pull requests)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086 # arguments are split on purpose
          mvn -B -ntp org.openrewrite.maven:rewrite-maven-plugin:6.49.0:dryRun $REVISION_ARG $EXTRA_ARGS \
            -Drewrite.recipeArtifactCoordinates=org.openrewrite.recipe:rewrite-static-analysis:2.43.0 \
            -Drewrite.activeRecipes=org.openrewrite.staticanalysis.CommonStaticAnalysis \
            -Drewrite.failOnDryRunResults=false
          find . -path '*/target/rewrite/rewrite.patch' -exec cat {} + > rewrite.patch
          if [ -s rewrite.patch ]; then
            echo "### OpenRewrite suggestions: $(grep -c '^diff --git' rewrite.patch) files (artifact reports/rewrite.patch)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: SBOM (CycloneDX)
        run: |
          # shellcheck disable=SC2086 # Maven arguments are split on purpose
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json -Dcyclonedx.skipNotDeployed=false $REVISION_ARG
      - name: Require the aggregate inventory before scanning
        # Immutable internal release: axiz-workflows-trust must succeed first.
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: axiz/axiz-workflows/actions/check-sbom@v1.0.0 # x-release-please-version
      - name: Vulnerability scan of the dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/bom.json
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
            **/target/site/jacoco*
            rewrite.patch
            **/target/pit-reports
            target/bom.json
      - name: Stage the verified artifacts (all gates passed)
        if: inputs.stage || inputs.publish
        run: |
          cd target/staging-repo
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          echo "Staged $(wc -l < SHA256SUMS) files for commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.stage || inputs.publish
        with:
          name: staging-repo
          path: target/staging-repo
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [axiz-workflows-trust, verify]
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (inputs.publish) }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/lib-promote.yaml@v1.0.0 # x-release-please-version
    secrets:
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
