# Checks shared by every pull request of any axiz repository: Conventional Commits title, secret
# scanning, dependency review, static security analysis (Semgrep), filesystem scan (Trivy) and the
# repository's own workflows (actionlint). Build, tests and quality gates run in lib-publish or
# service-ci, which callers also trigger on pull requests.
name: pr
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label (e.g. an Actions Runner Controller scale set inside EKS)
        type: string
        default: ubuntu-24.04
      semgrep-config:
        description: Semgrep rule sets, separated by spaces
        type: string
        default: p/java p/owasp-top-ten p/secrets
      fail-severity:
        description: Lowest vulnerability severity that fails the check
        type: string
        default: high
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN:
        description: Read-only token for private immutable release verification
        required: false
      NEXUS_URL:
        required: false
      NEXUS_USERNAME:
        required: false
      NEXUS_PASSWORD:
        required: false
      AXIZ_NAMING_GUARD:
        description: Forbidden identifiers, one extended regex per line (kept outside every repository)
        required: false

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: v2.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/axiz/axiz-workflows/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null


  hygiene:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional title (feat, fix, docs, refactor, test, build, ci, chore, perf, revert)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|build|ci|chore|perf|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::PR title must follow Conventional Commits"; exit 1; }
      - name: Secret scanning (gitleaks, commits of the pull request)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          config=()
          [ -f .gitleaks.toml ] && config=(--config /repo/.gitleaks.toml)
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo "${config[@]}" --log-opts="$BASE..$HEAD" --redact --verbose
      - name: Naming guard (identifiers that must never appear in axiz code)
        # the forbidden names live in an organization secret, so the repositories never contain them
        env:
          PATTERNS: ${{ secrets.AXIZ_NAMING_GUARD }}
          OPTIONAL: ${{ vars.AXIZ_NAMING_GUARD_OPTIONAL }}
        run: |
          if [ -z "$PATTERNS" ]; then
            if [ "$OPTIONAL" = "true" ]; then echo "::warning::AXIZ_NAMING_GUARD not defined: skipped"; exit 0; fi
            echo "::error::define the organization secret AXIZ_NAMING_GUARD (one extended regex per line)"; exit 1
          fi
          printf '%s\n' "$PATTERNS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/guard.txt"
          if git grep -I -n -i -E -f "$RUNNER_TEMP/guard.txt" -- . ':!*.lock' > "$RUNNER_TEMP/hits.txt"; then
            echo "::error::forbidden identifiers found (patterns are not printed)"
            cut -d: -f1,2 "$RUNNER_TEMP/hits.txt"
            exit 1
          fi
      - name: Release versions consistent (version.txt, release-please manifest and pom)
        shell: python3 {0}
        run: |
          import json, os, re, sys
          def ver(v): return tuple(int(x) for x in v.split('.'))
          bad = 0
          for dirpath, dirnames, files in os.walk('.'):
              dirnames[:] = [d for d in dirnames if d not in ('target', '.git', 'node_modules', 'templates')]
              if 'version.txt' not in files or '.release-please-manifest.json' not in files:
                  continue
              v = open(os.path.join(dirpath, 'version.txt')).read().strip()
              m = json.load(open(os.path.join(dirpath, '.release-please-manifest.json'))).get('.')
              if m != v:
                  print(f'::error::{dirpath}: version.txt {v} but .release-please-manifest.json {m}'); bad += 1
              pom = os.path.join(dirpath, 'pom.xml')
              if os.path.isfile(pom):
                  text = re.sub(r'<parent>.*?</parent>', '', open(pom).read(), flags=re.S)
                  pv = re.search(r'<revision>([^<]+)</revision>', text) or re.search(r'<version>([^<$]+)</version>', text)
                  if pv and re.fullmatch(r'\d+\.\d+\.\d+(-SNAPSHOT)?', pv.group(1)):
                      if ver(pv.group(1).replace('-SNAPSHOT', '')) < ver(v):
                          print(f'::error::{dirpath}: pom version {pv.group(1)} is behind the released {v}'); bad += 1
          sys.exit(1 if bad else 0)
      - name: Dependency review (licenses and known vulnerabilities)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: ${{ inputs.fail-severity }}
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  security:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: axiz Semgrep rules (from axiz-code-standards in Nexus)
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [ -z "$NEXUS_URL" ]; then echo "NEXUS_URL not available: public rule sets only"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/axiz"
          curl -fsSL -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            "$NEXUS_URL/service/rest/v1/search/assets/download?repository=maven-public&group=pe.axiz&name=axiz-code-standards&sort=version&maven.extension=jar" \
            -o "$RUNNER_TEMP/axiz/standards.jar"
          unzip -o -q "$RUNNER_TEMP/axiz/standards.jar" 'axiz/semgrep/*' -d "$RUNNER_TEMP/axiz"
      - name: Static security analysis (Semgrep, public rule sets and axiz rules)
        env:
          CONFIG: ${{ inputs.semgrep-config }}
        run: |
          python -m pip install --quiet semgrep==1.180.0
          args=()
          for c in $CONFIG; do args+=(--config "$c"); done
          rules="$RUNNER_TEMP/axiz/axiz/semgrep/axiz-rules.yaml"
          [ -f "$rules" ] && args+=(--config "$rules")
          [ -f .semgrep.yml ] && args+=(--config .semgrep.yml)
          semgrep scan "${args[@]}" --error --metrics=off --sarif --output semgrep.sarif \
            --exclude 'target' --exclude '**/src/test/**'
      - name: Filesystem scan (Trivy, vulnerabilities, secrets and misconfigurations)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: "1"
      - name: Results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: .
          category: axiz-pr

  workflows:
    needs: axiz-workflows-trust
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/check-workflow-security@v2.0.0 # x-release-please-version
      - name: actionlint (workflows of the repository)
        run: |
          if ls .github/workflows/*.y*ml > /dev/null 2>&1; then
            # pinned version and SHA-256 (from the release checksums file): verified before running it
            curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
            echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
            tar xzf actionlint.tar.gz actionlint
            ./actionlint -color
          fi
