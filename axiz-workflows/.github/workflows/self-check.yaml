# Checks this repository: workflow and action syntax (actionlint with shellcheck), third-party
# actions pinned by commit, Renovate presets and the GitOps references.
name: self-check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          # pinned version and SHA-256 (from the release checksums file): verified before running it
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: Workflow security policy and regression scenarios
        run: |
          python3 -m venv "$RUNNER_TEMP/axiz-workflow-policy"
          "$RUNNER_TEMP/axiz-workflow-policy/bin/pip" install --quiet PyYAML==6.0.3
          "$RUNNER_TEMP/axiz-workflow-policy/bin/python" -m unittest discover -s actions/check-workflow-security -p 'test_*.py'
          "$RUNNER_TEMP/axiz-workflow-policy/bin/python" actions/check-workflow-security/check_workflow_security.py .
          "$RUNNER_TEMP/axiz-workflow-policy/bin/python" actions/check-workflow-security/check_pipeline_contracts.py \
            --build .github/workflows/lib-build.yaml --deploy .github/workflows/lib-deploy.yaml
          "$RUNNER_TEMP/axiz-workflow-policy/bin/python" actions/check-workflow-security/check_pipeline_contracts.py \
            --build .github/workflows/service-build.yaml --deploy .github/workflows/service-deploy.yaml
      - name: Build manifest schemas and integrity regression
        run: |
          python3 -m venv "$RUNNER_TEMP/axiz-manifests"
          "$RUNNER_TEMP/axiz-manifests/bin/pip" install --quiet -r actions/build-manifest/requirements.txt
          "$RUNNER_TEMP/axiz-manifests/bin/python" -m unittest discover -s actions/build-manifest -p 'test_*.py'
          "$RUNNER_TEMP/axiz-manifests/bin/python" -m unittest discover -s actions/setup-maven -p 'test_*.py'
      - name: Encapsulation gate regression scenarios
        run: python3 -m unittest discover -s actions/check-encapsulation -p 'test_*.py'
      - name: SBOM validation regression
        run: python3 -m unittest discover -s actions/check-sbom -p 'test_*.py'
      - name: Mutation process validation regression
        run: python3 -m unittest discover -s actions/check-mutations -p 'test_*.py'
      - name: Third-party actions pinned by commit SHA
        run: |
          unpinned=$(grep -rnE 'uses: [^ ]+@' .github/workflows actions \
            | grep -v 'uses: axiz/axiz-workflows/' | grep -vE '@[0-9a-f]{40}( |$)' || true)
          [ -z "$unpinned" ] || { echo "::error::actions must be pinned by commit SHA"; echo "$unpinned"; exit 1; }
      - name: References to this repository use the release version (no moving tags)
        run: |
          version="v$(tr -d '[:space:]' < version.txt)"
          bad=$(grep -rnE 'uses: axiz/axiz-workflows/[^ ]+@' .github/workflows actions \
            | grep -vE "@${version} # x-release-please-version\$" || true)
          [ -z "$bad" ] || { echo "::error::internal references must be @${version} # x-release-please-version"; echo "$bad"; exit 1; }
      - name: Renovate presets
        run: npx --yes --package renovate@41 -- renovate-config-validator renovate/*.json
      - name: GitOps references (schemas of Argo CD and Kyverno resources)
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/
