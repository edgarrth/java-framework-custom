# Releases of this repository: release-please creates v<x.y.z> and moves the major tag (v1) that
# every caller pins, so fixes reach all repositories while breaking changes need v2.
name: release-self
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release.yaml
    with:
      move-major-tag: true
    secrets: inherit
