# Services: build and quality gates, contract checks, chart checks and, on main or a tag, the image
# (Jib; also native when asked) pushed to the Nexus Docker registry, scanned, signed with cosign
# (key in AWS KMS) and with its SBOM attested. Called by every generated service
# (.github/workflows/ci.yaml) with an explicit map of its declared secrets.
name: service-ci
on:
  workflow_call:
    inputs:
      service:
        description: Service name (image and chart release)
        type: string
        required: true
      module:
        description: Maven module of the service in a multi-module repository
        type: string
        default: ""
      openapi:
        description: OpenAPI contract (lint and breaking-change check)
        type: string
        default: ""
      asyncapi:
        description: AsyncAPI contract (lint)
        type: string
        default: ""
      chart:
        description: Helm chart directory
        type: string
        default: ""
      native:
        description: Also build, test and publish the native image
        type: boolean
        default: false
      runner:
        description: Runner label (e.g. an Actions Runner Controller scale set inside EKS)
        type: string
        default: ubuntu-24.04
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN:
        description: Read-only token for private immutable release verification (optional for public repositories)
        required: false
      NEXUS_URL:
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true
      NEXUS_DOCKER_REGISTRY:
        required: false
      SONAR_HOST_URL:
        required: false
      SONAR_TOKEN:
        required: false
    outputs:
      image-tag:
        description: Immutable tag of the published image (the commit)
        value: ${{ jobs.image.outputs.tag }}
      image-digest:
        description: Digest of the published JVM image
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  MODULE_ARGS: ${{ inputs.module != '' && format('-pl {0} -am', inputs.module) || '' }}
  MODULE_DIR: ${{ inputs.module != '' && inputs.module || '.' }}

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: v1.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/axiz/axiz-workflows/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  build:
    needs: axiz-workflows-trust
    runs-on: ${{ inputs.runner }}
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/setup-maven@v1.0.0 # x-release-please-version
        with:
          nexus-url: ${{ secrets.NEXUS_URL }}
      - name: Build, standards (Spotless, Checkstyle, Error Prone + NullAway, SpotBugs), ArchUnit, tests, coverage
        run: |
          # shellcheck disable=SC2086 # Maven arguments are split on purpose
          mvn -B -ntp verify -Pquality $MODULE_ARGS
      - name: Test results of this commit (job summary)
        if: always()
        # Immutable internal release: axiz-workflows-trust must succeed first.
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: axiz/axiz-workflows/actions/test-report@v1.0.0 # x-release-please-version
        with:
          command: mvn -B -ntp verify -Pquality ${{ env.MODULE_ARGS }}
      - name: SonarQube analysis (when the organization defines SONAR_TOKEN)
        if: env.SONAR_TOKEN != ''
        run: |
          # shellcheck disable=SC2086 # arguments are split on purpose
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar $MODULE_ARGS \
            -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.qualitygate.wait=true
      - name: OpenRewrite static analysis (report only, pull requests)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086 # arguments are split on purpose
          mvn -B -ntp org.openrewrite.maven:rewrite-maven-plugin:6.49.0:dryRun $MODULE_ARGS \
            -Drewrite.recipeArtifactCoordinates=org.openrewrite.recipe:rewrite-static-analysis:2.43.0 \
            -Drewrite.activeRecipes=org.openrewrite.staticanalysis.CommonStaticAnalysis \
            -Drewrite.failOnDryRunResults=false
          find . -path '*/target/rewrite/rewrite.patch' -exec cat {} + > rewrite.patch
          if [ -s rewrite.patch ]; then
            echo "### OpenRewrite suggestions: $(grep -c '^diff --git' rewrite.patch) files (artifact reports/rewrite.patch)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mutation workers completed without errors
        # Immutable internal release: axiz-workflows-trust must succeed first.
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: axiz/axiz-workflows/actions/check-mutations@v1.0.0 # x-release-please-version
      - name: Encapsulation regression gate
        # Immutable internal release: axiz-workflows-trust must succeed first.
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: axiz/axiz-workflows/actions/check-encapsulation@v1.0.0 # x-release-please-version
      - name: SBOM (CycloneDX)
        run: |
          # shellcheck disable=SC2086 # Maven arguments are split on purpose
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json -Dcyclonedx.skipNotDeployed=false $MODULE_ARGS
      - name: Vulnerabilities, secrets and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
            **/target/site/jacoco*
            rewrite.patch
            **/target/bom.json

  contract:
    if: inputs.openapi != '' || inputs.asyncapi != ''
    runs-on: ${{ inputs.runner }}
    env:
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      OPENAPI: ${{ inputs.openapi }}
      ASYNCAPI: ${{ inputs.asyncapi }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: axiz rulesets (from axiz-code-standards)
        run: |
          mkdir -p .axiz-ci
          curl -fsSL -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            "$NEXUS_URL/service/rest/v1/search/assets/download?repository=maven-public&group=pe.axiz&name=axiz-code-standards&sort=version&maven.extension=jar" \
            -o .axiz-ci/standards.jar
          unzip -o -q .axiz-ci/standards.jar 'axiz/spectral/*' -d .axiz-ci
      - name: Lint OpenAPI (Spectral, axiz ruleset)
        if: inputs.openapi != ''
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint -r .axiz-ci/axiz/spectral/axiz-openapi.yaml "$OPENAPI" --fail-severity error
      - name: Lint AsyncAPI (Spectral)
        if: inputs.asyncapi != ''
        run: |
          ruleset=.axiz-ci/axiz/spectral/axiz-asyncapi.yaml
          [ -f "$ruleset" ] || { echo 'extends: ["spectral:asyncapi"]' > .axiz-ci/asyncapi.yaml; ruleset=.axiz-ci/asyncapi.yaml; }
          npx --yes @stoplight/spectral-cli@6.15.0 lint -r "$ruleset" "$ASYNCAPI" --fail-severity error
      - name: Breaking changes against the target branch
        if: github.event_name == 'pull_request' && inputs.openapi != ''
        uses: oasdiff/oasdiff-action/breaking@1c611ffb1253a72924624aa4fb662e302b3565d3 # v0.0.21
        with:
          base: origin/${{ github.base_ref }}:${{ inputs.openapi }}
          revision: HEAD:${{ inputs.openapi }}
          fail-on: ERR

  chart:
    if: inputs.chart != ''
    runs-on: ${{ inputs.runner }}
    env:
      CHART: ${{ inputs.chart }}
      SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: helm lint, schema validation (kubeconform) and best practices (kube-linter) per environment
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          curl -fsSL -o kube-linter.tar.gz https://github.com/stackrox/kube-linter/releases/download/v0.7.6/kube-linter-linux.tar.gz
          echo "cb6128997162b8b7e6962284313635643434421b4e9b4f86545af7a4976e0139  kube-linter.tar.gz" | sha256sum -c -
          tar xzf kube-linter.tar.gz kube-linter
          for values in "$CHART"/values-*.yaml; do
            echo "::group::$values"
            helm lint "$CHART" -f "$CHART/values.yaml" -f "$values"
            helm template "$SERVICE" "$CHART" -f "$CHART/values.yaml" -f "$values" > rendered.yaml
            ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 rendered.yaml
            config=()
            [ -f "$CHART/.kube-linter.yaml" ] && config=(--config "$CHART/.kube-linter.yaml")
            ./kube-linter lint "${config[@]}" rendered.yaml
            echo "::endgroup::"
          done

  native:
    needs: axiz-workflows-trust
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (inputs.native) }}
    runs-on: ${{ inputs.runner }}
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/setup-maven@v1.0.0 # x-release-please-version
        with:
          distribution: graalvm
          nexus-url: ${{ secrets.NEXUS_URL }}
      - name: Native image and native tests
        run: |
          # shellcheck disable=SC2086 # Maven arguments are split on purpose
          mvn -B -ntp -Pnative package native:compile native:test $MODULE_ARGS

  image:
    needs: [axiz-workflows-trust, build]
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ${{ inputs.runner }}
    outputs:
      tag: ${{ github.sha }}
      digest: ${{ steps.jvm.outputs.digest }}
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      REGISTRY: ${{ secrets.NEXUS_DOCKER_REGISTRY }}
      SERVICE: ${{ inputs.service }}
      SIGNING_KEY: ${{ vars.COSIGN_KMS_KEY }}
      SIGNING_ROLE: ${{ vars.COSIGN_ROLE_ARN }}
      SIGNING_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Signing is mandatory
        # an unsigned image is rejected by the cluster admission policy anyway: fail here, before
        # publishing it. Only a sandbox repository may opt out (variable AXIZ_ALLOW_UNSIGNED_IMAGES),
        # never for a release tag.
        env:
          ALLOW_UNSIGNED: ${{ vars.AXIZ_ALLOW_UNSIGNED_IMAGES }}
        run: |
          echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"   # build start, for the provenance
          if [ -n "$SIGNING_KEY" ] && [ -n "$SIGNING_ROLE" ] && [ -n "$SIGNING_REGION" ]; then exit 0; fi
          missing="COSIGN_KMS_KEY, COSIGN_ROLE_ARN and AWS_REGION (organization variables)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::release images must be signed: define $missing"; exit 1
          fi
          if [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "::warning::unsigned image (AXIZ_ALLOW_UNSIGNED_IMAGES=true): it can only run where no admission policy verifies signatures"
            exit 0
          fi
          echo "::error::images must be signed: define $missing"; exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Immutable internal release: axiz-workflows-trust must succeed first.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: axiz/axiz-workflows/actions/setup-maven@v1.0.0 # x-release-please-version
        with:
          distribution: ${{ inputs.native && 'graalvm' || 'temurin' }}
          nexus-url: ${{ secrets.NEXUS_URL }}
      - name: Base images pinned by digest (required for a release)
        run: |
          for prop in axiz.image.base axiz.image.native-base; do
            image=$(mvn -B -ntp -q -f "$MODULE_DIR/pom.xml" help:evaluate -Dexpression="$prop" -DforceStdout)
            if [[ "$image" != *@sha256:* ]]; then
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                echo "::error::$prop=$image: a release image needs a base pinned by digest (Renovate pins it)"; exit 1
              fi
              echo "::warning::$prop=$image is not pinned by digest"
            fi
          done
      - name: JVM image (Jib, non-root), immutable tag = commit
        id: jvm
        run: |
          # shellcheck disable=SC2086 # arguments are split on purpose
          mvn -B -ntp package jib:build -DskipTests $MODULE_ARGS \
            -Daxiz.image.registry="$REGISTRY" -Daxiz.image.tag="$GITHUB_SHA" \
            -Djib.to.auth.username="$NEXUS_USERNAME" -Djib.to.auth.password="$NEXUS_PASSWORD"
          echo "digest=$(cat "$MODULE_DIR/target/jib-image.digest")" >> "$GITHUB_OUTPUT"
      - name: Native image (GraalVM + Jib native extension), tag = commit-native
        id: native
        if: inputs.native
        run: |
          # shellcheck disable=SC2086 # arguments are split on purpose
          mvn -B -ntp -Pnative package native:compile jib:build -DskipTests $MODULE_ARGS \
            -Daxiz.image.registry="$REGISTRY" -Daxiz.image.tag="$GITHUB_SHA" \
            -Djib.to.auth.username="$NEXUS_USERNAME" -Djib.to.auth.password="$NEXUS_PASSWORD"
          echo "digest=$(cat "$MODULE_DIR/target/jib-image.digest")" >> "$GITHUB_OUTPUT"
      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.NEXUS_DOCKER_REGISTRY }}/axiz/${{ inputs.service }}@${{ steps.jvm.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      - name: AWS credentials for the signing key (OIDC)
        if: env.SIGNING_KEY != ''
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.COSIGN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: env.SIGNING_KEY != ''
      - name: Sign the images, attest the SBOM and the SLSA build provenance (cosign, key in AWS KMS)
        if: env.SIGNING_KEY != ''
        env:
          JVM_DIGEST: ${{ steps.jvm.outputs.digest }}
          NATIVE_DIGEST: ${{ steps.native.outputs.digest }}
          # this workflow at the release that built the image (an immutable tag of axiz-workflows)
          BUILDER: https://github.com/axiz/axiz-workflows/.github/workflows/service-ci.yaml@v1.0.0 # x-release-please-version
        run: |
          echo "$NEXUS_PASSWORD" | cosign login "$REGISTRY" -u "$NEXUS_USERNAME" --password-stdin
          # shellcheck disable=SC2086 # arguments are split on purpose
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json $MODULE_ARGS
          for digest in "$JVM_DIGEST" "$NATIVE_DIGEST"; do
            [ -n "$digest" ] || continue
            ref="$REGISTRY/axiz/$SERVICE@$digest"
            cosign sign --yes --tlog-upload=false --key "$SIGNING_KEY" \
              -a "repository=$GITHUB_REPOSITORY" -a "commit=$GITHUB_SHA" "$ref"
            cosign attest --yes --tlog-upload=false --key "$SIGNING_KEY" \
              --type cyclonedx --predicate "$MODULE_DIR/target/bom.json" "$ref"
            # SLSA v1 provenance: which workflow (and its commit) built which source commit, in
            # which run. The admission policy can require it before an image runs.
            jq -n \
              --arg builder "$BUILDER" \
              --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
              --arg event "$GITHUB_EVENT_NAME" --arg service "$SERVICE" --arg started "$STARTED" \
              '{buildDefinition: {buildType: "https://github.com/axiz/axiz-workflows/service-ci/v1",
                  externalParameters: {repository: $repo, ref: $ref, service: $service},
                  internalParameters: {event: $event},
                  resolvedDependencies: [{uri: ("git+" + $repo + "@" + $ref), digest: {gitCommit: $sha}}]},
                runDetails: {builder: {id: $builder}, metadata: {invocationId: $run, startedOn: $started}}}' \
              > provenance.json
            cosign attest --yes --tlog-upload=false --key "$SIGNING_KEY" \
              --type slsaprovenance1 --predicate provenance.json "$ref"
          done
      - name: Summary
        env:
          DIGEST: ${{ steps.jvm.outputs.digest }}
        run: |
          {
            echo "### $SERVICE image"
            echo "- tag: \`$GITHUB_SHA\`"
            echo "- digest: \`$DIGEST\`"
            [ -n "$SIGNING_KEY" ] && echo "- signed with cosign (AWS KMS); SBOM and SLSA provenance attested" || echo "- NOT signed (AXIZ_ALLOW_UNSIGNED_IMAGES): rejected by clusters that verify signatures"
          } >> "$GITHUB_STEP_SUMMARY"
