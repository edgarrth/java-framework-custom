name: build-inputs
description: Validate public build parameters and bind the checkout to the immutable reusable-workflow release.
inputs:
  kind:
    description: maven-library, service, or internal native-component producer
    default: maven-library
  service:
    description: Service capability name
    default: ''
  module:
    description: Service Maven module path
    default: '.'
  chart:
    description: Source Helm chart directory
    default: ''
  variant:
    description: jvm or native
    default: jvm
  platforms:
    description: JSON array of actual image platforms
    default: '["linux/amd64"]'
  base-image:
    description: Base image registry reference pinned by digest, or scratch for a static native image
    default: ''
  version:
    description: Final Maven release version
    required: true
  source-sha:
    description: Full source commit, equal to the producer run commit
    required: true
  maven-args:
    description: JSON array of public allowlisted Maven properties
    default: '[]'
  axiz-version:
    description: Axiz dependency version for tools (omit for the framework)
    default: ''
  candidate:
    description: Optional readable final-version/attempt label
    default: ''
  native-module:
    description: Optional Maven module whose signed native components must accompany the library
    default: ''
  native-binary:
    description: Native executable name, paired with native-module and native-platforms
    default: ''
  native-platforms:
    description: JSON array of required native component platforms
    default: '[]'
  token:
    description: Read-only immutable workflow release token
    required: true
  candidate-bundle:
    description: Optional signature-verified framework dependency bundle
    default: ''
  candidate-manifest-sha256:
    description: External expected framework dependency manifest identity
    default: ''
outputs:
  python:
    description: Isolated Python executable
    value: ${{ steps.prepare.outputs.python }}
  metadata:
    description: Validated metadata file
    value: ${{ steps.prepare.outputs.metadata }}
  arguments:
    description: Validated NUL-delimited Maven arguments file
    value: ${{ steps.prepare.outputs.arguments }}
  tools:
    description: Trusted build tools directory
    value: ${{ steps.prepare.outputs.tools }}
runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        BUILD_VERSION: ${{ inputs.version }}
        BUILD_KIND: ${{ inputs.kind }}
        SERVICE: ${{ inputs.service }}
        MODULE: ${{ inputs.module }}
        CHART: ${{ inputs.chart }}
        VARIANT: ${{ inputs.variant }}
        PLATFORMS: ${{ inputs.platforms }}
        BASE_IMAGE: ${{ inputs.base-image }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        MAVEN_ARGUMENTS: ${{ inputs.maven-args }}
        AXIZ_VERSION: ${{ inputs.axiz-version }}
        CANDIDATE: ${{ inputs.candidate }}
        NATIVE_MODULE: ${{ inputs.native-module }}
        NATIVE_BINARY: ${{ inputs.native-binary }}
        NATIVE_PLATFORMS: ${{ inputs.native-platforms }}
        GH_TOKEN: ${{ inputs.token }}
        GH_HOST: github.com
        WORKFLOWS_TAG: v2.0.0 # x-release-please-version
        CANDIDATE_BUNDLE: ${{ inputs.candidate-bundle }}
        CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate-manifest-sha256 }}
      run: |
        set -euo pipefail
        temporary=$(mktemp -d "$RUNNER_TEMP/axiz-build-inputs.XXXXXXXX")
        python3 -m venv "$temporary/python"
        python="$temporary/python/bin/python"
        if [[ ! -x "$python" ]]; then python="$temporary/python/Scripts/python.exe"; fi
        tools="$GITHUB_ACTION_PATH/../build-manifest"
        "$python" -m pip install --quiet -r "$tools/requirements.txt"
        "$python" "$tools/prepare.py" --output "$temporary/metadata.json" --arguments "$temporary/arguments"
        {
          echo "python=$python"
          echo "metadata=$temporary/metadata.json"
          echo "arguments=$temporary/arguments"
          echo "tools=$tools"
        } >> "$GITHUB_OUTPUT"
