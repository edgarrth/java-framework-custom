name: gitops-update
description: >-
  Writes the release of a service in one environment (environments/<env>/<service>.yaml) to the
  GitOps repository and pushes it; Argo CD (ApplicationSet in gitops/) turns each file into an
  Application. Retries on concurrent pushes. Inputs are validated before anything is written.
inputs:
  token:
    description: Token allowed to push to the GitOps repository (GitHub App installation token)
    required: true
  repository:
    description: GitOps repository (owner/name)
    required: true
  service:
    description: Service name (kebab-case)
    required: true
  environment:
    description: dev, qa or prod
    required: true
  source-repository:
    description: URL of the service repository that holds the chart
    required: true
  revision:
    description: Commit of the service repository (chart and values to use)
    required: true
  chart:
    description: Chart directory inside the service repository
    required: true
  image-tag:
    description: Image tag
    required: true
  image-digest:
    description: Image digest (sha256:...), optional
    default: ""
outputs:
  commit:
    description: Commit created in the GitOps repository
    value: ${{ steps.push.outputs.commit }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        REVISION: ${{ inputs.revision }}
        CHART: ${{ inputs.chart }}
        TAG: ${{ inputs.image-tag }}
        DIGEST: ${{ inputs.image-digest }}
        SOURCE: ${{ inputs.source-repository }}
      run: |
        fail() { echo "::error::$1"; exit 1; }
        [[ "$SERVICE" =~ ^[a-z][a-z0-9-]{1,50}$ ]] || fail "invalid service name"
        [[ "$ENVIRONMENT" =~ ^(dev|qa|prod)$ ]] || fail "invalid environment"
        [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || fail "revision must be a full commit SHA"
        [[ "$CHART" =~ ^[A-Za-z0-9._/-]+$ && "$CHART" != *..* ]] || fail "invalid chart path"
        [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || fail "invalid image tag"
        [[ -z "$DIGEST" || "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "invalid image digest"
        [[ "$SOURCE" =~ ^https://[A-Za-z0-9./_-]+$ ]] || fail "invalid source repository"
    - name: Write and push the release
      id: push
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        REVISION: ${{ inputs.revision }}
        CHART: ${{ inputs.chart }}
        TAG: ${{ inputs.image-tag }}
        DIGEST: ${{ inputs.image-digest }}
        SOURCE: ${{ inputs.source-repository }}
      run: |
        set -euo pipefail
        workdir=$(mktemp -d)
        git clone --quiet --depth 20 \
          "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" "$workdir"
        cd "$workdir"
        git config user.name "axiz-deploy[bot]"
        git config user.email "axiz-deploy@users.noreply.github.com"
        file="environments/${ENVIRONMENT}/${SERVICE}.yaml"
        mkdir -p "$(dirname "$file")"
        write() {
          cat > "$file" <<YAML
        # Managed by the service-cd workflow of ${SOURCE}; do not edit by hand.
        service: ${SERVICE}
        environment: ${ENVIRONMENT}
        source:
          repoURL: ${SOURCE}
          revision: ${REVISION}
          chart: ${CHART}
        image:
          tag: "${TAG}"
          digest: "${DIGEST}"
        deployedBy: "${GITHUB_ACTOR}"
        run: "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        YAML
        }
        for attempt in 1 2 3 4 5; do
          write
          git add "$file"
          if git diff --cached --quiet; then
            echo "release already recorded"; break
          fi
          git commit --quiet -m "deploy(${ENVIRONMENT}): ${SERVICE} ${TAG}"
          if git push --quiet origin HEAD; then break; fi
          [ "$attempt" = 5 ] && { echo "::error::could not push to ${REPOSITORY}"; exit 1; }
          sleep $((attempt * 3))
          git fetch --quiet origin && git reset --quiet --hard "origin/$(git rev-parse --abbrev-ref HEAD)"
        done
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        rm -rf "$workdir"
