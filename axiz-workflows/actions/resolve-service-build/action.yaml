name: resolve-service-build
description: Resolve an automatic deployment from a signed producer proof, with read-only Actions and GitOps access.
inputs:
  repository: {description: Expected source repository, required: true}
  service: {description: Expected service capability name, required: true}
  module: {description: Expected source module, default: '.'}
  token: {description: Read-only Actions credential for the producer repository, required: true}
  gitops-repository: {description: Expected GitOps owner/repository, required: true}
  gitops-read-token: {description: Read-only GitOps contents credential, required: true}
  gitops-branch: {description: Authorized GitOps branch, default: main}
  environment: {description: Automatic promotion environment, default: dev}
  workflows-tag:
    description: Allowed immutable workflow release
    default: v2.0.0 # x-release-please-version
outputs:
  eligible: {description: A signed product build was found and verified, value: '${{ steps.resolve.outputs.eligible }}'}
  build-run-id: {description: Verified producer execution, value: '${{ steps.resolve.outputs.build-run-id }}'}
  build-run-attempt: {description: Verified producer attempt, value: '${{ steps.resolve.outputs.build-run-attempt }}'}
  manifest-sha256: {description: External hash from the verified signed producer proof, value: '${{ steps.resolve.outputs.manifest-sha256 }}'}
  values-revision: {description: Approved source commit used for environment values, value: '${{ steps.resolve.outputs.values-revision }}'}
  previous-manifest-sha256: {description: Current predecessor observed in an immutable GitOps commit, value: '${{ steps.resolve.outputs.previous-manifest-sha256 }}'}
  environment: {description: Effective automatic environment, value: '${{ steps.resolve.outputs.environment }}'}
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
    - name: Verify producer proof and read the GitOps predecessor
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_HOST: github.com
        GITOPS_READ_TOKEN: ${{ inputs.gitops-read-token }}
        SOURCE_REPOSITORY: ${{ inputs.repository }}
        SERVICE: ${{ inputs.service }}
        MODULE: ${{ inputs.module }}
        GITOPS_REPOSITORY: ${{ inputs.gitops-repository }}
        GITOPS_BRANCH: ${{ inputs.gitops-branch }}
        ENVIRONMENT: ${{ inputs.environment }}
        WORKFLOWS_TAG: ${{ inputs.workflows-tag }}
      run: |
        set -euo pipefail
        work=$(mktemp -d "$RUNNER_TEMP/axiz-service-proof.XXXXXXXX")
        trap 'rm -rf -- "$work"' EXIT
        python3 -m venv "$work/venv"
        python="$work/venv/bin/python"
        "$python" -m pip install --quiet -r "$GITHUB_ACTION_PATH/../build-manifest/requirements.txt"
        "$python" "$GITHUB_ACTION_PATH/../build-manifest/service_build_proof.py" resolve \
          --repository "$SOURCE_REPOSITORY" --service "$SERVICE" --module "$MODULE" \
          --gitops-repository "$GITOPS_REPOSITORY" --gitops-branch "$GITOPS_BRANCH" \
          --environment "$ENVIRONMENT" --workflows-tag "$WORKFLOWS_TAG" --directory "$work/proof"
