# axiz-docs: on pull requests, lint and build the site strictly; on a tag v<x.y.z>, regenerate the
# reference pages from axiz-framework at the same tag and publish that version with mike
# (latest alias moves to it). Pages are served by GitHub Pages of the organization (private).
name: docs

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Framework sources of this version (reference pages)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: axiz/axiz-framework
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main' }}
          path: .framework
          persist-credentials: false
      - name: Reference pages and dashboards are up to date
        run: |
          python -m pip install --quiet -r requirements.txt
          python scripts/sync_reference.py --framework .framework --cli-help scripts/cli-help.txt
          python scripts/dashboards.py
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && ! git diff --quiet -- docs dashboards; then
            echo "::error::generated pages differ from axiz-framework main: run scripts/sync_reference.py"
            git diff --stat -- docs dashboards
            exit 1
          fi
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 "docs/**/*.md" "README.md"
      - name: Dashboards are valid JSON
        run: for f in dashboards/*.json; do python -m json.tool "$f" > /dev/null; done
      - name: Build (strict, broken links and anchors fail)
        run: mkdocs build --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: axiz/axiz-framework
          ref: ${{ github.ref_name }}
          path: .framework
          persist-credentials: false
      - name: Publish this version (mike)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python scripts/sync_reference.py --framework .framework --cli-help scripts/cli-help.txt
          python scripts/dashboards.py
          git config user.name "axiz-docs[bot]"
          git config user.email "axiz-docs@users.noreply.github.com"
          version="${TAG#v}"
          mike deploy --push --update-aliases "${version%.*}" latest
          mike set-default --push latest
