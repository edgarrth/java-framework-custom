# markdownlint (CI): las tablas y los bloques de código hacen inevitables las líneas largas
default: true
MD013: false            # line length
MD033:                  # HTML en línea que usan las grids de mkdocs-material
  allowed_elements: [div, br]
MD041: false            # las páginas generadas empiezan con un comentario
MD046:
  style: fenced
MD024:
  siblings_only: true
# Las páginas de referencia generadas conservan la disposición de tablas de los documentos de origen; MkDocs en modo estricto verifica su estructura.
MD060: false
