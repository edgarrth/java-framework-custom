# Exceptions name exact non-production fixtures; no vulnerability/CVE is excluded.
ignorefile: .trivyignore.yaml
# Regression engines are private development tools; their vulnerabilities remain scanned.
pkg:
  include-dev-deps: true

# Registry scanning follows the selected publication backend; admission also enforces namespace,
# digest and signature. Scanner registry recognition is not a substitute for admission.
rego:
  data:
    - .github/security/trivy-data
