# axiz-tools pipeline (shared axiz workflows):
#   pull request  pr checks + build of the CLI, the initializr and the recipes
#   develop       SNAPSHOT of the recipes and the CLI published to Nexus
#   main          initializr image, deployed to dev and qa (GitOps, applied by Argo CD)
#   tag v*        release: recipes to Nexus, CLI jar and native binaries attached to the GitHub
#                 release, initializr image deployed to prod after approval
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["v*"]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  axiz-workflows-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify immutable Axiz workflow release
        env:
          GH_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN || github.token }}
          GH_HOST: github.com
          AXIZ_WORKFLOWS_VERSION: v1.0.0 # x-release-please-version
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/axiz/axiz-workflows/releases/tags/$AXIZ_WORKFLOWS_VERSION")
          jq -e --arg tag "$AXIZ_WORKFLOWS_VERSION" '.tag_name == $tag and .immutable == true and .draft == false' <<< "$release" >/dev/null

  pr:
    needs: axiz-workflows-trust
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.event_name == 'pull_request') }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/pr.yaml@v1.0.0
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      AXIZ_NAMING_GUARD: ${{ secrets.AXIZ_NAMING_GUARD }}

  build:
    needs: axiz-workflows-trust
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/lib-publish.yaml@v1.0.0
    with:
      stage: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # recipes and CLI reach Nexus only after the build and the initializr checks passed (and, on
  # tags, the native binaries): the staged artifacts of this run are promoted, never rebuilt
  publish:
    needs: [axiz-workflows-trust, build, initializr, cli-native]
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (!cancelled()       && needs.build.result == 'success'       && needs.initializr.result == 'success'       && (needs.cli-native.result == 'success' || needs.cli-native.result == 'skipped')       && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))) }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/lib-promote.yaml@v1.0.0
    # release provenance: attached to the GitHub release, signed with the KMS key (OIDC)
    permissions:
      contents: write
      id-token: write
    secrets:
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  cli-native:
    needs: [axiz-workflows-trust, build]
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (startsWith(github.ref, 'refs/tags/v')) }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/native.yaml@v1.0.0
    with:
      module: axiz-cli
      binary: axiz
      release: true
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  initializr:
    needs: [axiz-workflows-trust, build]
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/service-ci.yaml@v1.0.0
    with:
      service: axiz-initializr
      module: axiz-initializr
      openapi: axiz-initializr/docs/openapi.yaml
      chart: axiz-initializr/deploy/helm/axiz-initializr
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_DOCKER_REGISTRY: ${{ secrets.NEXUS_DOCKER_REGISTRY }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  initializr-dev:
    needs: [axiz-workflows-trust, initializr]
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (github.ref == 'refs/heads/main') }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1.0.0
    with:
      service: axiz-initializr
      environment: dev
      chart: axiz-initializr/deploy/helm/axiz-initializr
      image-tag: ${{ needs.initializr.outputs.image-tag }}
      image-digest: ${{ needs.initializr.outputs.image-digest }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  initializr-qa:
    needs: [axiz-workflows-trust, initializr, initializr-dev]
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1.0.0
    with:
      service: axiz-initializr
      environment: qa
      chart: axiz-initializr/deploy/helm/axiz-initializr
      image-tag: ${{ needs.initializr.outputs.image-tag }}
      image-digest: ${{ needs.initializr.outputs.image-digest }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

  initializr-prod:
    needs: [axiz-workflows-trust, initializr]
    if: ${{ needs.axiz-workflows-trust.result == 'success' && (startsWith(github.ref, 'refs/tags/v')) }}
    # Immutable internal release: axiz-workflows-trust must succeed first.
    # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    uses: axiz/axiz-workflows/.github/workflows/service-cd.yaml@v1.0.0
    with:
      service: axiz-initializr
      environment: prod
      chart: axiz-initializr/deploy/helm/axiz-initializr
      image-tag: ${{ needs.initializr.outputs.image-tag }}
      image-digest: ${{ needs.initializr.outputs.image-digest }}
    secrets:
      AXIZ_WORKFLOWS_READ_TOKEN: ${{ secrets.AXIZ_WORKFLOWS_READ_TOKEN }}
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
