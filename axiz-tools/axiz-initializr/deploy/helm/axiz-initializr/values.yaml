# Defaults of the axiz-initializr chart; values-<env>.yaml override them per environment.
nameOverride: ""
environment: dev

image:
  repository: ghcr.io/edgarrth/java-framework-custom/axiz-initializr
  tag: ""          # set by the deployment (GitOps): the commit of the image
  digest: ""       # set by the deployment (GitOps): pins the signed image
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}  # eks.amazonaws.com/role-arn per environment (IRSA)
  # the pods never call the Kubernetes API (configuration is mounted as files); the AWS identity
  # (IRSA or EKS Pod Identity) uses its own projected token
  automountToken: false

# shared configuration of the namespace (optional ConfigMap, mounted before the service's own)
sharedConfigMap: axiz-common

javaOpts: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
env: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

replicaCount: 2
terminationGracePeriodSeconds: 90
service:
  port: 80
probes:
  startupFailureThreshold: 30
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  maxUnavailable: 1
topologySpread:
  whenUnsatisfiable: ScheduleAnyway   # DoNotSchedule in prod (values-prod.yaml)

networkPolicy:
  enabled: true
  ingressNamespaces: []   # namespaces allowed to call the service (ingress, gateway, callers)
  # Outbound traffic is denied except DNS and what is listed here
  egress:
    sameNamespace: true   # sibling services of the namespace
    namespaces: []        # other namespaces this service calls
    cidrs: []             # e.g. {cidr: 10.20.0.0/16, ports: [443, 5432]}: VPC endpoints, Aurora,
                          # ElastiCache, MSK, partners. Fill per environment (values-<env>.yaml)

# ConfigMap axiz-initializr (application.yaml): environment values, flat Spring Boot keys
config: {}

# ConfigMap axiz-initializr-errors: error catalog (code, category, title, detail keys...)
errors: []

externalSecret:
  enabled: true
  storeName: aws-secrets-manager
  refreshInterval: 1h
  remotePrefix: dev/axiz-initializr
  keys:
    - spring.security.oauth2.client.registration.sso.client-secret
    - spring.security.oauth2.client.registration.github.client-secret
    - axiz.initializr.publication-key
    - spring.data.redis.password
