# Valores por defecto del chart axiz-initializr; values-<env>.yaml los sobrescribe por entorno.
nameOverride: ""
environment: dev

image:
  repository: ghcr.io/edgarrth/java-framework-custom/axiz-initializr
  tag: ""          # lo define el despliegue (GitOps): el commit de la imagen
  digest: ""       # lo define el despliegue (GitOps): fija la imagen firmada
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}  # eks.amazonaws.com/role-arn por entorno (IRSA)
  # los pods nunca invocan la API de Kubernetes (la configuración se monta como archivos); la identidad de AWS
  # (IRSA o EKS Pod Identity) usa su propio token proyectado
  automountToken: false

# configuración compartida del namespace (ConfigMap opcional, montado antes que el propio del servicio)
sharedConfigMap: axiz-common

javaOpts: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
env: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

replicaCount: 2
terminationGracePeriodSeconds: 90
service:
  port: 80
probes:
  startupFailureThreshold: 30
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  maxUnavailable: 1
topologySpread:
  whenUnsatisfiable: ScheduleAnyway   # DoNotSchedule en prod (values-prod.yaml)

networkPolicy:
  enabled: true
  ingressNamespaces: []   # namespaces autorizados a invocar el servicio (ingress, gateway, invocadores)
  # El tráfico saliente se deniega salvo DNS y lo que se lista aquí
  egress:
    sameNamespace: true   # servicios hermanos del namespace
    namespaces: []        # otros namespaces que invoca este servicio
    cidrs: []             # e.g. {cidr: 10.20.0.0/16, ports: [443, 5432]}: VPC endpoints, Aurora,
                          # ElastiCache, MSK, socios. Se completa por entorno (values-<env>.yaml)

# ConfigMap axiz-initializr (application.yaml): valores del entorno, claves planas de Spring Boot
config: {}

# ConfigMap axiz-initializr-errors: catálogo de errores (código, categoría, título, claves de detalle...)
errors: []

externalSecret:
  enabled: true
  storeName: aws-secrets-manager
  refreshInterval: 1h
  remotePrefix: dev/axiz-initializr
  keys:
    - spring.security.oauth2.client.registration.sso.client-secret
    - spring.security.oauth2.client.registration.github.client-secret
    - axiz.initializr.publication-key
    - spring.data.redis.password
