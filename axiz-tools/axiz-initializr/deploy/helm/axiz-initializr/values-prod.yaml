# axiz-initializr in prod
environment: prod

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/axiz-initializr-prod

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

topologySpread:
  whenUnsatisfiable: DoNotSchedule   # replicas in different zones, always

networkPolicy:
  egress:
    # destinations outside the cluster this service reaches in prod (VPC endpoints of
    # the AWS services it uses, databases, brokers, partners), with their ports
    cidrs: []

externalSecret:
  remotePrefix: prod/axiz-initializr

config:
  axiz.config.environment: prod
  management.tracing.sampling.probability: "0.1"
  # set per environment:
  # spring.security.oauth2.resourceserver.jwt.issuer-uri: https://sso.example/realms/axiz
  # spring.security.oauth2.client.provider.sso.issuer-uri: https://sso.example/realms/axiz
  # spring.security.oauth2.client.registration.sso.client-id: axiz-initializr
  # axiz.initializr.audience: axiz-initializr   (aud that the API accepts in bearer tokens)
  # spring.security.oauth2.client.registration.github.client-id: <GitHub OAuth app>
  #   (callback of that OAuth app: https://<initializr host>/authorized/github)
  # axiz.initializr.github-organization: <organization>

errors: []
