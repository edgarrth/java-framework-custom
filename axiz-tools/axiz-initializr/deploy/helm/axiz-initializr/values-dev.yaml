# axiz-initializr en dev
environment: dev

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/axiz-initializr-dev

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

networkPolicy:
  egress:
    # destinos fuera del clúster a los que este servicio llega en dev (VPC endpoints de
    # los servicios de AWS que usa, bases de datos, brokers, socios), con sus puertos
    cidrs: []

externalSecret:
  remotePrefix: dev/axiz-initializr

config:
  axiz.config.environment: dev
  management.tracing.sampling.probability: "1.0"
  # se define por entorno:
  # spring.security.oauth2.resourceserver.jwt.issuer-uri: https://sso.example/realms/axiz
  # spring.security.oauth2.client.provider.sso.issuer-uri: https://sso.example/realms/axiz
  # spring.security.oauth2.client.registration.sso.client-id: axiz-initializr
  # axiz.initializr.audience: axiz-initializr   (aud que la API acepta en los bearer tokens)
  # spring.security.oauth2.client.registration.github.client-id: <GitHub OAuth app>
  #   (callback de esa OAuth app: https://<initializr host>/authorized/github)
  # axiz.initializr.github-organization: <organization>

errors: []

# El ingress debe mantener la afinidad de sesión si omite el Service ClusterIP.
# spring.data.redis.host, port y username se definen en el ConfigMap del entorno; la contraseña y
# axiz.initializr.publication-key provienen del ExternalSecret. Debe permitirse el egress a Redis con TLS.
