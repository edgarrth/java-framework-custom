{{- if .Values.networkPolicy.enabled }}
# Ingress only from the allowed namespaces (gateway/ingress and callers); egress is open to AWS
# endpoints and downstream services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    {{- if .Values.networkPolicy.ingressNamespaces }}
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
{{- end }}
