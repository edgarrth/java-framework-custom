{{- if .Values.networkPolicy.enabled }}
# Denegación por defecto en ambas direcciones. Ingress: solo los namespaces listados (gateway/ingress, invocadores)
# en el puerto HTTP. Egress: DNS, opcionalmente los pods del mismo namespace, los namespaces
# listados y los CIDR listados (VPC endpoints, bases de datos gestionadas, brokers, socios); todo lo
# demás se bloquea, lo que limita lo que puede alcanzar un pod comprometido.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    {{- if .Values.networkPolicy.ingressNamespaces }}
    # solo los namespaces permitidos (gateway/ingress e invocadores)
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector: {}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
  egress:
    # resolución de nombres (DNS del clúster)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egress }}
    {{- if .sameNamespace }}
    # servicios hermanos del namespace
    - to:
        - podSelector: {}
    {{- end }}
    {{- range .namespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- range .cidrs }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
