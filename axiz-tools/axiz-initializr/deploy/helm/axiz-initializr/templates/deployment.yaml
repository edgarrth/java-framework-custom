apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
        axiz.io/environment: {{ .Values.environment | quote }}
      annotations:
        # La recarga del ConfigMap está deshabilitada: un cambio de configuración reinicia los pods de forma escalonada
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/errors: {{ include (print $.Template.BasePath "/configmap-errors.yaml") . | sha256sum }}
    spec:
      {{- include "service.podSpec" (dict "root" . "server" true) | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          # ScheduleAnyway sigue programando pods cuando una zona está llena; DoNotSchedule garantiza la
          # distribución (servicios críticos, clústeres con capacidad en todas las zonas)
          whenUnsatisfiable: {{ (.Values.topologySpread | default dict).whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              {{- include "service.selectorLabels" . | nindent 14 }}
