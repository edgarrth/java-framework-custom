openapi: 3.1.0
info:
  title: axiz initializr API
  version: 1.0.0
  description: >-
    Generates axiz projects. Authentication with a bearer token of the corporate identity provider
    (CLI, automations) or the SSO session of the web UI.
security:
  - bearer: []
tags:
  - name: catalog
  - name: projects
paths:
  /v1/metadata:
    get:
      operationId: getMetadata
      tags: [catalog]
      summary: Archetypes, styles and capabilities with their rules
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metadata'}
              example: {frameworkVersion: 2.0.0, archetypes: [], structures: [], capabilities: []}
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/projects:
    post:
      operationId: generateProject
      tags: [projects]
      summary: Generates a project as a ZIP
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectRequest'}
            example: {name: payment-orders, groupId: pe.axiz.payments, basePackage: pe.axiz.payments.orders, archetype: business, openApi: "openapi: 3.1.0 ..."}
      responses:
        '503':
          description: Operation budget unavailable; no work was admitted
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: Subject quota or generation capacity exhausted
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '200':
          description: The project
          content:
            application/zip:
              schema: {type: string, format: binary}
        '422':
          description: The request cannot be generated (problems and contract findings)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/projects/validate:
    post:
      operationId: validateProject
      tags: [projects]
      summary: Validates a request without generating it
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectRequest'}
            example: {name: payment-orders, groupId: pe.axiz.payments, basePackage: pe.axiz.payments.orders, archetype: business}
      responses:
        '503':
          description: Operation budget unavailable; no work was admitted
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: Subject quota or generation capacity exhausted
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '200':
          description: Validation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Validation'}
              example: {valid: false, problems: ["Archetype business exposes REST: an OpenAPI 3.1 contract is required"], findings: []}
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/projects/github:
    post:
      operationId: createRepository
      tags: [projects]
      summary: Generates or resumes a private GitHub repository publication
      description: >-
        Requires the authenticated browser session's GitHub grant with repo and workflow scopes.
        The grant is consumed after local validation and before remote publication. Retry partial publication with a fresh grant,
        the same subject, Idempotency-Key and identical project/generator version. The description
        is limited to 160 characters for this operation. Existing unrelated repositories or
        intervening commits produce a conflict and are never overwritten or deleted.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable publication operation, reused for every retry of the identical project
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GitHubProjectRequest'}
            example: {name: payment-orders, groupId: pe.axiz.payments, basePackage: pe.axiz.payments.orders, archetype: business}
      responses:
        '400':
          description: Invalid Idempotency-Key or publication input; local validation preserves the grant
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: Subject quota or generation capacity exhausted
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
              example: {repository: acme/payment-orders, url: https://github.com/acme/payment-orders, operationId: "4a096e3a-981f-4ef5-9a33-df14a9234632"}
        '403':
          description: The user has not authorized GitHub yet; open `authorize` in the browser and retry
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example: {type: "https://axiz.dev/problems/authorization-required", title: Authorization required, status: 403, registration: github, authorize: /oauth2/authorization/github}
        '409':
          description: GitHub definitively rejected a write, or repository ownership/content differs; inspect before continuing
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: Publication or quota service unavailable; preserve operation and request
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: The request cannot be generated
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/contracts/lint:
    post:
      operationId: lintContract
      tags: [catalog]
      summary: Lints a contract with the corporate rules
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string}
            example: "openapi: 3.1.0"
      responses:
        '503':
          description: Operation budget unavailable; no work was admitted
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: Subject quota or generation capacity exhausted
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '200':
          description: Findings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Validation'}
              example: {valid: true, findings: []}
        '400':
          description: Not an OpenAPI 3 document
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    ProjectRequest:
      type: object
      required: [name, groupId, basePackage, archetype]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', maxLength: 60}
        groupId: {type: string, maxLength: 120}
        basePackage: {type: string, maxLength: 120}
        description: {type: string, maxLength: 300}
        archetype: {type: string}
        structure: {type: string}
        stack: {type: string, enum: [servlet, reactive]}
        persistence: {type: string, enum: [none, aurora, dynamodb]}
        capabilities: {type: array, maxItems: 30, items: {type: string}}
        openApi: {type: string, maxLength: 2097152}
        asyncApi: {type: string, maxLength: 2097152}
        frameworkVersion: {type: string}
    GitHubProjectRequest:
      allOf:
        - $ref: '#/components/schemas/ProjectRequest'
        - type: object
          properties:
            description: {type: string, maxLength: 160}
    Metadata:
      type: object
      properties:
        frameworkVersion: {type: string}
        archetypes: {type: array, items: {type: object}}
        structures: {type: array, items: {type: object}}
        capabilities: {type: array, items: {type: object}}
    Validation:
      type: object
      properties:
        valid: {type: boolean}
        problems: {type: array, items: {type: string}}
        findings: {type: array, items: {$ref: '#/components/schemas/Finding'}}
    Finding:
      type: object
      properties:
        rule: {type: string}
        severity: {type: string, enum: [error, warn]}
        location: {type: string}
        message: {type: string}
    Repository:
      type: object
      required: [repository, url, operationId]
      properties:
        operationId: {type: string, format: uuid}
        repository: {type: string}
        url: {type: string, format: uri}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        field: {type: string, enum: [description, files, content]}
        operationId: {type: string, format: uuid}
        phase: {type: string, enum: [PREFLIGHT, REPOSITORY_CREATE_UNKNOWN, CONTENT_PENDING, BRANCH_UPDATE_UNKNOWN, CONFLICT]}
        repository: {type: string}
        problems: {type: array, items: {type: string}}
        registration: {type: string, description: OAuth client the user must authorize (403)}
        authorize: {type: string, description: URL that starts that authorization in the browser (403)}
