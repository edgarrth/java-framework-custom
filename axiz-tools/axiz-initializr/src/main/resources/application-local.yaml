# Local profile (--spring.profiles.active=local) against the Keycloak of the demo
# (axiz-demo: scripts/demo.sh up, realm axiz, client axiz-initializr). Port 8090: 8080-8086 are the
# demo services. The client secret is a local-only placeholder that matches
# axiz-demo/local/keycloak/axiz-realm.json; real environments mount it (AXIZ_SSO_CLIENT_SECRET).
server:
  port: 8090
spring:
  security:
    oauth2:
      client:
        registration:
          sso:
            client-secret: ${AXIZ_SSO_CLIENT_SECRET:local-only-initializr}
            # the demo realm defines no "email" client scope; Keycloak rejects unknown scopes
            scope: [openid, profile]
axiz:
  config:
    environment: local
  logging:
    json: false
