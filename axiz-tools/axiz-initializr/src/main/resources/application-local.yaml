# Perfil local (--spring.profiles.active=local) contra el Keycloak de la demo
# (axiz-demo: scripts/demo.sh up, realm axiz, cliente axiz-initializr). Puerto 8090: 8080-8086 son los
# servicios de la demo. El client secret es un marcador de posición solo local que coincide con
# axiz-demo/local/keycloak/axiz-realm.json; los entornos reales lo montan (AXIZ_SSO_CLIENT_SECRET).
server:
  port: 8090
  servlet:
    session:
      cookie:
        secure: false
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AXIZ_SSO_ISSUER:http://localhost:8180/realms/axiz}
      client:
        provider:
          sso:
            issuer-uri: ${AXIZ_SSO_ISSUER:http://localhost:8180/realms/axiz}
        registration:
          sso:
            client-secret: ${AXIZ_SSO_CLIENT_SECRET:local-only-initializr}
            # el realm de la demo no define el client scope "email"; Keycloak rechaza los scopes desconocidos
            scope: [openid, profile]
axiz:
  config:
    environment: local
  logging:
    json: false
